<title id="v2015-title">THE LEGENDARY POET — v20.15 emissive-current master</title>
<desc id="v2015-desc">Static QA-only master with an almost-black hooded monolith and saturated electric-blue currents that originate on the hood, shoulders and cloak edge, then branch outward from those contact points without forming a detached aura.</desc>
