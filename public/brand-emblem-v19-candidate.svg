<title id="v19-title">THE LEGENDARY POET — v19.6 SVG candidate</title>
<desc id="v19-desc">Квадратный погрудный образ в массивном многослойном капюшоне с широкой чисто чёрной полостью лица, тяжёлыми плечами, смятым многослойным клобуком, крупными диагональными складками и нерегулярной электрической аурой только за головой и верхними боками.</desc>
