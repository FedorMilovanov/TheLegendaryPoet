  <title id="v19-title">THE LEGENDARY POET — v19 candidate</title>
  <desc id="v19-desc">Квадратный погрудный образ в массивном остром капюшоне с огромной чёрной пустотой лица, тяжёлым смятым клобуком, широкими плечами, крупными диагональными складками и неровной электрической аурой за головой и верхней частью фигуры.</desc>
