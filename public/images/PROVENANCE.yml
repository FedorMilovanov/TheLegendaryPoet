schema_version: 1
reviewed_at: 2026-09-10
scope: public/images
policy:
  purpose: >-
    Distinguish locally produced editorial artwork from archival evidence. A local
    cover or reconstruction is never treated as a primary-source photograph.
  public_source_rule: >-
    Archival originals require an item-level source URL, rights statement, credit
    line, access date, and SHA-256. Project-created editorial visuals may be used
    as site artwork, but their generation/restoration record must remain explicit.
  pending_rule: >-
    PENDING-GENERATION-RECORD is not a rights clearance. It is an honest queue for
    recovering the original generation prompt, source/reference set, creator/tool
    record, and approval date before reuse outside this project.
  poet_portrait_release_rule: >-
    Every published Poet.photo must resolve to an item-level role=poet_portrait
    record with matching poet_id. New registrations require release-approved
    provenance and exact bytes; LEGACY-PROVENANCE-UNRESOLVED is never valid for a
    new registration.
  legacy_poet_portrait_rule: >-
    The ten canonical portraits already published at Product
    main@49337c0ab502b056ee503995ae0fa0051c693962 have unknown item-level origin in
    the current repository record. They are recorded honestly as a frozen legacy
    boundary with exact git blob identity, not promoted to archival evidence and
    not assigned guessed source, rights or credit metadata.

