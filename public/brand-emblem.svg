<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">THE LEGENDARY POET</title>
<desc id="desc">Таинственная фигура в глубоком капюшоне с холодным голубым ореолом и световым ядром</desc>
<defs>
  <radialGradient id="field" cx="64" cy="62" r="58" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0a6a9a" stop-opacity=".22"/>
    <stop offset=".42" stop-color="#04263e" stop-opacity=".28"/>
    <stop offset=".74" stop-color="#03121f" stop-opacity=".18"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo" cx="64" cy="61" r="53" gradientUnits="userSpaceOnUse">
    <stop offset=".62" stop-color="#2ed8ff" stop-opacity="0"/>
    <stop offset=".86" stop-color="#2ed8ff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#7bedff" stop-opacity=".04"/>
  </radialGradient>
  <linearGradient id="cloak" x1="64" y1="34" x2="64" y2="116" gradientUnits="userSpaceOnUse">
