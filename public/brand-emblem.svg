  <title id="t">THE LEGENDARY POET</title>
  <desc id="d">Безликая фигура с высоким многослойным капюшоном, широкой глубокой пустотой лица, резко перехваченной шеей, тяжёлым смятым клобуком, тремя ломанными семействами складок и объёмной холодной верхне-боковой аурой без нижнего дыма</desc>
