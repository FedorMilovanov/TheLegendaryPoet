  <title id="t">THE LEGENDARY POET</title>
  <desc id="d">Безликая фигура в высоком многослойном капюшоне, с широкой неровной чёрной пустотой лица, тяжёлым смятым клобуком, тремя разорванными семействами складок и холодной верхне-боковой электрической аурой без нижнего дыма</desc>
