<title id="t">THE LEGENDARY POET</title>
<desc id="d">Безликая фигура в тяжёлом многослойном капюшоне, с глубокой угловатой пустотой лица, компактным тяжёлым клобуком, измеренной по референсу пустотой лица, крупными диагональными складками и привязанной к краям холодной аурой без нижнего дыма</desc>
