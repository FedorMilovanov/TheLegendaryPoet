<title id="t">THE LEGENDARY POET</title>
<desc id="d">Безликая фигура в высоком многослойном капюшоне, с глубокой неровной пустотой лица, смятым перекрывающимся клобуком, тяжёлыми асимметричными складками и рваной холодной верхне-боковой аурой без нижнего дыма</desc>
