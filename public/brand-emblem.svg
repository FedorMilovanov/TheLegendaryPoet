    <stop offset=".7" stop-color="#1587c3" stop-opacity=".42"/>
    <stop offset="1" stop-color="#0c4770" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="fold" x1="35" y1="56" x2="94" y2="109" gradientUnits="userSpaceOnUse">
    <stop stop-color="#35d6ff" stop-opacity=".42"/>
    <stop offset=".58" stop-color="#147ba9" stop-opacity=".2"/>
    <stop offset="1" stop-color="#7bedff" stop-opacity=".08"/>
  </linearGradient>
  <radialGradient id="orb" cx="60" cy="72" r="16" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff"/>
    <stop offset=".25" stop-color="#f3feff"/>
    <stop offset=".58" stop-color="#8debff"/>
    <stop offset=".84" stop-color="#27bde9"/>
    <stop offset="1" stop-color="#0b6f9d"/>
  </radialGradient>
  <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.72 0 0 0 0 1 0 0 0 .72 0"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="orbGlow" x="-260%" y="-260%" width="620%" height="620%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="5.8" result="wide"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.25" result="soft"/>
    <feMerge><feMergeNode in="wide"/><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="lineGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation=".8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="haloClip"><circle cx="64" cy="64" r="52"/></clipPath>
</defs>
