name: Benislavskaya current gate refresh

on:
  push:
    branches:
      - editorial/benislavskaya-publication-20260820
    paths:
      - .github/workflows/benislavskaya-current-gate-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh holder evidence and exact-hero contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          gate = 'docs/research/BENISLAVSKAYA_PUBLICATION_GATE_2026-08.md'
          matrix = 'docs/research/BENISLAVSKAYA_INBOUND_RECONCILIATION_MATRIX_2026-08.md'
          draft = 'src/data/essays/benislavskayaDraft.ts'
          validator = 'scripts/validate-benislavskaya-staged.ts'

          replace(gate,
              'Date: 2026-08-18  \nProduct anchor: `FedorMilovanov/TheLegendaryPoet@d59cceccb0c49af59b1be38d4c547a6240b3005a`',
              'Date: 2026-08-20  \nProduct anchor: `FedorMilovanov/TheLegendaryPoet@ccd5f4c614de9a2e1fd5e4d6de62dd138630ae5c`')
          replace(gate,
              'This lane stages a typed longform draft and the owner-approved editorial hero contract. It does **not** register a new public essay and does not claim that the outstanding correspondence acquisition has been completed.',
              'This clean current-main lane stages a typed longform draft and the owner-approved editorial hero. It does **not** register a new public essay and does not claim that the outstanding correspondence acquisition has been completed.')
          replace(gate,
              'The mismatching blob was removed from the branch rather than accepted by changing the expected hash. The staged validator treats the hero as **pending binary ingestion** while the essay remains unpublished; if a file appears at the intended path, it must match the approved SHA exactly or CI fails.\n\nThe image is a reader-facing editorial reconstruction. It must never be described as an archival photograph, facsimile, restoration, or documentary witness.',
              'The mismatching blob was removed rather than accepted by changing the expected hash. On 2026-08-20 the owner supplied the approved source PNG through a normal Git push. A one-shot current-main materializer then reproduced the exact approved WebP: **132172 bytes**, SHA-256 **`0b1f1146f77ce154479042fc9a1afbe00133528eee14f220b4fa74990bd57e48`**. The temporary materialization workflow was deleted immediately; the clean lane retains only the production WebP, not the 1.9 MB source PNG or transport code. The staged validator now requires the hero to exist and match the approved SHA exactly.\n\n**Hero status: VERIFIED / INGESTION CLOSED.**\n\nThe image is a reader-facing editorial reconstruction. It must never be described as an archival photograph, facsimile, restoration, or documentary witness.')
          replace(gate,
              '## Fresh gate recheck — 2026-08-18\n\n### Gmail / EDD preparation\n\nA fresh search after the previous 2026-08-08 rebaseline found no delivered scan, library response or attachment for the target request.\n\nThe original working range `236–280` was found to be incomplete. The connected academic IMLI chronology cites Benislavskaya\'s 4 May 1925 letter across `Письма, 280–281`. Therefore the corrected request is:\n\n`Сергей Есенин в стихах и жизни. Книга 3: Письма. Документы`, printed pp. **236–281 inclusive (46 pages)**.\n\nThe official Perm M. Gorky Regional Library EDD contact is `mba@gorkilib.ru`. The saved Gmail draft was updated on 2026-08-18 to the corrected 236–281 range and asks the library to confirm availability, exact copying cost, format and turnaround **before** any paid work begins.\n\nStatus: **DRAFT UPDATED / NOT SENT / NO PAYMENT AUTHORIZED**.\n\nNo email is treated as evidence that the request was submitted or fulfilled.',
              '## Fresh gate recheck — 2026-08-20\n\n### Perm Gorky Library / direct holder inspection\n\nThe EDD inquiry was sent and accepted for work. On 2026-08-20 the holder inspected the physical 1995 volume and reported that the older positions dated **18 January** and **8 February 1924** are apparently not present in this edition under those dates. The same holder inspection identifies a Benislavskaya→Yesenin letter dated **4 March 1924 on printed p. 234**, followed by **6 April on p. 236** and **26 April on p. 238**.\n\nThis is a strong holder-specific page signal, but it does **not** prove that the older 18-Jan/8-Feb texts never existed. Their identity, redating or bibliography relationship remains unresolved until the published sequence is collated.\n\nThe old acquisition range `236–281` is therefore known to be too narrow for the complete published sequence. The current requested transaction is the **continuous range beginning with the 4 March item and ending with the 4 May 1925 item on p. 281**. The provisional range is **234–281 inclusive**; the exact first page remains pending because the holder must confirm whether the 4 March letter begins on p. 234 or on an earlier page.\n\nA same-thread follow-up asks for that exact start page, final total price, format and turnaround. **No paid copying is authorized** until the owner separately confirms after the final price is known.\n\nStatus: **REQUEST SENT / HOLDER INSPECTION RECEIVED / RANGE 234–281 PROVISIONAL / EXACT START + PRICE PENDING / NO PAYMENT AUTHORIZED**.')
          replace(gate,
              'A fresh connected-Drive search found the central research registry and academic Yesenin volumes, but **not** the target 1995 pp. 236–281 scan.',
              'A fresh connected-Drive search found the central research registry and academic Yesenin volumes, but **not** the target continuous 1995 correspondence scan.')
          replace(gate,
              'This materially narrows the publication gate. The remaining acquisition problem is the 1995 correspondence range pp. **236–281** and the item-by-item reconciliation it enables.',
              'This materially narrows the publication gate. The remaining acquisition problem is the continuous 1995 correspondence witness, **provisionally pp. 234–281 with the exact first page pending holder confirmation**, and the item-by-item reconciliation it enables.')
          replace(gate,
              '- the corrected **pp. 236–281** remaining acquisition boundary and IMLI 1925 page-map;',
              '- the holder-inspected **p. 234 / p. 236 / p. 238** early sequence and the provisional **pp. 234–281** remaining acquisition boundary;')
          replace(gate,
              '1. obtain and inspect pp. **236–281** of the 1995 `Письма. Документы` volume **or another lawful complete page-level witness of equivalent controlling value for the remaining corpus**;',
              '1. obtain and inspect the continuous 1995 correspondence range beginning with the 4 March 1924 item and ending on p. **281** — provisionally **pp. 234–281**, with the exact first page determined by the holder — **or another lawful complete page-level witness of equivalent controlling value for the remaining corpus**;')
          replace(gate,
              '5. ingest the approved hero bytes and pass the exact SHA guard;\n6. keep the selected hero classified as `reconstruction`;',
              '5. preserve the already-ingested approved hero bytes under the exact SHA guard;\n6. keep the selected hero classified as `reconstruction`;')
          replace(gate,
              '- the Perm EDD request was submitted;\n- the target 1995 pages were paid for or delivered;\n- the 16 July letter was sent, delivered, received or read by Yesenin;\n- the approved hero binary is currently ingested in the repository;',
              '- the holder has delivered the complete continuous 1995 page witness;\n- any paid copying has been authorized or completed;\n- the 16 July letter was sent, delivered, received or read by Yesenin;')

          replace(matrix, 'Date: 2026-08-19', 'Date: 2026-08-20')
          replace(matrix,
              '4. The remaining controlling-book acquisition is `Сергей Есенин в стихах и жизни. Письма. Документы` (1995), printed pp. **236–281 inclusive**.',
              '4. The remaining controlling-book acquisition is the continuous 1995 correspondence sequence beginning with the 4 Mar 1924 item and ending on p. **281**; holder inspection makes **234–281** the provisional range, with the exact first page still pending.')
          replace(matrix,
              '- Remaining controlling witness: 1995 `Письма. Документы`, pp. **236–281**; registry authority `OSR-0345`.',
              '- Remaining controlling witness: 1995 `Письма. Документы`, continuous 4 Mar 1924 → 4 May 1925 sequence; provisional **pp. 234–281**, exact first page pending holder confirmation; registry authority `OSR-0345`.')
          replace(matrix,
              '| 18 Jan 1924 | absent | #121 | no later page/date witness found | unresolved Yushin-only position |',
              '| 18 Jan 1924 | absent | #121 | Perm holder inspected the 1995 volume and reports no letter under this date | **holder negative signal; redating/identity still unresolved** |')
          replace(matrix,
              '| 8 Feb 1924 | absent | #122 | text independently attested in later academic commentary as a Benislavskaya→Yesenin 1924 letter; exact 8-Feb dating remains from earlier layer | **real text, date/identity still unresolved** |',
              '| 8 Feb 1924 | absent | #122 | text is independently attested in later academic commentary as a Benislavskaya→Yesenin 1924 letter, but Perm holder reports no 1995-book letter under 8 Feb | **real text; holder negative signal for this dating; identity/redating unresolved** |')
          replace(matrix,
              '| 4 Mar 1924 | open #1 | #123 | open date agrees with Yushin | probable correspondence |',
              '| 4 Mar 1924 | open #1 | #123 | Perm holder directly identifies the 1995-book item on printed **p. 234** | strong page/date match; exact starting page still to confirm |')
          replace(matrix,
              '| 6 Apr 1924 | open #2 | #124 | academic memoir commentary independently quotes this dated correspondence layer | strong date match; open text has a cut |',
              '| 6 Apr 1924 | open #2 | #124 | academic memoir commentary plus Perm holder direct **p. 236** identification | strong page/date match; open text has a cut |')
          replace(matrix,
              'These are page anchors/spans already supported by academic commentary. Do not infer unseen document boundaries from gaps between them.\n\n- 26 Apr 1924 letter → p. **238** anchor;',
              'These are page anchors/spans already supported by academic commentary or the 2026-08-20 direct holder inspection. Do not infer unseen document boundaries from gaps between them.\n\n- 4 Mar 1924 → holder identifies printed p. **234**; exact beginning page still pending;\n- 6 Apr 1924 → holder identifies printed p. **236**;\n- 26 Apr 1924 letter → p. **238** anchor;')
          replace(matrix,
              'Because the 4 May letter reaches p. 281, the acquisition range is **236–281 inclusive (46 pages)**. A request ending at 280 is incomplete.',
              'Because direct holder inspection moves the first known published item back to p. **234**, the old 236–281 range is now known to be incomplete at the front as well as the earlier 236–280 range being incomplete at the end. The current request is the **continuous 4 Mar 1924 → 4 May 1925 sequence**, provisionally **pp. 234–281**; the exact first page will be set from the holder before paid copying.')
          replace(matrix,
              '- that 18 Jan, 29 Dec or 12 Apr positions are false;',
              '- that 18 Jan, 29 Dec or 12 Apr positions are false; the Perm inspection is a negative signal for the 18-Jan dating, not proof that the underlying text never existed;')
          replace(matrix,
              'When pp. 236–281 arrive, verify in this order:\n\n1. bibliographic identity: title, year, ISBN/edition;\n2. printed-page sequence 236 through 281 with no omissions/duplicates;',
              'When the continuous holder-supplied range arrives, verify in this order:\n\n1. bibliographic identity: title, year, ISBN/edition;\n2. exact first printed page of the 4 Mar item, then continuous sequence through p. 281 with no omissions/duplicates;')
          replace(matrix,
              'The article remains staged. The separate 16 Jul page-witness branch is closed; the remaining research blocker is the lawful 1995 witness pp. **236–281** and item-by-item reconciliation.',
              'The article remains staged. The separate 16 Jul page-witness branch is closed; the remaining research blocker is the lawful continuous 1995 witness, provisionally **pp. 234–281** with exact start pending holder confirmation, and item-by-item reconciliation.')

          replace(draft,
              'Публикационный gate остаётся честно открытым: для финальной reader-версии нужны законные страницы 236–281 издания «Сергей Есенин в стихах и жизни: Письма. Документы» (1995), а не прежний диапазон 236–280 — академическая «Летопись» цитирует письмо Бениславской от 4 мая 1925 года по стр. 280–281. Письмо 16 июля уже имеет отдельный полный академический page-witness: «Летопись» ИМЛИ 2013, с. 339–340; открытым остаётся не чтение его текста, а граница отправки, доставки и прочтения, которую нельзя утверждать без отдельного свидетельства. Наличие staged draft не означает, что основная 14-item reconciliation уже закрыта.',
              'Публикационный gate остаётся честно открытым. Прямой осмотр экземпляра 1995 года Пермской библиотекой сдвинул начало нужной последовательности раньше: письмо от 4 марта находится на стр. 234, 6 апреля — на стр. 236, 26 апреля — на стр. 238; поэтому рабочий диапазон теперь 234–281, причём точную первую страницу ещё должен подтвердить держатель, если письмо 4 марта начинается раньше 234-й. Письма под старыми датами 18 января и 8 февраля библиотека в этом издании не обнаружила, но это пока отрицательный сигнал для датировки, а не доказательство отсутствия самих текстов. Письмо 16 июля уже имеет отдельный полный академический page-witness: «Летопись» ИМЛИ 2013, с. 339–340; открытым остаётся граница отправки, доставки и прочтения, которую нельзя утверждать без отдельного свидетельства. Наличие staged draft не означает, что основная 14-item reconciliation уже закрыта.')
          replace(draft,
              'Библиографическая идентификация controlling publication. Для page-level сверки нужен диапазон 236–281: академическая Летопись ИМЛИ цитирует письмо Бениславской от 4 мая 1925 года по стр. 280–281. Эти страницы в проект пока не приобретены и не считаются page-verified.',
              'Библиографическая идентификация controlling publication. Прямой осмотр экземпляра Пермской библиотекой 20.08.2026 идентифицирует письмо 4 марта на стр. 234, 6 апреля на стр. 236 и 26 апреля на стр. 238; поэтому непрерывный acquisition range теперь предварительно 234–281, с точной первой страницей по подтверждению держателя. Полный диапазон в проект пока не приобретён и не считается page-verified.')

          replace(validator,
              "let coverStatus = `pending-ingestion:${expectedCoverSha256}`;\nif (existsSync(coverPath)) {\n  const coverSha256 = createHash('sha256').update(readFileSync(coverPath)).digest('hex');\n  if (coverSha256 !== expectedCoverSha256) {\n    throw new Error(`Benislavskaya hero exists but does not match approved bytes: ${coverSha256}`);\n  }\n  coverStatus = `verified:${coverSha256}`;\n}",
              "if (!existsSync(coverPath)) {\n  throw new Error('Benislavskaya approved hero is missing after verified ingestion closure');\n}\nconst coverSha256 = createHash('sha256').update(readFileSync(coverPath)).digest('hex');\nif (coverSha256 !== expectedCoverSha256) {\n  throw new Error(`Benislavskaya hero does not match approved bytes: ${coverSha256}`);\n}\nconst coverStatus = `verified:${coverSha256}`;")
          replace(validator,
              "if (!controllingBook?.note?.includes('236–281') || !controllingBook.note.includes('не приобретены')) {",
              "if (!controllingBook?.note?.includes('234–281') || !controllingBook.note.includes('не приобретён')) {")
          replace(validator,
              "  'remaining acquisition problem is the 1995 correspondence range pp. **236–281**',",
              "  'provisionally pp. 234–281 with the exact first page pending holder confirmation',\n  'Hero status: VERIFIED / INGESTION CLOSED',")
          replace(validator,
              "  '236–281',",
              "  '234–281',")
          replace(validator,
              '`Benislavskaya staged DoD: unpublished; ${words} words; raw readTime=${essay.readTime}; publication readTime=${publicationCandidate.readTime}; ${sourcesById.size} cited source units; hero=${coverStatus}; 13↔16↔14 gate preserved; remaining 1995 page gate=236–281; IMLI 16-Jul witness=339–340 verified.`,',
              '`Benislavskaya staged DoD: unpublished; ${words} words; raw readTime=${essay.readTime}; publication readTime=${publicationCandidate.readTime}; ${sourcesById.size} cited source units; hero=${coverStatus}; 13↔16↔14 gate preserved; remaining 1995 page gate=234–281 provisional/exact-start-pending; IMLI 16-Jul witness=339–340 verified.`,')
          PY
      - name: Verify current contracts and staged article
        run: |
          npm ci
          node scripts/validate-project-contracts.mjs
          npm run validate:benislavskaya-staged
          npm run validate:library
          npm run validate:essays
          npm run validate:style
          npm run typecheck
          npm run build
      - name: Commit durable refresh and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/benislavskaya-current-gate-refresh.yml
          git add -- \
            docs/research/BENISLAVSKAYA_PUBLICATION_GATE_2026-08.md \
            docs/research/BENISLAVSKAYA_INBOUND_RECONCILIATION_MATRIX_2026-08.md \
            scripts/validate-benislavskaya-staged.ts \
            src/data/essays/benislavskayaDraft.ts
          git commit -m 'research(benislavskaya): align gate with holder inspection'
          git push origin HEAD:editorial/benislavskaya-publication-20260820
