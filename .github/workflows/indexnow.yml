name: Notify IndexNow

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  submit:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve previous deployed discovery snapshot
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^)"
          base_manifest="$RUNNER_TEMP/indexnow-base-discovery-manifest.json"
          if git cat-file -e "$base_sha:public/discovery-manifest.json" 2>/dev/null; then
            git show "$base_sha:public/discovery-manifest.json" > "$base_manifest"
            echo "INDEXNOW_BASE_MANIFEST_PATH=$base_manifest" >> "$GITHUB_ENV"
            echo "Using previous discovery snapshot from $base_sha"
          else
            echo "No previous discovery manifest; this deployment will use the explicit bootstrap path"
          fi

      - name: Generate the exact canonical discovery snapshot
        run: npm run sitemap

      - name: Notify IndexNow about added, changed or deleted canonical URLs
        run: npm run indexnow
