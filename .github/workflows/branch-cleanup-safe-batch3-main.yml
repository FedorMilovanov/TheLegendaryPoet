name: One-shot guarded merged-head cleanup batch 3 resume

on:
  push:
    branches: [main]
    paths: [.github/workflows/branch-cleanup-safe-batch3-main.yml]

permissions:
  contents: write
  pull-requests: read

jobs:
  resume-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reconcile planned refs, safely finish deletions, and finalize report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          owner = repo.split("/", 1)[0]
          report_path = "qa/branch-cleanup-batch3-report.json"
          allowed_bases = {"main", "work/local-images-playwright-wtoc"}
          forbidden_exact = {"main", "work/local-images-playwright-wtoc"}
          forbidden_prefixes = ("backup/", "archive/", "editorial/", "work/", "ops/")

          def request(method, path, payload=None, allow_404=False, soft=False):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(f"https://api.github.com{path}", data=data, method=method)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              req.add_header("User-Agent", "guarded-merged-head-cleanup-resume")
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None, None
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  if allow_404 and exc.code == 404:
                      return 404, None, None
                  if soft:
                      return exc.code, None, raw
                  raise RuntimeError(f"{method} {path}: {exc.code} {raw}") from exc

          def enc(value):
              return urllib.parse.quote(value, safe="")

          # Read the immutable pre-deletion plan written by the first run.
          _, report_file, _ = request("GET", f"/repos/{repo}/contents/{report_path}?ref=main")
          report_sha = report_file["sha"]
          report = json.loads(base64.b64decode(report_file["content"]).decode("utf-8"))
          if report.get("state") != "PLANNED":
              raise RuntimeError(f"Unexpected report state: {report.get('state')}")
          candidates = report.get("candidates", [])
          if len(candidates) != report.get("candidateCount") or len(candidates) > 150:
              raise RuntimeError("Candidate plan count mismatch or safety ceiling exceeded")

          # Repository-wide open-PR guard before any resumed deletion.
          _, open_repo_prs, _ = request("GET", f"/repos/{repo}/pulls?state=open&per_page=100")
          if open_repo_prs:
              raise RuntimeError(f"Repository has {len(open_repo_prs)} open PR(s); refusing resume")

          reconciled = []
          deleted_now = []
          already_absent = []
          skipped = []

          for item in candidates:
              branch = item["branch"]
              expected_sha = item["sha"]
              pr_number = item["pr"]
              base = item["base"]

              if branch in forbidden_exact or branch.startswith(forbidden_prefixes) or base not in allowed_bases:
                  skipped.append({**item, "status": "skipped_forbidden_policy"})
                  continue

              status, ref, _ = request("GET", f"/repos/{repo}/git/ref/heads/{enc(branch)}", allow_404=True)
              if status == 404:
                  result = {**item, "status": "absent_confirmed_after_original_plan"}
                  reconciled.append(result)
                  already_absent.append(result)
                  continue

              current_sha = ref["object"]["sha"]
              if current_sha != expected_sha:
                  skipped.append({**item, "status": "skipped_sha_changed", "currentSha": current_sha})
                  continue

              branch_status, branch_info, _ = request("GET", f"/repos/{repo}/branches/{enc(branch)}", allow_404=True)
              if branch_status == 404:
                  result = {**item, "status": "absent_confirmed_during_resume"}
                  reconciled.append(result)
                  already_absent.append(result)
                  continue
              if branch_info.get("protected"):
                  skipped.append({**item, "status": "skipped_protected"})
                  continue

              _, pr, _ = request("GET", f"/repos/{repo}/pulls/{pr_number}")
              if (
                  pr.get("state") != "closed"
                  or not pr.get("merged_at")
                  or pr.get("head", {}).get("ref") != branch
                  or pr.get("head", {}).get("sha") != expected_sha
                  or pr.get("base", {}).get("ref") != base
                  or base not in allowed_bases
              ):
                  skipped.append({**item, "status": "skipped_pr_identity_or_merge_changed"})
                  continue

              _, open_head, _ = request(
                  "GET",
                  f"/repos/{repo}/pulls?state=open&head={enc(owner + ':' + branch)}&per_page=100",
              )
              if open_head:
                  skipped.append({**item, "status": "skipped_open_pr"})
                  continue

              delete_status, _, delete_error = request(
                  "DELETE",
                  f"/repos/{repo}/git/refs/heads/{enc(branch)}",
                  soft=True,
              )
              if delete_status not in (200, 204):
                  skipped.append({
                      **item,
                      "status": "skipped_delete_rejected",
                      "httpStatus": delete_status,
                      "error": delete_error,
                  })
                  continue

              verify_status, _, _ = request(
                  "GET",
                  f"/repos/{repo}/git/ref/heads/{enc(branch)}",
                  allow_404=True,
              )
              if verify_status != 404:
                  skipped.append({**item, "status": "skipped_delete_not_verified"})
                  continue

              result = {**item, "status": "deleted_confirmed_by_resume"}
              reconciled.append(result)
              deleted_now.append(result)

          # Ensure no open PR appeared before finalizing the audit record.
          _, final_open_prs, _ = request("GET", f"/repos/{repo}/pulls?state=open&per_page=100")

          report["state"] = "COMPLETE" if not skipped else "COMPLETE_WITH_SKIPS"
          report["resumedAt"] = dt.datetime.now(dt.timezone.utc).isoformat()
          report["reconciled"] = reconciled
          report["deleted"] = reconciled
          report["originalRunAbsentConfirmedCount"] = len(already_absent)
          report["resumeDeletedConfirmedCount"] = len(deleted_now)
          report["totalAbsentConfirmedCount"] = len(reconciled)
          report["skippedAfterResume"] = skipped
          report["skippedAfterResumeCount"] = len(skipped)
          report["openPrCountAtFinalize"] = len(final_open_prs)

          encoded = base64.b64encode((json.dumps(report, ensure_ascii=False, indent=2) + "\n").encode("utf-8")).decode("ascii")
          payload = {
              "message": "ops: finalize guarded merged-head cleanup batch 3",
              "content": encoded,
              "sha": report_sha,
              "branch": "main",
          }
          _, update_result, _ = request("PUT", f"/repos/{repo}/contents/{report_path}", payload)

          summary = {
              "state": report["state"],
              "candidateCount": len(candidates),
              "originalRunAbsentConfirmedCount": len(already_absent),
              "resumeDeletedConfirmedCount": len(deleted_now),
              "totalAbsentConfirmedCount": len(reconciled),
              "skippedAfterResumeCount": len(skipped),
              "reportCommit": update_result["commit"]["sha"],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("# Guarded merged-head cleanup batch 3 — recovery\n\n")
              for key, value in summary.items():
                  fh.write(f"- **{key}**: `{value}`\n")
          PY
