name: Yesenin NYPL API Discovery Pass 19

on:
  pull_request:
    branches: [research/yesenin-archive-access-pass18]
    paths:
      - 'scripts/discover-yesenin-nypl-programs-pass19.mjs'
      - 'scripts/probe-yesenin-nypl-iiif-pass19.mjs'
      - 'scripts/acquire-yesenin-nypl-program-captures-pass19-v2.mjs'
      - '.github/workflows/yesenin-nypl-api-discovery-pass19.yml'
  workflow_dispatch:

concurrency:
  group: yesenin-nypl-api-pass19-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      NYPL_API_TOKEN: ${{ secrets.NYPL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Query NYPL item, MODS, capture and rights endpoints
        id: repo_api
        continue-on-error: true
        run: node scripts/discover-yesenin-nypl-programs-pass19.mjs
      - name: Probe exact NYPL IIIF route variants
        if: always()
        run: node scripts/probe-yesenin-nypl-iiif-pass19.mjs
      - name: Acquire four public items and fifteen exact IIIF derivatives
        if: always()
        run: node scripts/acquire-yesenin-nypl-program-captures-pass19-v2.mjs
      - name: Record Repo API outcome
        if: always()
        shell: bash
        run: |
          printf 'Repo API diagnostic outcome: %s\n' '${{ steps.repo_api.outcome }}'
          printf 'A failed API step is retained as an auth/network boundary and does not override successful public-page/IIIF evidence.\n'
      - name: Upload NYPL API and IIIF discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-nypl-api-discovery-pass19
          path: artifacts/yesenin-nypl-programs-pass19
          if-no-files-found: error
          retention-days: 14
