name: Benislavskaya Provenance Discovery Pass 23

on:
  pull_request:
    branches:
      - research/yesenin-benislavskaya-correspondence-evidence-pass22
    paths:
      - scripts/discover-yesenin-benislavskaya-provenance-pass23-v4.mjs
      - .github/workflows/yesenin-benislavskaya-provenance-discovery-pass23.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/discover-yesenin-benislavskaya-provenance-pass23-v4.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-benislavskaya-provenance-pass23
          path: artifacts/yesenin-benislavskaya-provenance-pass23
          if-no-files-found: error
          retention-days: 14
