name: Recover approved-cover payload

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/recover-approved-cover-payload.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record exact main commit and tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          git rev-parse HEAD > recovery/MAIN_SHA.txt
          git rev-parse 'HEAD^{tree}' > recovery/MAIN_TREE_SHA.txt

      - name: Upload exact main metadata
        uses: actions/upload-artifact@v4
        with:
          name: exact-main-git-metadata
          path: recovery/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
