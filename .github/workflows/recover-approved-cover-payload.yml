name: Recover approved-cover payload

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/recover-approved-cover-payload.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Export archived chunks and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/chunks
          cp .release/approved-cover-transfer/chunk-* recovery/chunks/
          sha256sum recovery/chunks/chunk-* > recovery/CHUNK_SHA256SUMS.txt
          wc -c recovery/chunks/chunk-* > recovery/CHUNK_SIZES.txt
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json

          root = Path('recovery/chunks')
          allowed = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n\t ')
          report = []
          combined = bytearray()
          for path in sorted(root.glob('chunk-*')):
              raw = path.read_bytes()
              invalid = [{'offset': i, 'byte': b} for i, b in enumerate(raw) if b not in allowed]
              cleaned = b''.join(raw.split())
              report.append({
                  'name': path.name,
                  'size': len(raw),
                  'clean_size': len(cleaned),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'prefix': raw[:32].decode('ascii', 'backslashreplace'),
                  'suffix': raw[-32:].decode('ascii', 'backslashreplace'),
                  'invalid': invalid[:50],
                  'invalid_count': len(invalid),
              })
              combined.extend(cleaned)

          Path('recovery/combined.raw.b64').write_bytes(combined)
          decoded = b''
          decode_error = None
          try:
              decoded = base64.b64decode(combined, validate=True)
          except Exception as exc:
              decode_error = repr(exc)
              try:
                  decoded = base64.b64decode(combined, validate=False)
              except Exception as fallback_exc:
                  decode_error += '; fallback=' + repr(fallback_exc)

          if decoded:
              Path('recovery/combined.best-effort.tar.gz').write_bytes(decoded)
          summary = {
              'chunks': report,
              'combined_clean_size': len(combined),
              'combined_mod_4': len(combined) % 4,
              'decode_error': decode_error,
              'decoded_size': len(decoded),
              'decoded_sha256': hashlib.sha256(decoded).hexdigest() if decoded else None,
              'expected_tar_sha256': '68e5e40021918cf9b3cbaf5ecf643fe40110abd55dd777b46b515868b895bdcd',
          }
          Path('recovery/DIAGNOSTICS.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY

          if test -s recovery/combined.best-effort.tar.gz; then
            gzip -t recovery/combined.best-effort.tar.gz > recovery/GZIP_TEST.txt 2>&1 || true
            tar -tzf recovery/combined.best-effort.tar.gz > recovery/CONTENTS.txt 2> recovery/TAR_ERRORS.txt || true
          fi

      - name: Upload raw recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: approved-cover-chunk-diagnostics
          path: recovery/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
