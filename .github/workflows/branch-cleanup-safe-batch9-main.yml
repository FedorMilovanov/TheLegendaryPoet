name: Guarded final stale branch cleanup batch 9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-safe-batch9-main.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const absent=e=>[404,409,422].includes(e?.status);
            async function refOrNull(ref){try{return (await github.rest.git.getRef({owner,repo,ref})).data.object.sha;}catch(e){if(absent(e))return null;throw e;}}
            async function waitRef(ref,sha){for(let i=0;i<12;i++){const s=await refOrNull(ref);if(s===sha)return true;if(s&&s!==sha)throw new Error(`Ref mismatch ${ref}: ${s}`);await sleep(350);}return false;}
            async function waitAbsent(ref){for(let i=0;i<12;i++){if(!(await refOrNull(ref)))return true;await sleep(350);}return false;}
            const targets=[
              {branch:'agent/home-polish-clean-20260725-r2',sha:'15b0b3d560d2b07a0708d0727a94f4c475b28629',reason:'stale-home-reconciliation'},
              {branch:'deploy-live-cloak-v2',sha:'ca20c791abc40b8560327f18dba2858ce5daa898',reason:'superseded-brand-v3',pr:148},
              {branch:'research/yesenin-part1-authoring-76',sha:'481c28647f0079ecd081ca81cfdefbf7d7e7c552',reason:'stale-validator-superseded-by-canonical'}
            ];
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const openHeads=new Set(open.filter(p=>p.head.repo&&p.head.repo.full_name===`${owner}/${repo}`).map(p=>p.head.ref));
            const report={repository:`${owner}/${repo}`,runSha:context.sha,startedAt:new Date().toISOString(),planned:targets.length,results:[]};
            for(const t of targets){
              const item={...t,status:'PENDING',archiveTag:`archive/branches/2026-08-04/batch9/${t.branch}`,tagExact:false,branchAbsent:false};report.results.push(item);
              try{
                if(openHeads.has(t.branch)){item.status='OPEN_PR_BLOCK';continue;}
                let bs=await refOrNull(`heads/${t.branch}`);if(bs&&bs!==t.sha){item.status='SHA_CHANGED_BLOCK';item.currentSha=bs;continue;}
                if(t.pr){const p=await github.rest.pulls.get({owner,repo,pull_number:t.pr});if(p.data.state!=='closed'||p.data.merged_at||p.data.head.sha!==t.sha){item.status='PR_GUARD_BLOCK';continue;}}
                let ts=await refOrNull(`tags/${item.archiveTag}`);if(ts&&ts!==t.sha){item.status='TAG_MISMATCH_BLOCK';continue;}
                if(!ts){try{await github.rest.git.createRef({owner,repo,ref:`refs/tags/${item.archiveTag}`,sha:t.sha});}catch(e){if(!absent(e))throw e;}}
                item.tagExact=await waitRef(`tags/${item.archiveTag}`,t.sha);if(!item.tagExact){item.status='TAG_VERIFY_BLOCK';continue;}
                bs=await refOrNull(`heads/${t.branch}`);if(!bs){item.branchAbsent=true;item.status='ABSENT_CONFIRMED';continue;}if(bs!==t.sha){item.status='SHA_CHANGED_BLOCK';continue;}
                const bm=await github.rest.repos.getBranch({owner,repo,branch:t.branch});if(bm.data.protected){item.status='PROTECTED_BLOCK';continue;}
                try{await github.rest.git.deleteRef({owner,repo,ref:`heads/${t.branch}`});}catch(e){if(!absent(e))throw e;}
                item.branchAbsent=await waitAbsent(`heads/${t.branch}`);item.status=item.branchAbsent?'ABSENT_CONFIRMED':'DELETE_NOT_CONFIRMED';
              }catch(e){item.status='ERROR';item.error=String(e.message||e);item.httpStatus=e.status||null;}
            }
            const remaining=[];const badTags=[];
            for(const t of targets){const bs=await refOrNull(`heads/${t.branch}`);if(bs)remaining.push({branch:t.branch,currentSha:bs,expectedSha:t.sha});const tag=`archive/branches/2026-08-04/batch9/${t.branch}`;const ts=await refOrNull(`tags/${tag}`);if(ts!==t.sha)badTags.push({tag,currentSha:ts,expectedSha:t.sha});}
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            report.completedAt=new Date().toISOString();report.remaining=remaining;report.badTags=badTags;report.absentConfirmed=targets.length-remaining.length;report.tagsExact=targets.length-badTags.length;report.branchCountAfter=branches.length;report.success=remaining.length===0&&badTags.length===0;
            const path='qa/branch-cleanup-batch9-report.json';let cur;try{cur=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'ops: record guarded stale branch cleanup batch 9',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),sha:cur?.data?.sha});
            core.summary.addHeading('Batch 9 verification').addCodeBlock(JSON.stringify({success:report.success,absent:report.absentConfirmed,tags:report.tagsExact,branchesAfter:report.branchCountAfter},null,2),'json').write();
