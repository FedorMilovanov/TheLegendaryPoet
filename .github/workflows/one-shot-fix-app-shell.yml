name: One-shot repair app-shell provenance validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-app-shell.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch validator to the approved single-source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-app-shell.ts')
          text = path.read_text(encoding='utf-8')

          old_dispatch = """expect(
            deployDispatchWorkflow.includes('expected_master_sha256: process.env.MASTER_SHA256'),
            'release dispatcher must pass the exact approved master hash',
          );"""
          new_dispatch = """expect(
            deployDispatchWorkflow.includes('expected_source_sha256: process.env.SOURCE_SHA256'),
            'release dispatcher must pass the exact approved source hash',
          );"""

          old_deploy = """expect(
            deployWorkflow.includes('EXPECTED_VERSION: ${{ inputs.expected_version }}')
              && deployWorkflow.includes('EXPECTED_MASTER_SHA256: ${{ inputs.expected_master_sha256 }}'),
            'deploy workflow must verify the dispatched release metadata against the built artifact',
          );"""
          new_deploy = """expect(
            deployWorkflow.includes('EXPECTED_VERSION: ${{ inputs.expected_version }}')
              && deployWorkflow.includes('EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}'),
            'deploy workflow must verify the dispatched single-source release metadata against the built artifact',
          );"""

          if old_dispatch not in text:
              raise SystemExit('old dispatcher validator contract not found')
          if old_deploy not in text:
              raise SystemExit('old deploy validator contract not found')

          text = text.replace(old_dispatch, new_dispatch, 1)
          text = text.replace(old_deploy, new_deploy, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - run: npm ci

      - name: Verify repaired validator
        run: npm run validate:app-shell

      - name: Remove one-shot workflow and commit repair
        run: |
          rm .github/workflows/one-shot-fix-app-shell.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-app-shell.ts .github/workflows/one-shot-fix-app-shell.yml
          git commit -m "fix(ci): validate the approved single-source Pages contract"
          git push origin HEAD:main
