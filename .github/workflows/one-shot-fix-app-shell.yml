name: One-shot repair app-shell provenance validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-app-shell.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch validator to the approved single-source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-app-shell.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "expected_master_sha256: process.env.MASTER_SHA256": "expected_source_sha256: process.env.SOURCE_SHA256",
              "release dispatcher must pass the exact approved master hash": "release dispatcher must pass the exact approved source hash",
              "EXPECTED_MASTER_SHA256: ${{ inputs.expected_master_sha256 }}": "EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}",
              "deploy workflow must verify the dispatched release metadata against the built artifact": "deploy workflow must verify the dispatched single-source release metadata against the built artifact",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'validator fragment not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - run: npm ci

      - name: Verify repaired validator
        run: npm run validate:app-shell

      - name: Remove one-shot workflow and commit repair
        run: |
          rm .github/workflows/one-shot-fix-app-shell.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-app-shell.ts .github/workflows/one-shot-fix-app-shell.yml
          git commit -m "fix(ci): validate the approved single-source Pages contract"
          git push origin HEAD:main
