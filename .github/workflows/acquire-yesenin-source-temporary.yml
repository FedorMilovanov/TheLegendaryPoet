name: Temporary verified Yesenin source acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/acquire-yesenin-source-temporary.yml

permissions:
  contents: read

jobs:
  acquire-rus-sovetskaya:
    if: github.head_ref == 'editorial/longform-marathon-2026-08'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install isolated browser and PDF tools
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Inspect official catalogue and viewer network
        id: inspect
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p acquisition
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const catalogUrl = 'https://elib.libkids51.ru/edition/88';
          const outputPdf = 'acquisition/04__Esenin__Rus_sovetskaya__1925__Murmansk_Library.pdf';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ acceptDownloads: true });
          const catalog = await context.newPage();
          const network = [];

          const observe = (page) => page.on('response', (response) => {
            const headers = response.headers();
            const url = response.url();
            const contentType = headers['content-type'] ?? '';
            if (/pdf|download|publication|document|book|asset|page/i.test(url) || /application\/pdf/i.test(contentType)) {
              network.push({ url, status: response.status(), contentType });
            }
          });
          observe(catalog);

          let viewerUrl = '';
          let verifiedUrl = '';
          try {
            await catalog.goto(catalogUrl, { waitUntil: 'domcontentloaded', timeout: 120_000 });
            await catalog.waitForTimeout(5_000);
            const catalogHtml = await catalog.content();
            const catalogLinks = await catalog.locator('a').evaluateAll((nodes) => nodes.map((node) => ({
              text: (node.textContent ?? '').trim(),
              href: node.href,
              target: node.getAttribute('target'),
            })));
            fs.writeFileSync('acquisition/catalog.html', catalogHtml);
            fs.writeFileSync('acquisition/catalog-links.json', JSON.stringify(catalogLinks, null, 2));
            await catalog.screenshot({ path: 'acquisition/catalog.png', fullPage: false });

            const linkCandidate = catalogLinks.find((entry) =>
              /читать|read/i.test(entry.text) || /cld\.bz|viewer|flip|read/i.test(entry.href),
            );
            if (linkCandidate?.href) viewerUrl = linkCandidate.href;

            if (!viewerUrl) {
              const readControl = catalog.getByText('Читать', { exact: true }).first();
              if (await readControl.count()) {
                const popupPromise = context.waitForEvent('page', { timeout: 12_000 }).catch(() => null);
                await readControl.click({ timeout: 15_000 }).catch(() => undefined);
                const popup = await popupPromise;
                if (popup) {
                  await popup.waitForLoadState('domcontentloaded').catch(() => undefined);
                  viewerUrl = popup.url();
                  await popup.close().catch(() => undefined);
                } else if (catalog.url() !== catalogUrl) {
                  viewerUrl = catalog.url();
                }
              }
            }

            if (!viewerUrl) {
              for (const match of catalogHtml.matchAll(/https?:[^"'<>\s]+/giu)) {
                const value = match[0].replaceAll('&amp;', '&');
                if (/cld\.bz|viewer|flip|read/i.test(value)) {
                  viewerUrl = value;
                  break;
                }
              }
            }

            fs.writeFileSync('acquisition/viewer-url.txt', viewerUrl);
            const candidates = new Set();

            if (viewerUrl) {
              const viewer = await context.newPage();
              observe(viewer);
              await viewer.goto(viewerUrl, { waitUntil: 'domcontentloaded', timeout: 120_000 });
              await viewer.waitForTimeout(12_000);
              const viewerHtml = await viewer.content();
              const viewerLinks = await viewer.locator('a').evaluateAll((nodes) => nodes.map((node) => ({
                text: (node.textContent ?? '').trim(),
                href: node.href,
                download: node.getAttribute('download'),
              })));
              fs.writeFileSync('acquisition/viewer.html', viewerHtml);
              fs.writeFileSync('acquisition/viewer-links.json', JSON.stringify(viewerLinks, null, 2));
              await viewer.screenshot({ path: 'acquisition/viewer.png', fullPage: false });

              for (const entry of [...network, ...viewerLinks]) {
                const url = entry.url ?? entry.href;
                if (url && (/\.pdf(?:$|[?#])/i.test(url) || /download.*pdf|pdf.*download/i.test(url))) {
                  candidates.add(url);
                }
              }
              for (const match of viewerHtml.matchAll(/https?:[^"'<>\s]+\.pdf(?:\?[^"'<>\s]*)?/giu)) {
                candidates.add(match[0].replaceAll('&amp;', '&'));
              }
              for (const match of viewerHtml.matchAll(/["']([^"']*(?:download|document|publication)[^"']*)["']/giu)) {
                try {
                  const url = new URL(match[1], viewerUrl).href;
                  if (/pdf|download/i.test(url)) candidates.add(url);
                } catch {}
              }
              await viewer.close();
            }

            fs.writeFileSync('acquisition/network-candidates.json', JSON.stringify(network, null, 2));
            fs.writeFileSync('acquisition/pdf-candidates.txt', [...candidates].join('\n'));

            for (const url of candidates) {
              try {
                const response = await context.request.get(url, {
                  headers: {
                    Referer: viewerUrl || catalogUrl,
                    Accept: 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  },
                  timeout: 180_000,
                });
                const body = await response.body();
                fs.appendFileSync(
                  'acquisition/candidate-results.txt',
                  `${response.status()}\t${response.headers()['content-type'] ?? ''}\t${body.length}\t${url}\n`,
                );
                if (response.ok() && body.subarray(0, 5).toString() === '%PDF-' && body.length > 100_000) {
                  fs.writeFileSync(outputPdf, body);
                  verifiedUrl = url;
                  break;
                }
              } catch (error) {
                fs.appendFileSync('acquisition/candidate-results.txt', `ERROR\t${String(error)}\t${url}\n`);
              }
            }

            fs.writeFileSync('acquisition/DISCOVERY.txt', [
              'institution=Murmansk Regional Children and Youth Library',
              `catalog_url=${catalogUrl}`,
              `viewer_url=${viewerUrl}`,
              `pdf_candidate_count=${candidates.size}`,
              `verified_pdf_url=${verifiedUrl}`,
              `verified_pdf_found=${verifiedUrl ? 'true' : 'false'}`,
              'catalog_reported_files=1',
              'catalog_reported_size_kb=8356',
              'drive_upload_completed=false',
            ].join('\n'));

            if (!verifiedUrl) process.exitCode = 2;
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify PDF, checksum and first page
        id: verify
        if: steps.inspect.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          PDF='acquisition/04__Esenin__Rus_sovetskaya__1925__Murmansk_Library.pdf'
          test "$(head -c 5 "$PDF")" = '%PDF-'
          file "$PDF" | tee acquisition/rus-sovetskaya.file.txt
          pdfinfo "$PDF" | tee acquisition/rus-sovetskaya.pdfinfo.txt
          PAGES="$(pdfinfo "$PDF" | awk -F: '/^Pages:/ {gsub(/ /, "", $2); print $2}')"
          test -n "$PAGES"
          test "$PAGES" -ge 81
          BYTES="$(stat -c%s "$PDF")"
          test "$BYTES" -gt 1000000
          SHA="$(sha256sum "$PDF" | awk '{print $1}')"
          pdftoppm -f 1 -singlefile -png -r 160 "$PDF" acquisition/rus-sovetskaya.first-page
          test -s acquisition/rus-sovetskaya.first-page.png
          {
            echo 'title=Русь советская'
            echo 'author=Сергей Есенин'
            echo 'publication=Баку, Бакинский рабочий, 1925'
            echo 'institutional_catalog=https://elib.libkids51.ru/edition/88'
            echo "pdf_pages=$PAGES"
            echo "file_size_bytes=$BYTES"
            echo "sha256=$SHA"
            echo 'first_page_rendered=true'
            echo 'drive_upload_completed=false'
          } | tee acquisition/VERIFICATION.txt

      - name: Record outcome
        if: always()
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "inspection_outcome=$INSPECT_OUTCOME"
            echo "verification_outcome=$VERIFY_OUTCOME"
            if [ "$VERIFY_OUTCOME" = success ]; then
              echo 'verified_pdf=true'
            else
              echo 'verified_pdf=false'
            fi
            echo 'drive_upload_completed=false'
          } | tee acquisition/OUTCOME.txt

      - name: Upload acquisition or diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-source-rus-sovetskaya-institutional
          path: acquisition/
          if-no-files-found: error
          retention-days: 2

      - name: Fail unverified item after diagnostics upload
        if: steps.verify.outcome != 'success'
        run: exit 1
