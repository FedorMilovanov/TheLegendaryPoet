name: Temporary verified Yesenin source acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/acquire-yesenin-source-temporary.yml

permissions:
  contents: read

jobs:
  acquire-plavilnya-slov:
    if: github.head_ref == 'editorial/longform-marathon-2026-08'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install isolated browser and PDF tools
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Inspect institutional flipbook network and acquire exposed PDF
        id: inspect
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p acquisition
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const viewerUrl = 'https://elib-libkids51.cld.bz/Iesenin-S-Plavil-nya-slov';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ acceptDownloads: true });
          const page = await context.newPage();
          const responses = [];

          page.on('response', (response) => {
            const headers = response.headers();
            const url = response.url();
            const contentType = headers['content-type'] ?? '';
            if (/pdf|download|publication|document|book|asset/i.test(url) || /application\/pdf/i.test(contentType)) {
              responses.push({ url, status: response.status(), contentType });
            }
          });

          try {
            await page.goto(viewerUrl, { waitUntil: 'domcontentloaded', timeout: 120_000 });
            await page.waitForTimeout(12_000);

            const links = await page.locator('a').evaluateAll((nodes) => nodes.map((node) => ({
              text: (node.textContent ?? '').trim(),
              href: node.href,
              download: node.getAttribute('download'),
            })));
            const html = await page.content();
            fs.writeFileSync('acquisition/viewer.html', html);
            fs.writeFileSync('acquisition/links.json', JSON.stringify(links, null, 2));
            fs.writeFileSync('acquisition/network-candidates.json', JSON.stringify(responses, null, 2));
            await page.screenshot({ path: 'acquisition/viewer.png', fullPage: false });

            const candidates = new Set();
            for (const entry of [...responses, ...links]) {
              const url = entry.url ?? entry.href;
              if (url && (/\.pdf(?:$|[?#])/i.test(url) || /download.*pdf|pdf.*download/i.test(url))) candidates.add(url);
            }
            for (const match of html.matchAll(/https?:[^"'<>\s]+\.pdf(?:\?[^"'<>\s]*)?/giu)) {
              candidates.add(match[0].replaceAll('&amp;', '&'));
            }
            for (const match of html.matchAll(/["']([^"']*(?:download|document|publication)[^"']*)["']/giu)) {
              try {
                const url = new URL(match[1], viewerUrl).href;
                if (/pdf|download/i.test(url)) candidates.add(url);
              } catch {}
            }

            fs.writeFileSync('acquisition/pdf-candidates.txt', [...candidates].join('\n'));

            let verifiedUrl = null;
            for (const url of candidates) {
              try {
                const response = await context.request.get(url, {
                  headers: {
                    Referer: viewerUrl,
                    Accept: 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  },
                  timeout: 180_000,
                });
                const body = await response.body();
                fs.appendFileSync(
                  'acquisition/candidate-results.txt',
                  `${response.status()}\t${response.headers()['content-type'] ?? ''}\t${body.length}\t${url}\n`,
                );
                if (response.ok() && body.subarray(0, 5).toString() === '%PDF-' && body.length > 100_000) {
                  fs.writeFileSync('acquisition/05__Plavilnya_slov__1920__Murmansk_Library.pdf', body);
                  verifiedUrl = url;
                  break;
                }
              } catch (error) {
                fs.appendFileSync('acquisition/candidate-results.txt', `ERROR\t${String(error)}\t${url}\n`);
              }
            }

            fs.writeFileSync('acquisition/DISCOVERY.txt', [
              'institution=Murmansk Regional Children and Youth Library',
              'catalog_url=https://elib.libkids51.ru/edition/119',
              `viewer_url=${viewerUrl}`,
              `pdf_candidate_count=${candidates.size}`,
              `verified_pdf_url=${verifiedUrl ?? ''}`,
              `verified_pdf_found=${verifiedUrl ? 'true' : 'false'}`,
              'drive_upload_completed=false',
            ].join('\n'));

            if (!verifiedUrl) process.exitCode = 2;
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify PDF, checksum and first page
        id: verify
        if: steps.inspect.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          PDF='acquisition/05__Plavilnya_slov__1920__Murmansk_Library.pdf'
          test "$(head -c 5 "$PDF")" = '%PDF-'
          file "$PDF" | tee acquisition/plavilnya.file.txt
          pdfinfo "$PDF" | tee acquisition/plavilnya.pdfinfo.txt
          PAGES="$(pdfinfo "$PDF" | awk -F: '/^Pages:/ {gsub(/ /, "", $2); print $2}')"
          test -n "$PAGES"
          test "$PAGES" -ge 39
          BYTES="$(stat -c%s "$PDF")"
          test "$BYTES" -gt 1000000
          SHA="$(sha256sum "$PDF" | awk '{print $1}')"
          pdftoppm -f 1 -singlefile -png -r 160 "$PDF" acquisition/plavilnya.first-page
          test -s acquisition/plavilnya.first-page.png
          {
            echo 'title=Плавильня слов'
            echo 'publication=Москва, Имажинисты, 1920'
            echo 'institutional_catalog=https://elib.libkids51.ru/edition/119'
            echo 'institutional_viewer=https://elib-libkids51.cld.bz/Iesenin-S-Plavil-nya-slov'
            echo "pdf_pages=$PAGES"
            echo "file_size_bytes=$BYTES"
            echo "sha256=$SHA"
            echo 'first_page_rendered=true'
            echo 'drive_upload_completed=false'
          } | tee acquisition/VERIFICATION.txt

      - name: Record outcome
        if: always()
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "inspection_outcome=$INSPECT_OUTCOME"
            echo "verification_outcome=$VERIFY_OUTCOME"
            if [ "$VERIFY_OUTCOME" = success ]; then
              echo 'verified_pdf=true'
            else
              echo 'verified_pdf=false'
            fi
            echo 'drive_upload_completed=false'
          } | tee acquisition/OUTCOME.txt

      - name: Upload acquisition or diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-source-plavilnya-institutional
          path: acquisition/
          if-no-files-found: error
          retention-days: 2

      - name: Fail unverified item after diagnostics upload
        if: steps.verify.outcome != 'success'
        run: exit 1
