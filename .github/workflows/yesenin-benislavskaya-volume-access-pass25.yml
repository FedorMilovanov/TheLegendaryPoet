name: Yesenin Benislavskaya Volume Access Pass 25

on:
  pull_request:
    branches: [research/yesenin-benislavskaya-inbound-evidence-pass24]
    paths:
      - 'scripts/discover-yesenin-benislavskaya-volume-access-pass25.mjs'
      - 'scripts/discover-yesenin-benislavskaya-volume-access-pass25-v2.mjs'
      - '.github/workflows/yesenin-benislavskaya-volume-access-pass25.yml'
  workflow_dispatch:

concurrency:
  group: yesenin-benislavskaya-volume-access-pass25-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exclude service-policy PDFs from target-book full text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/discover-yesenin-benislavskaya-volume-access-pass25-v2.mjs')
          text = path.read_text(encoding='utf-8')
          old = "legalDigitalFullTextFound: realFullTextLinks.length > 0,"
          new = "legalDigitalFullTextFound: target.kind !== 'institutional-document-delivery-policy' && realFullTextLinks.length > 0,"
          if old not in text:
              raise SystemExit('expected full-text classification line not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Probe institutional holdings and page-delivery routes
        run: node scripts/discover-yesenin-benislavskaya-volume-access-pass25-v2.mjs
      - name: Upload source-volume access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-benislavskaya-volume-access-pass25
          path: artifacts/yesenin-benislavskaya-volume-access-pass25
          if-no-files-found: error
          retention-days: 14
