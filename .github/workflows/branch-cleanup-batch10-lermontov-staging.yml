name: Guarded cleanup batch 10 Lermontov staging branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-batch10-lermontov-staging.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch='agent/lermontov-road-essay';
            const expectedSha='cb8a4ae542f6267574af33deaad6a64a7ec1a380';
            const mergedHead='ee1f6ea9c18726ab512dba25784535776a4df27a';
            const archiveTag='archive/branches/2026-08-04/batch10/agent/lermontov-road-essay';
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const absent=e=>[404,409,422].includes(e?.status);
            async function refOrNull(ref){try{return (await github.rest.git.getRef({owner,repo,ref})).data.object.sha}catch(e){if(absent(e))return null;throw e}}
            async function waitRef(ref,sha){for(let i=0;i<12;i++){const s=await refOrNull(ref);if(s===sha)return true;if(s&&s!==sha)throw new Error(`Ref mismatch ${ref}: ${s}`);await sleep(400)}return false}
            async function waitAbsent(ref){for(let i=0;i<12;i++){if(!(await refOrNull(ref)))return true;await sleep(400)}return false}
            const report={repository:`${owner}/${repo}`,runSha:context.sha,branch,expectedSha,archiveTag,startedAt:new Date().toISOString(),status:'PENDING'};
            try{
              const current=await refOrNull(`heads/${branch}`);
              if(!current){report.status='ALREADY_ABSENT';}
              else if(current!==expectedSha){report.status='SHA_CHANGED_BLOCK';report.currentSha=current;}
              else {
                const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
                if(open.some(p=>p.head.repo&&p.head.repo.full_name===`${owner}/${repo}`&&p.head.ref===branch)){report.status='OPEN_PR_BLOCK';}
                else {
                  const pr=(await github.rest.pulls.get({owner,repo,pull_number:258})).data;
                  if(!pr.merged_at||pr.head.sha!==mergedHead){report.status='MERGED_PR_GUARD_BLOCK';}
                  else {
                    const delta=(await github.rest.repos.compareCommits({owner,repo,base:mergedHead,head:branch})).data;
                    const paths=(delta.files||[]).map(f=>f.filename);
                    const payloadOnly=delta.behind_by===0&&delta.ahead_by===3&&paths.length===3&&paths.every(p=>/^payload\/approved-covers\/part\d+\.b64$/.test(p));
                    report.postMergeAheadBy=delta.ahead_by;report.postMergeBehindBy=delta.behind_by;report.postMergePaths=paths;
                    if(!payloadOnly){report.status='POST_MERGE_CONTENT_GUARD_BLOCK';}
                    else {
                      let tag=await refOrNull(`tags/${archiveTag}`);
                      if(tag&&tag!==expectedSha){report.status='TAG_MISMATCH_BLOCK';}
                      else {
                        if(!tag){try{await github.rest.git.createRef({owner,repo,ref:`refs/tags/${archiveTag}`,sha:expectedSha})}catch(e){if(!absent(e))throw e}}
                        report.tagExact=await waitRef(`tags/${archiveTag}`,expectedSha);
                        if(!report.tagExact){report.status='TAG_VERIFY_BLOCK';}
                        else {
                          const protectedBranch=(await github.rest.repos.getBranch({owner,repo,branch})).data.protected;
                          if(protectedBranch){report.status='PROTECTED_BLOCK';}
                          else {
                            try{await github.rest.git.deleteRef({owner,repo,ref:`heads/${branch}`})}catch(e){if(!absent(e))throw e}
                            report.branchAbsent=await waitAbsent(`heads/${branch}`);
                            report.status=report.branchAbsent?'ABSENT_CONFIRMED':'DELETE_NOT_CONFIRMED';
                          }
                        }
                      }
                    }
                  }
                }
              }
            }catch(e){report.status='ERROR';report.error=String(e.message||e);report.httpStatus=e.status||null}
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            report.completedAt=new Date().toISOString();report.branchCountAfter=branches.length;report.success=['ABSENT_CONFIRMED','ALREADY_ABSENT'].includes(report.status);
            const path='qa/branch-cleanup-batch10-report.json';let cur;try{cur=await github.rest.repos.getContent({owner,repo,path,ref:'main'})}catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'ops: record guarded Lermontov staging cleanup batch 10',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),sha:cur?.data?.sha});
            core.summary.addHeading('Batch 10 Lermontov staging cleanup').addCodeBlock(JSON.stringify(report,null,2),'json').write();
