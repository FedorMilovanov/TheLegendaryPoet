name: Guarded cleanup batch 8 contained branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-batch8-contained-20260804.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const targets=[
              {branch:'__do_not_create__',sha:'9d2e260be4ad1abff63afbd5878222580140c585',container:'main'},
              {branch:'agent/home-polish-clean-20260725-r3',sha:'c5f90764450e690b42e8d949b860609f05961a3c',container:'main'},
              {branch:'audit/runtime-hygiene-scan-20260727',sha:'09bdf64a2e12f6f9dbec6622f59e621ac38dc5fe',container:'main'},
              {branch:'fix/brand-direct-assets-recovery-20260725',sha:'1ac8bec1573877d8abfd0b5c7a9e9497c92e1558',container:'main'},
              {branch:'fix/brand-v8-28-postmerge',sha:'9fd4fde175b984f999bcb8bd89c3845eba6c3d30',container:'main'},
              {branch:'fix/emblem-v3-main-final',sha:'93e18d862d71ab3c566177c8d34bef98c2298aa3',container:'main'},
              {branch:'fix/music-cover-resilience-20260727',sha:'983c51115a7f7108f2873c6729f56a1a722ff7e0',container:'main'},
              {branch:'noop-check',sha:'b114e4b6d979c2f5fc327d74f3b0bcd45139988d',container:'work/local-images-playwright-wtoc'},
              {branch:'research/yesenin-priority-books-validation-base',sha:'d312dd9f269955f564cad3e80c3d0d43e4c56b33',container:'work/local-images-playwright-wtoc'},
              {branch:'work/local-images-playwright-wtoc-backup',sha:'1533d7c89357a2cfe12f5d27d5336a2f68bae67b',container:'work/local-images-playwright-wtoc'}
            ];
            const results=[];
            const getRef=async branch=>{try{return (await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`})).data.object.sha}catch(e){if(e.status===404)return null;throw e}};
            for(const t of targets){
              const current=await getRef(t.branch);
              if(current===null){results.push({...t,status:'ALREADY_ABSENT'});continue;}
              if(current!==t.sha){results.push({...t,current,status:'SKIPPED_SHA_MISMATCH'});continue;}
              let cmp;
              try{cmp=(await github.rest.repos.compareCommits({owner,repo,base:t.branch,head:t.container})).data;}catch(e){results.push({...t,status:'SKIPPED_COMPARE_ERROR',error:String(e.status||e.message)});continue;}
              if(cmp.behind_by!==0){results.push({...t,status:'SKIPPED_NOT_CONTAINED',aheadBy:cmp.ahead_by,behindBy:cmp.behind_by});continue;}
              await github.rest.git.deleteRef({owner,repo,ref:`heads/${t.branch}`});
              let absent=false;
              for(let i=0;i<5;i++){await new Promise(r=>setTimeout(r,1200));if(await getRef(t.branch)===null){absent=true;break;}}
              results.push({...t,status:absent?'DELETED_CONFIRMED':'DELETE_NOT_CONFIRMED'});
            }
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const report={repository:`${owner}/${repo}`,runSha:context.sha,generatedAt:new Date().toISOString(),results,deletedConfirmed:results.filter(x=>x.status==='DELETED_CONFIRMED'||x.status==='ALREADY_ABSENT').length,branchCountAfter:branches.length,success:results.every(x=>['DELETED_CONFIRMED','ALREADY_ABSENT'].includes(x.status))};
            const path='qa/branch-cleanup-batch8-report.json';
            let cur;try{cur=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'ops: record guarded contained-branch cleanup batch 8',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),sha:cur?.data?.sha});
            core.summary.addHeading('Batch 8 contained cleanup').addCodeBlock(JSON.stringify(report,null,2),'json').write();
