name: Marathon cleanup and dependency audit once

on:
  pull_request:
    branches:
      - agent/marathon-audit-integration-20260805
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  clean-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marathon-audit-integration-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove generated QA output and temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa-artifacts playwright-report test-results
          rm -f .github/workflows/marathon-clean-security-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(audit): remove generated QA output'
            git push origin HEAD:agent/marathon-audit-integration-20260805
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit-production.json
          status=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-production.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Production dependency audit:', counts);
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`- ${name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
          }
          if ((counts.total ?? 0) > 0) process.exitCode = 1;
          NODE
          exit $status

      - name: Report full dependency audit
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit-all.json
          set -e
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-all.json', 'utf8'));
          console.log('All dependency audit:', report.metadata?.vulnerabilities ?? {});
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`- ${name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
          }
          NODE
