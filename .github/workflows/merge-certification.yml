name: Merge certification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: merge-certification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scope:
    name: classify exact-head scope
    runs-on: ubuntu-latest
    outputs:
      tested_sha: ${{ steps.classify.outputs.tested_sha }}
      hall_offline_required: ${{ steps.classify.outputs.hall_offline_required }}
      hall_visual_required: ${{ steps.classify.outputs.hall_visual_required }}
    steps:
      - name: Checkout exact PR head with base history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Classify conditional certification lanes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-merge-certification.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Upload scope evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-certification-scope-${{ github.event.pull_request.head.sha }}
          path: merge-certification-scope.json
          if-no-files-found: error
          retention-days: 7

  hall-pushkin-offline:
    name: wait for Hall Pushkin offline exact-head certification
    needs: scope
    if: needs.scope.outputs.hall_offline_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scope.outputs.tested_sha }}

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ needs.scope.outputs.tested_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Wait for canonical Hall Pushkin offline workflow on the same head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-workflow-certification.mjs --lane hall-pushkin-offline-exhibit --head "${{ needs.scope.outputs.tested_sha }}"

  hall-pushkin-visual:
    name: wait for Hall Pushkin visual-remediation exact-head certification
    needs: scope
    if: needs.scope.outputs.hall_visual_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scope.outputs.tested_sha }}

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ needs.scope.outputs.tested_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Wait for canonical Hall Pushkin visual-remediation workflow on the same head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-workflow-certification.mjs --lane hall-pushkin-visual-remediation --head "${{ needs.scope.outputs.tested_sha }}"

  merge-certification:
    name: merge-certification
    needs: [scope, hall-pushkin-offline, hall-pushkin-visual]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce conditional exact-head outcomes
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          OFFLINE_REQUIRED: ${{ needs.scope.outputs.hall_offline_required }}
          OFFLINE_RESULT: ${{ needs.hall-pushkin-offline.result }}
          VISUAL_REQUIRED: ${{ needs.scope.outputs.hall_visual_required }}
          VISUAL_RESULT: ${{ needs.hall-pushkin-visual.result }}
          TESTED_SHA: ${{ needs.scope.outputs.tested_sha }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          test -n "$TESTED_SHA"

          if [ "$OFFLINE_REQUIRED" = "true" ]; then
            test "$OFFLINE_RESULT" = "success"
            offline_state="required / success"
          else
            test "$OFFLINE_REQUIRED" = "false"
            test "$OFFLINE_RESULT" = "skipped"
            offline_state="not applicable"
          fi

          if [ "$VISUAL_REQUIRED" = "true" ]; then
            test "$VISUAL_RESULT" = "success"
            visual_state="required / success"
          else
            test "$VISUAL_REQUIRED" = "false"
            test "$VISUAL_RESULT" = "skipped"
            visual_state="not applicable"
          fi

          {
            echo '### Exact-head merge certification'
            echo
            echo "- tested head: \`$TESTED_SHA\`"
            echo "- Hall Pushkin offline exhibit: $offline_state"
            echo "- Hall Pushkin visual remediation: $visual_state"
          } >> "$GITHUB_STEP_SUMMARY"
