name: W7 materialize route truth

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/w7-materialize-route-truth.yml
      - .w7-overlay.part-*

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/w7-route-runtime-truth-20260806'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/w7-route-runtime-truth-20260806
          fetch-depth: 0

      - name: Verify, apply and retire the W7 transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "agent/w7-route-runtime-truth-20260806"
          cat .w7-overlay.part-* > /tmp/w7-overlay.b64
          base64 --decode /tmp/w7-overlay.b64 > /tmp/w7-overlay.tgz
          echo "1afff788e4ce04d5df826ed0446d46a1d83a6bc32f473b697c6262b4067e7d28  /tmp/w7-overlay.tgz" | sha256sum --check --strict
          python3 - <<'PY2'
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open('/tmp/w7-overlay.tgz', 'r:gz') as archive:
              members = archive.getmembers()
              if len(members) != 24:
                  raise SystemExit(f'unexpected W7 overlay member count: {len(members)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe W7 overlay member: {member.name}')
          PY2
          tar -xzf /tmp/w7-overlay.tgz -C .
          rm -f .w7-overlay.part-* .github/workflows/w7-materialize-route-truth.yml

          node scripts/validate-project-contracts.mjs
          node scripts/validate-content-model.mjs
          node scripts/validate-premium-reader-certification.mjs
          node scripts/validate-workflow-consolidation.mjs
          node scripts/validate-daily-content.mjs

          git config user.name "w7-route-truth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): establish single route truth and honest reader outcomes"
          git push origin HEAD:agent/w7-route-runtime-truth-20260806
