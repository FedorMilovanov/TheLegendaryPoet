name: Temporary refresh dependency lock

on:
  push:
    branches:
      - chore/remove-deprecated-studio-freight-lenis-20260727

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-deprecated-studio-freight-lenis-20260727

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize package lock"
          git push origin HEAD:chore/remove-deprecated-studio-freight-lenis-20260727
