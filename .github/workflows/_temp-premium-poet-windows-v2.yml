name: Temporary Premium Poet Windows V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-premium-poet-windows-v2.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Materialize clean premium poet windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          component_path = Path('src/components/home/HeroPoetWindow.tsx')
          component_path.parent.mkdir(parents=True, exist_ok=True)
          component_path.write_text(r'''import { useRef, type PointerEvent as ReactPointerEvent } from 'react';
          import {
            motion,
            useMotionValue,
            useReducedMotion,
            useSpring,
            useTransform,
          } from 'framer-motion';
          import type { Poet } from '../../types/poet';
          import PoetImage from '../PoetImage';
          import { Link } from '../ui/Link';

          interface HeroPoetWindowProps {
            poet: Poet;
            index: number;
          }

          const tiltSpring = { stiffness: 190, damping: 24, mass: 0.72 };
          const driftSpring = { stiffness: 150, damping: 28, mass: 0.82 };

          export default function HeroPoetWindow({ poet, index }: HeroPoetWindowProps) {
            const cardRef = useRef<HTMLDivElement>(null);
            const prefersReducedMotion = useReducedMotion();
            const pointerX = useMotionValue(0);
            const pointerY = useMotionValue(0);

            const rotateX = useSpring(useTransform(pointerY, [-0.5, 0.5], [5.5, -5.5]), tiltSpring);
            const rotateY = useSpring(useTransform(pointerX, [-0.5, 0.5], [-6.5, 6.5]), tiltSpring);
            const imageX = useSpring(useTransform(pointerX, [-0.5, 0.5], [-5, 5]), driftSpring);
            const imageY = useSpring(useTransform(pointerY, [-0.5, 0.5], [-4, 4]), driftSpring);
            const haloX = useSpring(useTransform(pointerX, [-0.5, 0.5], [-34, 34]), driftSpring);
            const haloY = useSpring(useTransform(pointerY, [-0.5, 0.5], [-24, 24]), driftSpring);

            const resetPointer = () => {
              pointerX.set(0);
              pointerY.set(0);
            };

            const handlePointerMove = (event: ReactPointerEvent<HTMLDivElement>) => {
              if (prefersReducedMotion || event.pointerType === 'touch') return;
              const bounds = cardRef.current?.getBoundingClientRect();
              if (!bounds) return;
              pointerX.set((event.clientX - bounds.left) / bounds.width - 0.5);
              pointerY.set((event.clientY - bounds.top) / bounds.height - 0.5);
            };

            return (
              <motion.div
                initial={{ opacity: 0, y: 24, scale: 0.96 }}
                animate={{ opacity: 1, y: 0, scale: 1 }}
                transition={{ delay: 0.09 * index, duration: 0.72, ease: [0.16, 1, 0.3, 1] }}
                className="relative min-w-0 [perspective:900px]"
              >
                <Link
                  to={`/poets/${poet.id}`}
                  data-hero-poet-window={poet.id}
                  aria-label={`Открыть страницу поэта ${poet.name}`}
                  className="group block rounded-t-[999px] outline-none focus-visible:ring-2 focus-visible:ring-cyan-300/80 focus-visible:ring-offset-4 focus-visible:ring-offset-[#020811]"
                >
                  <motion.div
                    ref={cardRef}
                    data-hero-poet-window-surface
                    onPointerMove={handlePointerMove}
                    onPointerLeave={resetPointer}
                    onBlur={resetPointer}
                    whileHover={prefersReducedMotion ? undefined : { y: -8, scale: 1.035 }}
                    whileTap={{ scale: 0.975 }}
                    style={prefersReducedMotion ? undefined : { rotateX, rotateY, transformPerspective: 900 }}
                    transition={{ type: 'spring', stiffness: 260, damping: 24, mass: 0.74 }}
                    className="relative aspect-[4/5] overflow-visible rounded-t-[999px] [transform-style:preserve-3d]"
                  >
                    <div data-hero-poet-window-glow className="pointer-events-none absolute -inset-[7px] rounded-t-[999px] border border-cyan-200/0 bg-[radial-gradient(circle_at_50%_18%,rgba(95,225,255,0.24),transparent_48%)] opacity-35 blur-xl transition-all duration-700 group-hover:border-cyan-200/20 group-hover:opacity-100 group-hover:blur-2xl group-focus-visible:border-cyan-200/20 group-focus-visible:opacity-100" />
                    <div className="pointer-events-none absolute -inset-px rounded-t-[999px] bg-[linear-gradient(145deg,rgba(198,247,255,0.68),rgba(55,170,255,0.12)_34%,rgba(2,8,17,0.9)_66%,rgba(83,204,255,0.42))] opacity-45 transition-opacity duration-500 group-hover:opacity-100 group-focus-visible:opacity-100" />
                    <div className="absolute inset-[1px] overflow-hidden rounded-t-[999px] bg-[#020811] shadow-[0_18px_42px_rgba(0,0,0,0.48),inset_0_0_0_1px_rgba(173,238,255,0.08)] transition-shadow duration-700 group-hover:shadow-[0_25px_58px_rgba(0,0,0,0.58),0_0_34px_rgba(38,187,255,0.24),inset_0_0_0_1px_rgba(180,241,255,0.22)] group-focus-visible:shadow-[0_25px_58px_rgba(0,0,0,0.58),0_0_34px_rgba(38,187,255,0.24),inset_0_0_0_1px_rgba(180,241,255,0.22)]">
                      <motion.div style={prefersReducedMotion ? undefined : { x: imageX, y: imageY }} className="absolute -inset-2">
                        <PoetImage src={poet.photo} name={poet.name} alt={`Портрет: ${poet.name}`} className="h-full w-full scale-[1.04] object-cover grayscale contrast-125 opacity-75 saturate-[0.68] transition-[filter,opacity,transform] duration-700 ease-out group-hover:scale-[1.095] group-hover:grayscale-[0.28] group-hover:opacity-95 group-hover:saturate-[0.88] group-focus-visible:scale-[1.095] group-focus-visible:grayscale-[0.28] group-focus-visible:opacity-95 group-focus-visible:saturate-[0.88]" />
                      </motion.div>
                      <div className="pointer-events-none absolute inset-0 bg-[linear-gradient(180deg,rgba(94,218,255,0.16),transparent_34%,rgba(1,7,15,0.2)_58%,rgba(1,7,15,0.96))]" />
                      <div className="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_28%,transparent_20%,rgba(1,7,15,0.1)_52%,rgba(1,7,15,0.72)_100%)]" />
                      <motion.div aria-hidden="true" style={prefersReducedMotion ? undefined : { x: haloX, y: haloY }} className="pointer-events-none absolute left-1/2 top-[28%] h-24 w-24 -translate-x-1/2 -translate-y-1/2 rounded-full bg-cyan-200/25 opacity-0 blur-2xl transition-opacity duration-500 group-hover:opacity-100 group-focus-visible:opacity-100 sm:h-32 sm:w-32" />
                      <div aria-hidden="true" className="pointer-events-none absolute -left-1/2 top-[-18%] h-[140%] w-[46%] rotate-[18deg] bg-gradient-to-r from-transparent via-white/18 to-transparent opacity-0 blur-[1px] transition-[transform,opacity] duration-700 ease-out group-hover:translate-x-[330%] group-hover:opacity-70 group-focus-visible:translate-x-[330%] group-focus-visible:opacity-70" />
                      <div aria-hidden="true" className="pointer-events-none absolute inset-x-[13%] top-[8%] h-px bg-gradient-to-r from-transparent via-cyan-100/70 to-transparent opacity-30 transition-opacity duration-500 group-hover:opacity-90 group-focus-visible:opacity-90" />
                      <div aria-hidden="true" className="pointer-events-none absolute inset-x-0 bottom-0 translate-y-2 px-2 pb-2 opacity-0 transition-all duration-500 group-hover:translate-y-0 group-hover:opacity-100 group-focus-visible:translate-y-0 group-focus-visible:opacity-100 sm:px-3 sm:pb-3">
                        <div className="rounded-xl border border-cyan-200/15 bg-[#020811]/72 px-2 py-1.5 text-center shadow-[0_0_24px_rgba(0,183,255,0.14)] backdrop-blur-md sm:px-3 sm:py-2">
                          <div className="truncate font-serif text-[9px] font-semibold tracking-[0.04em] text-cyan-50 sm:text-[11px]">{poet.name}</div>
                          <div className="mt-0.5 text-[7px] font-semibold uppercase tracking-[0.18em] text-cyan-200/46 sm:text-[8px]">{poet.birthYear}—{poet.deathYear ?? 'н. в.'}</div>
                        </div>
                      </div>
                    </div>
                  </motion.div>
                </Link>
              </motion.div>
            );
          }
          '''.replace('          ', ''), encoding='utf-8')

          home_path = Path('src/pages/HomePage.tsx')
          home = home_path.read_text(encoding='utf-8')
          home = home.replace("import PoetImage from '../components/PoetImage';", "import HeroPoetWindow from '../components/home/HeroPoetWindow';", 1)
          old_portraits = """const portraits = [\n  { name: 'Сергей Есенин', src: '/images/yesenin.jpg' },\n  { name: 'Михаил Лермонтов', src: '/images/lermontov.jpg' },\n  { name: 'Александр Пушкин', src: '/images/pushkin.jpg' },\n  { name: 'Федор Тютчев', src: '/images/tyutchev.jpg' },\n  { name: 'Владимир Маяковский', src: '/images/mayakovsky.jpg' },\n  { name: 'Афанасий Фет', src: '/images/fet.jpg' },\n];\n"""
          new_portraits = """const heroPoetIds = [\n  'sergei-yesenin',\n  'mikhail-lermontov',\n  'alexander-pushkin',\n  'fyodor-tyutchev',\n  'vladimir-mayakovsky',\n  'afanasy-fet',\n];\n\nfunction requireHeroPoet(id: string) {\n  const poet = poets.find((candidate) => candidate.id === id);\n  if (!poet) throw new Error(`Hero poet is missing from the library: ${id}`);\n  return poet;\n}\n\nconst heroPoets = heroPoetIds.map(requireHeroPoet);\n"""
          if old_portraits not in home:
              raise SystemExit('current main portrait block missing')
          home = home.replace(old_portraits, new_portraits, 1)
          old_grid = """          <div className=\"mx-auto mb-16 grid max-w-5xl grid-cols-3 gap-6 opacity-80 sm:grid-cols-6 lg:gap-8\">\n            {portraits.map((portrait, index) => (\n              <motion.div key={portrait.name} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.12 * index, duration: 0.65 }} className=\"relative aspect-[4/5] overflow-hidden rounded-t-full border border-cyan-400/20 bg-black/40 shadow-[0_0_32px_rgba(0,212,255,0.10)]\">\n                <PoetImage src={portrait.src} name={portrait.name} alt={`Портрет: ${portrait.name}`} className=\"h-full w-full object-cover grayscale contrast-125 opacity-75\" />\n                <div className=\"absolute inset-0 bg-gradient-to-t from-[#020811] via-transparent to-cyan-400/10\" />\n              </motion.div>\n            ))}\n          </div>\n"""
          new_grid = """          <div className=\"mx-auto mb-16 grid max-w-5xl grid-cols-3 items-end gap-4 sm:grid-cols-6 sm:gap-5 lg:gap-7\">\n            {heroPoets.map((poet, index) => (\n              <HeroPoetWindow key={poet.id} poet={poet} index={index} />\n            ))}\n          </div>\n"""
          if old_grid not in home:
              raise SystemExit('current main hero grid missing')
          home_path.write_text(home.replace(old_grid, new_grid, 1), encoding='utf-8')

          qa_path = Path('qa/focused-interactions.spec.mjs')
          qa = qa_path.read_text(encoding='utf-8')
          qa += r'''

test.describe('premium home poet windows', () => {
  test.use({ viewport: { width: 1440, height: 1000 }, locale: 'ru-RU', timezoneId: 'Europe/Paris', colorScheme: 'dark' });
  test('six canonical poets keep working links, focus and premium hover depth', async ({ page }) => {
    const pageErrors = [];
    page.on('pageerror', (error) => pageErrors.push(String(error?.stack || error)));
    await page.goto(BASE_URL, { waitUntil: 'domcontentloaded' });
    await waitForRoute(page);
    const windows = page.locator('[data-hero-poet-window]');
    await expect(windows).toHaveCount(6);
    expect(await windows.evaluateAll((links) => links.map((link) => link.getAttribute('href')))).toEqual([
      '/poets/sergei-yesenin', '/poets/mikhail-lermontov', '/poets/alexander-pushkin',
      '/poets/fyodor-tyutchev', '/poets/vladimir-mayakovsky', '/poets/afanasy-fet',
    ]);
    const decoded = await windows.locator('img').evaluateAll((images) => images.map((image) => ({ complete: image.complete, width: image.naturalWidth, height: image.naturalHeight })));
    expect(decoded.every((image) => image.complete && image.width > 0 && image.height > 0)).toBe(true);
    const first = windows.first();
    const surface = first.locator('[data-hero-poet-window-surface]');
    const glow = first.locator('[data-hero-poet-window-glow]');
    const before = await surface.evaluate((node) => ({ transform: getComputedStyle(node).transform, glowOpacity: getComputedStyle(node.querySelector('[data-hero-poet-window-glow]')).opacity }));
    await first.hover({ position: { x: 12, y: 18 } });
    await expect.poll(() => surface.evaluate((node) => getComputedStyle(node).transform), { timeout: 2_500 }).not.toBe(before.transform);
    await expect.poll(() => glow.evaluate((node) => getComputedStyle(node).opacity), { timeout: 2_500 }).not.toBe(before.glowOpacity);
    await first.focus();
    await expect(first).toBeFocused();
    await page.screenshot({ path: path.join(ARTIFACT_DIR, 'desktop-premium-poet-windows.png'), fullPage: true });
    expect(pageErrors).toEqual([]);
  });
});
'''
          qa_path.write_text(qa, encoding='utf-8')

          brand_test_path = Path('qa/brand-emblem.spec.mjs')
          brand_test = brand_test_path.read_text(encoding='utf-8')
          helper_anchor = "async function pngSize(page, url) {\n  return page.evaluate(async (assetUrl) => {\n    const image = new Image();\n    image.src = assetUrl;\n    await image.decode();\n    return { width: image.naturalWidth, height: image.naturalHeight };\n  }, url);\n}\n"
          helper = helper_anchor + "\nasync function visualState(locator) {\n  return locator.evaluate((node) => {\n    const computed = getComputedStyle(node);\n    return { opacity: computed.opacity, transform: computed.transform, filter: computed.filter, strokeDasharray: node.getAttribute('stroke-dasharray'), strokeDashoffset: node.getAttribute('stroke-dashoffset') };\n  });\n}\n"
          brand_test = brand_test.replace(helper_anchor, helper, 1)
          old_hover = """  const before = {\n    wing: await leftWing.getAttribute('style'),\n    halo: await halo.getAttribute('style'),\n    filter: await mark.locator('svg').getAttribute('style'),\n  };\n\n  await mark.hover();\n  await page.waitForTimeout(420);\n\n  const after = {\n    wing: await leftWing.getAttribute('style'),\n    halo: await halo.getAttribute('style'),\n    filter: await mark.locator('svg').getAttribute('style'),\n  };\n  expect(after.wing).not.toBe(before.wing);\n  expect(after.halo).not.toBe(before.halo);\n  expect(after.filter).not.toBe(before.filter);\n"""
          new_hover = """  const svg = mark.locator('svg');\n  const before = { wing: await visualState(leftWing), halo: await visualState(halo), filter: (await visualState(svg)).filter };\n  await mark.hover();\n  await expect.poll(() => visualState(leftWing), { timeout: 2_500 }).not.toEqual(before.wing);\n  await expect.poll(() => visualState(halo), { timeout: 2_500 }).not.toEqual(before.halo);\n  await expect.poll(async () => (await visualState(svg)).filter, { timeout: 2_500 }).not.toBe(before.filter);\n"""
          if old_hover not in brand_test:
              raise SystemExit('brand hover assertion block missing')
          brand_test_path.write_text(brand_test.replace(old_hover, new_hover, 1), encoding='utf-8')

          validator_path = Path('scripts/validate-brand-assets.ts')
          validator = validator_path.read_text(encoding='utf-8')
          old_validator = """function pngDimensions(buffer: Buffer) {\n  assert.equal(buffer.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', 'invalid PNG signature');\n  return { width: buffer.readUInt32BE(16), height: buffer.readUInt32BE(20) };\n}\n"""
          new_validator = """function crc32(buffer: Buffer) {\n  let crc = 0xffffffff;\n  for (const byte of buffer) {\n    crc ^= byte;\n    for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);\n  }\n  return (crc ^ 0xffffffff) >>> 0;\n}\n\nfunction pngDimensions(buffer: Buffer, file: string) {\n  assert.equal(buffer.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', `${file}: invalid PNG signature`);\n  let offset = 8;\n  let dimensions: { width: number; height: number } | null = null;\n  let sawIend = false;\n  while (offset + 12 <= buffer.length) {\n    const length = buffer.readUInt32BE(offset);\n    const type = buffer.subarray(offset + 4, offset + 8).toString('ascii');\n    const dataEnd = offset + 8 + length;\n    const chunkEnd = dataEnd + 4;\n    assert.ok(chunkEnd <= buffer.length, `${file}: truncated ${type || 'unknown'} chunk`);\n    assert.equal(crc32(buffer.subarray(offset + 4, dataEnd)), buffer.readUInt32BE(dataEnd), `${file}: invalid ${type} CRC`);\n    if (type === 'IHDR') dimensions = { width: buffer.readUInt32BE(offset + 8), height: buffer.readUInt32BE(offset + 12) };\n    offset = chunkEnd;\n    if (type === 'IEND') { sawIend = true; break; }\n  }\n  assert.ok(dimensions, `${file}: IHDR chunk is missing`);\n  assert.ok(sawIend, `${file}: IEND chunk is missing`);\n  assert.equal(offset, buffer.length, `${file}: trailing bytes after IEND`);\n  return dimensions;\n}\n"""
          if old_validator not in validator:
              raise SystemExit('brand validator PNG function missing')
          validator = validator.replace(old_validator, new_validator, 1).replace('pngDimensions(readBuffer(file))', 'pngDimensions(readBuffer(file), file)')
          validator_path.write_text(validator, encoding='utf-8')
          PY
          git diff --check

      - name: Validate clean current-main transaction
        run: |
          npm ci
          npm run validate:brand
          npm run validate:interaction-runtime
          npm run typecheck
          npm run build
          git diff --check

      - name: Commit exact permanent scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          files=(
            src/components/home/HeroPoetWindow.tsx
            src/pages/HomePage.tsx
            qa/focused-interactions.spec.mjs
            qa/brand-emblem.spec.mjs
            scripts/validate-brand-assets.ts
          )
          git add "${files[@]}"
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'feat(home): add premium interactive poet windows'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}