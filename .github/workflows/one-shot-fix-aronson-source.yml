name: One-shot fix Aronson source identity

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/yesenin-part-two-document-evidence-20260807' || github.ref_name == 'fix/yesenin-part-two-document-evidence-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yesenin-part-two-document-evidence-20260807
          fetch-depth: 0
      - name: Repair transport source identity
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/one-shot-yesenin-document-evidence-pr.yml')
          text = p.read_text(encoding='utf-8')
          old_source = "      url: 'https://biblio.imli.ru/index.php/component/abook/book/826-letopis-zhizni-i-tvorchestva-s-a-esenina-tom-5?Itemid=0&catid=527%3Aesenin-s-a',\\n      kind: 'primary',\\n      institution: 'ГЛМ, ф. 4, оп. 1, ед. хр. 339 / публикация ИМЛИ РАН',"
          new_source = "      kind: 'primary',\\n      institution: 'ГЛМ, ф. 4, оп. 1, ед. хр. 339 / публикация ИМЛИ РАН',"
          old_required = "  'yes2-aronson-receipt-1925-12-16': /^https:\\\\/\\\\/biblio\\\\.imli\\\\.ru\\\\//,\\n"
          for old, new, label in [(old_source, new_source, 'source URL'), (old_required, '', 'required URL')]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-aronson-source.yml
          git add .github/workflows/one-shot-yesenin-document-evidence-pr.yml
          git diff --cached --check
          git commit -m "chore: keep Aronson receipt as archive-addressed source"
          git push origin HEAD:fix/yesenin-part-two-document-evidence-20260807
