name: One-shot guarded merged-head cleanup batch 3 recovery trigger

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-batch3-resume-trigger.yml

concurrency:
  group: branch-cleanup-batch3-recovery
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lock, reconcile, finish safe refs, and finalize the report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime as dt, json, os, urllib.error, urllib.parse, urllib.request
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          run_sha = os.environ["RUN_SHA"]
          owner = repo.split("/", 1)[0]
          report_path = "qa/branch-cleanup-batch3-report.json"
          lock_path = "qa/branch-cleanup-batch3-recovery-lock.json"
          allowed_bases = {"main", "work/local-images-playwright-wtoc"}
          forbidden_exact = {"main", "work/local-images-playwright-wtoc"}
          forbidden_prefixes = ("backup/", "archive/", "editorial/", "work/", "ops/")

          def api(method, path, payload=None, allow_404=False, soft=False):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(f"https://api.github.com{path}", data=data, method=method)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              req.add_header("User-Agent", "branch-cleanup-batch3-recovery")
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None, None
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  if allow_404 and exc.code == 404:
                      return 404, None, None
                  if soft:
                      return exc.code, None, raw
                  raise RuntimeError(f"{method} {path}: {exc.code} {raw}") from exc

          def enc(value): return urllib.parse.quote(value, safe="")
          def b64_json(value):
              return base64.b64encode((json.dumps(value, ensure_ascii=False, indent=2) + "\n").encode()).decode()

          # Acquire a repository-visible, create-only lock. A second recovery run aborts here.
          lock_status, _, _ = api("GET", f"/repos/{repo}/contents/{lock_path}?ref=main", allow_404=True)
          if lock_status != 404:
              raise RuntimeError("Recovery lock already exists")
          lock = {"runSha": run_sha, "createdAt": dt.datetime.now(dt.timezone.utc).isoformat()}
          lock_payload = {"message":"ops: lock branch cleanup batch 3 recovery","content":b64_json(lock),"branch":"main"}
          lock_code, _, lock_error = api("PUT", f"/repos/{repo}/contents/{lock_path}", lock_payload, soft=True)
          if lock_code not in (200, 201):
              raise RuntimeError(f"Could not acquire recovery lock: {lock_code} {lock_error}")

          _, report_file, _ = api("GET", f"/repos/{repo}/contents/{report_path}?ref=main")
          report_sha = report_file["sha"]
          report = json.loads(base64.b64decode(report_file["content"]).decode())
          if report.get("state") != "PLANNED":
              raise RuntimeError(f"Report is not PLANNED: {report.get('state')}")
          candidates = report.get("candidates", [])
          if len(candidates) != report.get("candidateCount") or len(candidates) > 150:
              raise RuntimeError("Candidate count mismatch or safety ceiling exceeded")

          _, open_repo, _ = api("GET", f"/repos/{repo}/pulls?state=open&per_page=100")
          if open_repo:
              raise RuntimeError(f"Repository has {len(open_repo)} open PR(s)")

          absent = []
          deleted_now = []
          skipped = []
          for item in candidates:
              branch, expected, pr_no, base = item["branch"], item["sha"], item["pr"], item["base"]
              if branch in forbidden_exact or branch.startswith(forbidden_prefixes) or base not in allowed_bases:
                  skipped.append({**item,"status":"skipped_forbidden_policy"}); continue
              status, ref, _ = api("GET", f"/repos/{repo}/git/ref/heads/{enc(branch)}", allow_404=True)
              if status == 404:
                  absent.append({**item,"status":"absent_confirmed_after_plan"}); continue
              if ref["object"]["sha"] != expected:
                  skipped.append({**item,"status":"skipped_sha_changed","currentSha":ref["object"]["sha"]}); continue
              bstatus, binfo, _ = api("GET", f"/repos/{repo}/branches/{enc(branch)}", allow_404=True)
              if bstatus == 404:
                  absent.append({**item,"status":"absent_confirmed_during_recovery"}); continue
              if binfo.get("protected"):
                  skipped.append({**item,"status":"skipped_protected"}); continue
              _, pr, _ = api("GET", f"/repos/{repo}/pulls/{pr_no}")
              identity_ok = (
                  pr.get("state") == "closed" and pr.get("merged_at") and
                  pr.get("head",{}).get("ref") == branch and
                  pr.get("head",{}).get("sha") == expected and
                  pr.get("base",{}).get("ref") == base and base in allowed_bases
              )
              if not identity_ok:
                  skipped.append({**item,"status":"skipped_pr_identity_changed"}); continue
              _, open_head, _ = api("GET", f"/repos/{repo}/pulls?state=open&head={enc(owner + ':' + branch)}&per_page=100")
              if open_head:
                  skipped.append({**item,"status":"skipped_open_pr"}); continue
              dstatus, _, derr = api("DELETE", f"/repos/{repo}/git/refs/heads/{enc(branch)}", soft=True)
              if dstatus not in (200, 204):
                  skipped.append({**item,"status":"skipped_delete_rejected","httpStatus":dstatus,"error":derr}); continue
              vstatus, _, _ = api("GET", f"/repos/{repo}/git/ref/heads/{enc(branch)}", allow_404=True)
              if vstatus != 404:
                  skipped.append({**item,"status":"skipped_delete_not_verified"}); continue
              deleted_now.append({**item,"status":"deleted_confirmed_by_recovery"})

          _, final_open, _ = api("GET", f"/repos/{repo}/pulls?state=open&per_page=100")
          report.update({
              "state": "COMPLETE" if not skipped else "COMPLETE_WITH_SKIPS",
              "recoveryRunSha": run_sha,
              "completedAt": dt.datetime.now(dt.timezone.utc).isoformat(),
              "absentConfirmedFromOriginalRun": absent,
              "deletedConfirmedByRecovery": deleted_now,
              "deleted": absent + deleted_now,
              "originalRunAbsentConfirmedCount": len(absent),
              "recoveryDeletedConfirmedCount": len(deleted_now),
              "totalAbsentConfirmedCount": len(absent) + len(deleted_now),
              "skippedAfterRecovery": skipped,
              "skippedAfterRecoveryCount": len(skipped),
              "openPrCountAtFinalize": len(final_open),
          })
          payload = {"message":"ops: finalize branch cleanup batch 3 report","content":b64_json(report),"sha":report_sha,"branch":"main"}
          _, updated, _ = api("PUT", f"/repos/{repo}/contents/{report_path}", payload)
          summary = {
              "state":report["state"], "candidateCount":len(candidates),
              "originalRunAbsentConfirmedCount":len(absent),
              "recoveryDeletedConfirmedCount":len(deleted_now),
              "totalAbsentConfirmedCount":len(absent)+len(deleted_now),
              "skippedAfterRecoveryCount":len(skipped),
              "reportCommit":updated["commit"]["sha"]
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("# Branch cleanup batch 3 recovery\n\n")
              for k,v in summary.items(): fh.write(f"- **{k}**: `{v}`\n")
          PY
