name: Guarded remaining branch cleanup batch 7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-safe-batch7-main.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const source=await github.rest.repos.getContent({owner,repo,path:'qa/remaining-branch-candidate-analysis-2026-08-04.json',ref:'main'});
            const data=JSON.parse(Buffer.from(source.data.content,'base64').toString('utf8'));
            const archiveClasses=new Set(['CLOSED_EXPLICIT_NEVER_MERGE','CLOSED_MENTIONS_SUCCESSOR','RESEARCH_DIAGNOSTIC_OR_SUPERSEDED']);
            const directClasses=new Set(['MERGED_EXACT','OPS_TEMP']);
            const targets=data.rows.filter(r=>archiveClasses.has(r.class)||directClasses.has(r.class)).sort((a,b)=>a.branch.localeCompare(b.branch));
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const openHeads=new Set(open.filter(p=>p.head.repo&&p.head.repo.full_name===`${owner}/${repo}`).map(p=>p.head.ref));
            const report={repository:`${owner}/${repo}`,runSha:context.sha,startedAt:new Date().toISOString(),planned:targets.length,archivePlanned:targets.filter(r=>archiveClasses.has(r.class)).length,directPlanned:targets.filter(r=>directClasses.has(r.class)).length,results:[]};
            for(const r of targets){
              const item={branch:r.branch,sha:r.sha,class:r.class,pr:r.exactPr?.number||null,status:'PENDING'};
              report.results.push(item);
              if(openHeads.has(r.branch)) throw new Error(`Target has open PR: ${r.branch}`);
              let ref;
              try{ref=await github.rest.git.getRef({owner,repo,ref:`heads/${r.branch}`});}catch(e){if(e.status===404){item.status='ALREADY_ABSENT';continue;}throw e;}
              if(ref.data.object.sha!==r.sha) throw new Error(`SHA changed for ${r.branch}: ${ref.data.object.sha} != ${r.sha}`);
              const bm=await github.rest.repos.getBranch({owner,repo,branch:r.branch});
              if(bm.data.protected) throw new Error(`Protected target: ${r.branch}`);
              if(r.class==='MERGED_EXACT'){
                if(!r.exactPr?.number||!r.exactPr?.mergedAt) throw new Error(`Merged guard missing for ${r.branch}`);
                const p=await github.rest.pulls.get({owner,repo,pull_number:r.exactPr.number});
                if(!p.data.merged_at||p.data.head.sha!==r.sha) throw new Error(`Merged PR guard failed for ${r.branch}`);
              }else if(r.class==='OPS_TEMP'){
                if(!r.branch.startsWith('ops/')) throw new Error(`Ops guard failed for ${r.branch}`);
              }else{
                if(!r.exactPr?.number) throw new Error(`Archive PR guard missing for ${r.branch}`);
                const p=await github.rest.pulls.get({owner,repo,pull_number:r.exactPr.number});
                if(p.data.state!=='closed'||p.data.merged_at||p.data.head.sha!==r.sha) throw new Error(`Closed-unmerged PR guard failed for ${r.branch}`);
                const tag=`archive/branches/2026-08-04/batch7/${r.branch}`;
                item.archiveTag=tag;
                try{
                  const t=await github.rest.git.getRef({owner,repo,ref:`tags/${tag}`});
                  if(t.data.object.sha!==r.sha) throw new Error(`Existing tag mismatch: ${tag}`);
                }catch(e){
                  if(e.status!==404) throw e;
                  await github.rest.git.createRef({owner,repo,ref:`refs/tags/${tag}`,sha:r.sha});
                }
                const verified=await github.rest.git.getRef({owner,repo,ref:`tags/${tag}`});
                if(verified.data.object.sha!==r.sha) throw new Error(`Tag verification failed: ${tag}`);
              }
              await github.rest.git.deleteRef({owner,repo,ref:`heads/${r.branch}`});
              await sleep(120);
              try{await github.rest.git.getRef({owner,repo,ref:`heads/${r.branch}`});throw new Error(`Ref still exists: ${r.branch}`);}catch(e){if(e.status!==404)throw e;}
              item.status='DELETED_CONFIRMED';
            }
            report.completedAt=new Date().toISOString();
            report.deletedConfirmed=report.results.filter(x=>x.status==='DELETED_CONFIRMED').length;
            report.alreadyAbsent=report.results.filter(x=>x.status==='ALREADY_ABSENT').length;
            report.archived=report.results.filter(x=>x.archiveTag&&x.status==='DELETED_CONFIRMED').length;
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            report.branchCountAfter=branches.length;
            const path='qa/branch-cleanup-batch7-report.json';
            let cur;try{cur=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'ops: record guarded branch cleanup batch 7',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),sha:cur?.data?.sha});
            core.summary.addHeading('Batch 7 complete').addCodeBlock(JSON.stringify({planned:report.planned,deletedConfirmed:report.deletedConfirmed,archived:report.archived,branchCountAfter:report.branchCountAfter},null,2),'json').write();
