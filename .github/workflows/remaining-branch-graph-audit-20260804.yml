name: Audit graph containment of remaining branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remaining-branch-graph-audit-20260804.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const pulls=await github.paginate(github.rest.pulls.list,{owner,repo,state:'all',sort:'updated',direction:'desc',per_page:100});
            const merged=pulls.filter(p=>p.merged_at);
            const rows=[];
            for(const b of branches.sort((a,b)=>a.name.localeCompare(b.name))){
              const prs=pulls.filter(p=>p.head.repo&&p.head.repo.full_name===`${owner}/${repo}`&&p.head.ref===b.name);
              const exact=prs.find(p=>p.head.sha===b.commit.sha)||null;
              let cm=null,cr=null,files=[];
              if(b.name!=='main'){
                try{cm=(await github.rest.repos.compareCommits({owner,repo,base:b.name,head:'main'})).data;}catch(e){cm={error:e.status||String(e)}}
                if(b.name!=='work/local-images-playwright-wtoc'){
                  try{cr=(await github.rest.repos.compareCommits({owner,repo,base:b.name,head:'work/local-images-playwright-wtoc'})).data;}catch(e){cr={error:e.status||String(e)}}
                }
                try{const d=(await github.rest.repos.compareCommits({owner,repo,base:'main',head:b.name})).data;files=(d.files||[]).map(f=>f.filename).slice(0,80);}catch(e){}
              }
              const mentions=merged.filter(p=>((p.title||'')+'\n'+(p.body||'')).includes(b.name)).map(p=>({number:p.number,title:p.title,base:p.base.ref,mergedAt:p.merged_at}));
              rows.push({branch:b.name,sha:b.commit.sha,protected:b.protected,exactPr:exact?{number:exact.number,state:exact.state,mergedAt:exact.merged_at,base:exact.base.ref,title:exact.title,body:(exact.body||'').slice(0,1800)}:null,allPrs:prs.map(p=>({number:p.number,state:p.state,mergedAt:p.merged_at,base:p.base.ref,headSha:p.head.sha,title:p.title})),containedInMain:b.name==='main'?true:(cm&&!cm.error&&cm.behind_by===0),mainAheadBy:cm?.ahead_by??null,mainBehindBy:cm?.behind_by??null,containedInCanonical:b.name==='work/local-images-playwright-wtoc'?true:(cr&&!cr.error&&cr.behind_by===0),canonicalAheadBy:cr?.ahead_by??null,canonicalBehindBy:cr?.behind_by??null,changedPathsVsMain:files,changedPathCount:files.length,mergedPrMentions:mentions});
            }
            const counts={branchCount:rows.length,containedInMain:rows.filter(r=>r.containedInMain).length,containedInCanonical:rows.filter(r=>r.containedInCanonical).length,mentionedByMergedPr:rows.filter(r=>r.mergedPrMentions.length).length,noExactPr:rows.filter(r=>!r.exactPr).length};
            const report={repository:`${owner}/${repo}`,runSha:context.sha,generatedAt:new Date().toISOString(),counts,rows};
            const jsonPath='qa/remaining-branch-graph-audit-2026-08-04.json';
            const tsvPath='qa/remaining-branch-graph-audit-2026-08-04.tsv';
            const lines=[['BRANCH','SHA','MAIN_CONTAINS','RESEARCH_CONTAINS','EXACT_PR','PR_STATE','MERGED','FILES','MERGED_MENTIONS','TITLE'].join('\t')];
            for(const r of rows)lines.push([r.branch,r.sha,r.containedInMain,r.containedInCanonical,r.exactPr?.number||'',r.exactPr?.state||'',!!r.exactPr?.mergedAt,r.changedPathCount,r.mergedPrMentions.map(x=>x.number).join(','),(r.exactPr?.title||'').replace(/[\t\r\n]+/g,' ')].join('\t'));
            for(const [path,content,msg] of [[jsonPath,JSON.stringify(report,null,2)+'\n','audit(branches): record graph containment'],[tsvPath,lines.join('\n')+'\n','audit(branches): add compact graph containment summary']]){
              let cur;try{cur=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:msg,content:Buffer.from(content).toString('base64'),sha:cur?.data?.sha});
            }
            core.summary.addHeading('Remaining graph audit').addCodeBlock(JSON.stringify(counts,null,2),'json').write();
