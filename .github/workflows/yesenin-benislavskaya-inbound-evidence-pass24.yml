name: Yesenin Benislavskaya Inbound Evidence Pass 24

on:
  pull_request:
    branches: [work/local-images-playwright-wtoc]
    paths:
      - 'src/data/essays/yeseninBenislavskayaInboundEvidencePassTwentyFour.ts'
      - 'scripts/validate-yesenin-benislavskaya-inbound-evidence-pass24.ts'
      - 'research/yesenin/PART_ONE_BENISLAVSKAYA_INBOUND_EVIDENCE_PASS24_2026-07-25.md'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/yesenin-benislavskaya-inbound-evidence-pass24.yml'
  push:
    branches: [work/local-images-playwright-wtoc]
    paths:
      - 'src/data/essays/yeseninBenislavskayaInboundEvidencePassTwentyFour.ts'
      - 'scripts/validate-yesenin-benislavskaya-inbound-evidence-pass24.ts'
      - 'research/yesenin/PART_ONE_BENISLAVSKAYA_INBOUND_EVIDENCE_PASS24_2026-07-25.md'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/yesenin-benislavskaya-inbound-evidence-pass24.yml'

concurrency:
  group: yesenin-benislavskaya-inbound-evidence-pass24-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Validate Benislavskaya inbound and gift evidence pass 24
        run: npm run validate:yesenin-benislavskaya-inbound-pass24
      - name: TypeScript typecheck
        run: npm run typecheck
