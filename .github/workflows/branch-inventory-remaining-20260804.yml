name: Remaining branch semantic inventory

on:
  push:
    branches: [main]
    paths: [.github/workflows/branch-inventory-remaining-20260804.yml]

permissions:
  contents: write
  pull-requests: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Build exact branch and PR inventory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64, json, os, re, time
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; run_sha=os.environ['RUN_SHA']
          api='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'branch-inventory'}
          def req(path, method='GET', data=None):
              body=None if data is None else json.dumps(data).encode()
              r=Request(path if path.startswith('http') else api+path, data=body, headers=headers, method=method)
              try:
                  with urlopen(r, timeout=60) as x:
                      raw=x.read()
                      return x.status, (json.loads(raw) if raw else None)
              except HTTPError as e:
                  raw=e.read()
                  try: payload=json.loads(raw)
                  except Exception: payload={'raw':raw.decode(errors='replace')}
                  return e.code, payload
          def paged(path):
              out=[]; page=1
              while True:
                  sep='&' if '?' in path else '?'
                  st, rows=req(f'{path}{sep}per_page=100&page={page}')
                  if st!=200: raise RuntimeError((st,rows))
                  out.extend(rows)
                  if len(rows)<100: return out
                  page+=1
          branches=paged('/branches')
          pulls=paged('/pulls?state=all&sort=updated&direction=desc')
          by_head={}
          for p in pulls:
              if (p.get('head',{}).get('repo') or {}).get('full_name')==repo:
                  by_head.setdefault(p['head']['ref'],[]).append(p)
          never_rx=re.compile(r'never merge|must never be merged|do not merge|not for merge|diagnostic only|read-only|temporary qa|temporary workflow',re.I)
          records=[]
          for i,b in enumerate(sorted(branches,key=lambda x:x['name'])):
              name=b['name']; sha=b['commit']['sha']; prs=by_head.get(name,[])
              latest=prs[0] if prs else None
              comp_status, comp=req('/compare/main...'+quote(name,safe='')) if name!='main' else (200,{'status':'identical','ahead_by':0,'behind_by':0,'files':[]})
              comp_ok=comp_status==200
              comp_files=[]
              if comp_ok:
                  for f in (comp.get('files') or [])[:150]:
                      comp_files.append({'path':f['filename'],'status':f['status'],'changes':f.get('changes',0)})
              pr_files=[]
              if latest:
                  fs=paged(f"/pulls/{latest['number']}/files")
                  pr_files=[{'path':f['filename'],'status':f['status'],'changes':f.get('changes',0)} for f in fs[:150]]
              body=(latest or {}).get('body') or ''
              open_prs=[p['number'] for p in prs if p['state']=='open']
              exact_prs=[p['number'] for p in prs if p['head']['sha']==sha]
              record={
                  'branch':name,'sha':sha,'protected':bool(b.get('protected')),
                  'openPrs':open_prs,'exactHeadPrs':exact_prs,
                  'latestPr': None if not latest else {
                      'number':latest['number'],'state':latest['state'],'mergedAt':latest.get('merged_at'),
                      'base':latest['base']['ref'],'headSha':latest['head']['sha'],'title':latest['title'],
                      'draft':latest.get('draft',False),'closedAt':latest.get('closed_at'),
                      'neverMergeLanguage':bool(never_rx.search(body)),
                      'bodyExcerpt':body[:1200]
                  },
                  'compare': {
                      'httpStatus':comp_status,
                      'status':comp.get('status') if comp_ok else None,
                      'aheadBy':comp.get('ahead_by') if comp_ok else None,
                      'behindBy':comp.get('behind_by') if comp_ok else None,
                      'totalCommits':comp.get('total_commits') if comp_ok else None,
                      'files':comp_files,
                      'fileCount':len(comp.get('files') or []) if comp_ok else None
                  },
                  'latestPrFiles':pr_files,
                  'allPrs':[{'number':p['number'],'state':p['state'],'mergedAt':p.get('merged_at'),'base':p['base']['ref'],'headSha':p['head']['sha'],'title':p['title']} for p in prs]
              }
              records.append(record)
              time.sleep(.08)
          report={'repository':repo,'runSha':run_sha,'branchCount':len(branches),'pullCount':len(pulls),'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'branches':records}
          content=json.dumps(report,ensure_ascii=False,indent=2)+'\n'
          path='qa/remaining-branch-inventory-2026-08-04.json'
          st,existing=req('/contents/'+quote(path,safe='/'))
          payload={'message':'audit(branches): record exact remaining branch inventory','content':base64.b64encode(content.encode()).decode(),'branch':'main'}
          if st==200: payload['sha']=existing['sha']
          st,res=req('/contents/'+quote(path,safe='/'),'PUT',payload)
          if st not in (200,201): raise RuntimeError((st,res))
          print(json.dumps({'branchCount':len(branches),'reportPath':path,'commit':res['commit']['sha']}))
          PY
