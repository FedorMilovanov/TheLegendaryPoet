name: Finalize guarded remaining branch cleanup batch 7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-safe-batch7-finalize.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const absent=e=>[404,409,422].includes(e?.status);
            async function refOrNull(ref){try{return (await github.rest.git.getRef({owner,repo,ref})).data.object.sha;}catch(e){if(absent(e))return null;throw e;}}
            async function waitRef(ref,expected,tries=12){for(let i=0;i<tries;i++){const s=await refOrNull(ref);if(s===expected)return s;if(s&&s!==expected)throw new Error(`Ref mismatch ${ref}: ${s}`);await sleep(350);}return null;}
            async function waitAbsent(ref,tries=12){for(let i=0;i<tries;i++){const s=await refOrNull(ref);if(!s)return true;await sleep(350);}return false;}
            const src=await github.rest.repos.getContent({owner,repo,path:'qa/remaining-branch-candidate-analysis-2026-08-04.json',ref:'main'});
            const data=JSON.parse(Buffer.from(src.data.content,'base64').toString('utf8'));
            const archiveClasses=new Set(['CLOSED_EXPLICIT_NEVER_MERGE','CLOSED_MENTIONS_SUCCESSOR','RESEARCH_DIAGNOSTIC_OR_SUPERSEDED']);
            const directClasses=new Set(['MERGED_EXACT','OPS_TEMP']);
            const targets=data.rows.filter(r=>archiveClasses.has(r.class)||directClasses.has(r.class)).sort((a,b)=>a.branch.localeCompare(b.branch));
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const openHeads=new Set(open.filter(p=>p.head.repo&&p.head.repo.full_name===`${owner}/${repo}`).map(p=>p.head.ref));
            const report={repository:`${owner}/${repo}`,runSha:context.sha,startedAt:new Date().toISOString(),planned:targets.length,results:[]};
            for(const r of targets){
              const item={branch:r.branch,sha:r.sha,class:r.class,pr:r.exactPr?.number||null,archiveTag:null,tagExact:null,branchAbsent:null,action:'NONE',status:'PENDING'};report.results.push(item);
              try{
                if(openHeads.has(r.branch)){item.status='OPEN_PR_BLOCK';continue;}
                if(r.class==='MERGED_EXACT'){
                  const p=await github.rest.pulls.get({owner,repo,pull_number:r.exactPr.number});
                  if(!p.data.merged_at||p.data.head.sha!==r.sha){item.status='MERGED_GUARD_BLOCK';continue;}
                }else if(r.class==='OPS_TEMP'){
                  if(!r.branch.startsWith('ops/')){item.status='OPS_GUARD_BLOCK';continue;}
                }else{
                  const p=await github.rest.pulls.get({owner,repo,pull_number:r.exactPr.number});
                  if(p.data.state!=='closed'||p.data.merged_at||p.data.head.sha!==r.sha){item.status='PR_GUARD_BLOCK';continue;}
                  const tag=`archive/branches/2026-08-04/batch7/${r.branch}`;item.archiveTag=tag;
                  let ts=await refOrNull(`tags/${tag}`);
                  if(ts&&ts!==r.sha){item.status='TAG_MISMATCH_BLOCK';item.tagExact=false;continue;}
                  if(!ts){
                    try{await github.rest.git.createRef({owner,repo,ref:`refs/tags/${tag}`,sha:r.sha});item.action='TAG_CREATED';}catch(e){if(!absent(e))throw e;}
                    ts=await waitRef(`tags/${tag}`,r.sha);
                  }
                  item.tagExact=ts===r.sha;
                  if(!item.tagExact){item.status='TAG_NOT_VISIBLE_BLOCK';continue;}
                }
                let bs=await refOrNull(`heads/${r.branch}`);
                if(bs&&bs!==r.sha){item.status='SHA_CHANGED_BLOCK';item.currentSha=bs;continue;}
                if(bs){
                  try{const bm=await github.rest.repos.getBranch({owner,repo,branch:r.branch});if(bm.data.protected){item.status='PROTECTED_BLOCK';continue;}}catch(e){if(!absent(e))throw e;}
                  try{await github.rest.git.deleteRef({owner,repo,ref:`heads/${r.branch}`});item.action=item.action==='TAG_CREATED'?'TAG_CREATED_AND_DELETE_SENT':'DELETE_SENT';}catch(e){if(!absent(e))throw e;}
                  let gone=await waitAbsent(`heads/${r.branch}`);
                  if(!gone){try{await github.rest.git.deleteRef({owner,repo,ref:`heads/${r.branch}`});}catch(e){if(!absent(e))throw e;}gone=await waitAbsent(`heads/${r.branch}`);}
                  item.branchAbsent=gone;
                  item.status=gone?'ABSENT_CONFIRMED':'DELETE_NOT_CONFIRMED';
                }else{item.branchAbsent=true;item.status='ABSENT_CONFIRMED';}
              }catch(e){item.status='ERROR';item.error=String(e.message||e);item.httpStatus=e.status||null;}
            }
            const remaining=[];const badTags=[];
            for(const r of targets){const bs=await refOrNull(`heads/${r.branch}`);if(bs)remaining.push({branch:r.branch,currentSha:bs,expectedSha:r.sha});if(archiveClasses.has(r.class)){const tag=`archive/branches/2026-08-04/batch7/${r.branch}`;const ts=await refOrNull(`tags/${tag}`);if(ts!==r.sha)badTags.push({tag,currentSha:ts,expectedSha:r.sha});}}
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            report.completedAt=new Date().toISOString();report.remaining=remaining;report.badTags=badTags;report.absentConfirmed=targets.length-remaining.length;report.archiveTagsExact=archiveClasses.size?targets.filter(r=>archiveClasses.has(r.class)).length-badTags.length:0;report.branchCountAfter=branches.length;report.success=remaining.length===0&&badTags.length===0;
            const path='qa/branch-cleanup-batch7-final-report.json';let cur;try{cur=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'ops: finalize guarded branch cleanup batch 7',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),sha:cur?.data?.sha});
            core.summary.addHeading('Batch 7 final verification').addCodeBlock(JSON.stringify({success:report.success,absent:report.absentConfirmed,tags:report.archiveTagsExact,remaining:remaining.length,badTags:badTags.length,branchesAfter:report.branchCountAfter},null,2),'json').write();
