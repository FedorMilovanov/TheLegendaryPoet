name: Remove final temporary branch audit files after batch 10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-audit-final-cleanup-20260804.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const expected=['main','release/approved-essay-covers-2026-08-04','work/local-images-playwright-wtoc'].sort();
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const names=branches.map(b=>b.name).sort();
            if(JSON.stringify(names)!==JSON.stringify(expected))throw new Error(`Unexpected final branch set: ${names.join(', ')}`);
            const paths=[
              '.github/workflows/branch-cleanup-batch8-contained-20260804.yml',
              '.github/workflows/branch-cleanup-batch10-lermontov-staging.yml',
              '.github/workflows/branch-audit-final-cleanup-20260804.yml',
              '.github/workflows/remaining-branch-graph-audit-20260804.yml',
              '.github/workflows/branch-cleanup-safe-batch8-main.yml',
              '.github/workflows/branch-cleanup-safe-batch9-main.yml',
              '.github/workflows/final-branch-audit-self-cleanup-20260804.yml',
              'qa/remaining-branch-graph-audit-2026-08-04.json',
              'qa/remaining-branch-graph-audit-2026-08-04.tsv',
              'qa/branch-cleanup-batch8-report.json',
              'qa/branch-cleanup-batch9-report.json',
              'qa/branch-cleanup-batch10-report.json'
            ];
            const existing=[];
            for(const path of paths){try{await github.rest.repos.getContent({owner,repo,path,ref:context.sha});existing.push(path)}catch(e){if(e.status!==404)throw e}}
            const current=await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const tree=await github.rest.git.createTree({owner,repo,base_tree:current.data.tree.sha,tree:existing.map(path=>({path,mode:'100644',type:'blob',sha:null}))});
            const next=await github.rest.git.createCommit({owner,repo,message:'ops: remove final temporary branch audit files after batch 10',tree:tree.data.sha,parents:[context.sha]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/main',sha:next.data.sha,force:false});
            core.summary.addHeading('Final branch audit cleanup').addCodeBlock(JSON.stringify({commit:next.data.sha,branches:names,removedFiles:existing},null,2),'json').write();
