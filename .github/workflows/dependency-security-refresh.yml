name: Dependency security refresh

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/dependency-security-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-security-refresh
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: editorial/longform-marathon-2026-08
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh patched Vite 7 toolchain
        run: npm install --package-lock-only --save-dev 'vite@^7.3.2' '@vitejs/plugin-react@^5.1.4'

      - name: Write factual dependency audit review
        shell: bash
        run: |
          npm audit --json > npm-audit-after-refresh.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('npm-audit-after-refresh.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const entries = Object.entries(report.vulnerabilities ?? {}).sort(([a], [b]) => a.localeCompare(b));
          const rows = entries.length
            ? entries.map(([name, item]) => {
                const fix = item.fixAvailable === false
                  ? 'none reported'
                  : item.fixAvailable === true
                    ? 'available'
                    : item.fixAvailable
                      ? `${item.fixAvailable.name ?? name}@${item.fixAvailable.version ?? 'unspecified'}${item.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                      : 'unspecified';
                return `| \`${name}\` | ${item.severity ?? 'unknown'} | ${item.isDirect ? 'direct' : 'transitive'} | \`${item.range ?? ''}\` | ${fix} |`;
              }).join('\n')
            : '| — | — | — | — | no advisories reported |';
          const markdown = `# Dependency security review — 3 August 2026

**Lane:** \`editorial/longform-marathon-2026-08\` / PR #271  
**Node:** 24  
**Generated by:** one-shot GitHub Actions lock refresh; the workflow removes itself after validation.

## Applied safe-range refresh

\`vite\`: \`${pkg.devDependencies?.vite ?? 'missing'}\`  
\`@vitejs/plugin-react\`: \`${pkg.devDependencies?.['@vitejs/plugin-react'] ?? 'missing'}\`

The lock file was regenerated by npm rather than hand-editing package integrity data.

## npm audit result after refresh

\`total=${counts.total ?? 0}; critical=${counts.critical ?? 0}; high=${counts.high ?? 0}; moderate=${counts.moderate ?? 0}; low=${counts.low ?? 0}; info=${counts.info ?? 0}\`

| Package | Severity | Dependency | Affected range | npm fix status |
|---|---|---|---|---|
${rows}

## Interpretation boundary

This file records npm advisory output after the reproducible lock refresh. An advisory count is not by itself proof that the deployed BrowserRouter application exposes the affected feature path. Conversely, a green build is not permission to suppress a real advisory. Remaining items require package-by-package reachability and migration review; no major-version force update is applied silently.

## Validation boundary

The one-shot job verifies \`npm ci\`. Full content, type, build, SEO and cross-browser gates must pass again on the subsequent connector-authored final head.
`;
          fs.writeFileSync('docs/research/DEPENDENCY_SECURITY_REVIEW_2026-08-03.md', markdown);
          NODE

      - name: Verify reproducible install
        run: npm ci

      - name: Commit generated lock, review, and workflow removal
        shell: bash
        run: |
          rm -f npm-audit-after-refresh.json
          git rm .github/workflows/dependency-security-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json docs/research/DEPENDENCY_SECURITY_REVIEW_2026-08-03.md
          git commit -m 'chore: refresh patched Vite toolchain and record audit'
          git push origin HEAD:editorial/longform-marathon-2026-08
