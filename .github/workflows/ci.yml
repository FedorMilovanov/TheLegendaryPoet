name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect committed brand binaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const files = [
            'public/brand-emblem-master.png',
            'public/favicon-16.png',
            'public/favicon-32.png',
            'public/apple-touch-icon.png',
            'public/icon-192.png',
            'public/icon-512.png',
            'public/icon-maskable-512.png',
            'public/mstile-150x150.png',
            'public/og-image.jpg',
          ];
          const rows = files.map((file) => {
            const bytes = fs.readFileSync(file);
            const png = bytes.subarray(0, 8).toString('hex') === '89504e470d0a1a0a';
            const jpeg = bytes.subarray(0, 3).toString('hex') === 'ffd8ff' && bytes.subarray(-2).toString('hex') === 'ffd9';
            return {
              file,
              bytes: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              format: png ? 'png' : jpeg ? 'jpeg' : 'unknown',
              width: png ? bytes.readUInt32BE(16) : null,
              height: png ? bytes.readUInt32BE(20) : null,
            };
          });
          fs.writeFileSync('brand-asset-diagnostics.json', `${JSON.stringify(rows, null, 2)}\n`);
          console.log(JSON.stringify(rows, null, 2));
          NODE
      - name: Upload committed brand binary diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: brand-asset-diagnostics
          path: brand-asset-diagnostics.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Validate content, stores, and literary style
        run: npm run check:content
      - name: Validate persistent app shell invariants
        run: npm run validate:app-shell
      - name: Validate overlays, images, and pointer interactions
        id: interaction_runtime
        run: |
          set +e
          npm run validate:interaction-runtime > interaction-runtime.log 2>&1
          status=$?
          cat interaction-runtime.log
          exit $status
      - name: Upload interaction runtime diagnostics
        if: ${{ failure() && steps.interaction_runtime.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: interaction-runtime-diagnostics
          path: interaction-runtime.log
          if-no-files-found: error
          retention-days: 3
      - name: Typecheck
        id: typecheck
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status
      - name: Upload typecheck diagnostics
        if: ${{ failure() && steps.typecheck.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3
      - name: Generate sitemap
        run: npm run sitemap
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
      - name: Validate route splitting and production asset budgets
        id: build_audit
        run: |
          set +e
          npm run validate:build-output > build-output-audit.log 2>&1
          status=$?
          cat build-output-audit.log
          exit $status
      - name: Upload build audit diagnostics
        if: ${{ failure() && steps.build_audit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output-audit
          path: build-output-audit.log
          if-no-files-found: error
          retention-days: 3
      - name: Prerender social pages
        run: npm run prerender
      - name: Verify generated output is stable
        run: git diff --exit-code -- public/sitemap.xml
