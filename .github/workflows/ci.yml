name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Validate content, stores, and literary style
        run: npm run check:content
      - name: Validate persistent app shell invariants
        run: npm run validate:app-shell
      - name: Validate overlays, images, and pointer interactions
        id: interaction_runtime
        run: |
          set +e
          npm run validate:interaction-runtime > interaction-runtime.log 2>&1
          status=$?
          cat interaction-runtime.log
          exit $status
      - name: Upload interaction runtime diagnostics
        if: ${{ failure() && steps.interaction_runtime.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: interaction-runtime-diagnostics
          path: interaction-runtime.log
          if-no-files-found: error
          retention-days: 3
      - name: Typecheck
        id: typecheck
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status
      - name: Upload typecheck diagnostics
        if: ${{ failure() && steps.typecheck.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3
      - name: Generate sitemap
        run: npm run sitemap
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
      - name: Validate route splitting and production asset budgets
        id: build_audit
        run: |
          set +e
          npm run validate:build-output > build-output-audit.log 2>&1
          status=$?
          cat build-output-audit.log
          exit $status
      - name: Upload build audit diagnostics
        if: ${{ failure() && steps.build_audit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output-audit
          path: build-output-audit.log
          if-no-files-found: error
          retention-days: 3
      - name: Prerender social pages
        run: npm run prerender
      - name: Verify generated output is stable
        run: git diff --exit-code -- public/sitemap.xml

  materialize-premium-poet-windows:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/premium-poet-windows-v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect whether materialization is needed
        id: detect
        shell: bash
        run: |
          if test -f src/components/home/HeroPoetWindow.tsx; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Premium poet windows are already materialized; guarded writer is idle.'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Materialize exact five-file transaction
        id: materialize
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set +e
          python - <<'PY' > materialize-premium-poet-windows.log 2>&1
          from pathlib import Path

          workflow = Path('.github/workflows/_temp-premium-poet-windows-v2.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('embedded materializer start marker missing')
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(body, '<premium-poet-materializer>', 'exec'))
          PY
          status=$?
          if [ "$status" -eq 0 ]; then
            git diff --check >> materialize-premium-poet-windows.log 2>&1
            status=$?
          fi
          cat materialize-premium-poet-windows.log
          exit "$status"

      - name: Upload materializer diagnostics
        if: ${{ always() && steps.detect.outputs.needed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: premium-poet-materializer-diagnostics
          path: materialize-premium-poet-windows.log
          if-no-files-found: error
          retention-days: 3

      - name: Install project dependencies
        if: steps.detect.outputs.needed == 'true'
        run: npm ci

      - name: Validate brand PNG and hover contracts
        if: steps.detect.outputs.needed == 'true'
        run: npm run validate:brand

      - name: Validate interaction runtime
        if: steps.detect.outputs.needed == 'true'
        run: npm run validate:interaction-runtime

      - name: Typecheck materialized feature
        if: steps.detect.outputs.needed == 'true'
        run: npm run typecheck

      - name: Build materialized feature
        if: steps.detect.outputs.needed == 'true'
        run: npm run build

      - name: Commit exact permanent scope
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          files=(
            src/components/home/HeroPoetWindow.tsx
            src/pages/HomePage.tsx
            qa/focused-interactions.spec.mjs
            qa/brand-emblem.spec.mjs
            scripts/validate-brand-assets.ts
          )
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${files[@]}"
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'feat(home): add premium interactive poet windows'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
