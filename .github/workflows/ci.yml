name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up exact Node dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Validate workflow consolidation and performance contract
        run: npm run validate:workflow-consolidation
      - name: Validate conditional exact-head merge certification contract
        run: npm run validate:merge-certification
      - name: Validate content, stores, and literary style
        run: npm run check:content
      - name: Validate published audio release fail-closed behavior
        run: node scripts/validate-audio-release-gate.mjs
      - name: Validate persistent app shell invariants
        run: npm run validate:app-shell
      - name: Validate canonical reader text contract
        run: node scripts/validate-reader-text.mjs
      - name: Validate Hall v3 foundation invariants
        run: npm run validate:hall-foundation
      - name: Validate Hall v3 Reference Bible invariants
        run: npm run validate:hall-reference-bible
      - name: Validate Hall v3 frozen shootout provenance
        run: npm run validate:hall-topology-provenance
      - name: Validate Hall v3 post-material authority
        run: npm run validate:hall-post-material-authority
      - name: Validate Hall v3 Pushkin rights and source-slice authority
        run: npm run validate:hall-pushkin-rights
      - name: Validate Hall v3 canonical Pushkin rights record schema
        run: npm run validate:hall-pushkin-rights-policy-schema
      - name: Validate Hall v3 Pushkin acquisition authority
        run: npm run validate:hall-pushkin-acquisition
      - name: Validate Hall v3 material transport invariants
        run: npm run validate:hall-material-transport
      - name: Validate overlays, images, and pointer interactions
        id: interaction_runtime
        run: |
          set +e
          npm run validate:interaction-runtime > interaction-runtime.log 2>&1
          status=$?
          cat interaction-runtime.log
          exit $status
      - name: Upload interaction runtime diagnostics
        if: ${{ failure() && steps.interaction_runtime.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: interaction-runtime-diagnostics
          path: interaction-runtime.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate universal hover and compositor contract
        id: hover_stability
        run: |
          set +e
          npm run validate:hover-stability > hover-stability.log 2>&1
          status=$?
          cat hover-stability.log
          exit $status
      - name: Upload hover stability diagnostics
        if: ${{ failure() && steps.hover_stability.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: hover-stability-diagnostics
          path: hover-stability.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate site route audit architecture
        run: npm run validate:route-audit
      - name: Typecheck
        id: typecheck
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status
      - name: Upload typecheck diagnostics
        if: ${{ failure() && steps.typecheck.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3
      - name: Dry-run production Cloudflare community Worker bundle
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/community-worker-dry-run.env"
          bundle_dir="$RUNNER_TEMP/community-worker-bundle"
          rm -rf "$bundle_dir"
          cat > "$secret_file" <<'EOF'
          COMMUNITY_SESSION_SECRET=ci-dry-run-session-secret-000000000000000000000001
          COMMUNITY_NETWORK_SECRET=ci-dry-run-network-secret-000000000000000000000002
          TURNSTILE_SECRET=ci-dry-run-turnstile-secret-not-production
          EOF
          (
            cd workers/community-api
            npx --yes wrangler@4.120.0 deploy --dry-run --outdir "$bundle_dir" --secrets-file "$secret_file"
          )
          test -n "$(find "$bundle_dir" -type f -name '*.js' -print -quit)"
          rm -f "$secret_file"
          rm -rf "$bundle_dir"
      - name: Generate sitemap and Atom feed
        run: npm run seo:generate
      - name: Snapshot deterministic discovery files
        run: |
          cp public/sitemap.xml /tmp/sitemap.xml
          cp public/feed.xml /tmp/feed.xml
      - name: Install deterministic brand build tools
        uses: ./.github/actions/install-build-tools
      - name: Validate approved brand assets
        id: brand_validation
        run: |
          set +e
          npm run validate:brand > brand-validation.log 2>&1
          status=$?
          cat brand-validation.log
          exit $status
      - name: Upload brand validation diagnostics
        if: ${{ failure() && steps.brand_validation.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: brand-validation-diagnostics
          path: brand-validation.log
          if-no-files-found: error
          retention-days: 3
      - name: Build
        id: production_build
        run: |
          set +e
          npm run build > production-build.log 2>&1
          status=$?
          cat production-build.log
          exit $status
        env:
          VITE_BASE: /
      - name: Upload production build diagnostics
        if: ${{ failure() && steps.production_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics
          path: production-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate named route splitting and production asset budgets
        id: build_audit
        run: |
          set +e
          npm run validate:build-output > build-output-audit.log 2>&1
          status=$?
          cat build-output-audit.log
          exit $status
      - name: Upload exact build budget evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output-budget-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-output-audit.log
            dist/build-budget-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prerender canonical pages
        run: npm run prerender
      - name: Verify discovery output and production SEO contract
        run: |
          npm run seo:generate
          cmp /tmp/sitemap.xml public/sitemap.xml
          cmp /tmp/feed.xml public/feed.xml
          npm run validate:seo-output
