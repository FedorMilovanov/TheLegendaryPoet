name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-security-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate patched lock and factual audit review
        shell: bash
        run: |
          npm install --package-lock-only --save-dev 'vite@^7.3.2' '@vitejs/plugin-react@^5.1.4'
          npm audit --json > npm-audit-after-refresh.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('npm-audit-after-refresh.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const entries = Object.entries(report.vulnerabilities ?? {}).sort(([a], [b]) => a.localeCompare(b));
          const rows = entries.length
            ? entries.map(([name, item]) => {
                const fix = item.fixAvailable === false
                  ? 'none reported'
                  : item.fixAvailable === true
                    ? 'available'
                    : item.fixAvailable
                      ? `${item.fixAvailable.name ?? name}@${item.fixAvailable.version ?? 'unspecified'}${item.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                      : 'unspecified';
                return `| \`${name}\` | ${item.severity ?? 'unknown'} | ${item.isDirect ? 'direct' : 'transitive'} | \`${item.range ?? ''}\` | ${fix} |`;
              }).join('\n')
            : '| — | — | — | — | no advisories reported |';
          const markdown = `# Dependency security review — 3 August 2026

**Lane:** \`editorial/longform-marathon-2026-08\` / PR #271  
**Node:** 24  
**Generated by:** temporary visible CI job; generated files are applied by the GitHub connector and the temporary job is then removed.

## Applied safe-range refresh

\`vite\`: \`${pkg.devDependencies?.vite ?? 'missing'}\`  
\`@vitejs/plugin-react\`: \`${pkg.devDependencies?.['@vitejs/plugin-react'] ?? 'missing'}\`

The lock file was regenerated by npm rather than hand-editing package integrity data.

## npm audit result after refresh

\`total=${counts.total ?? 0}; critical=${counts.critical ?? 0}; high=${counts.high ?? 0}; moderate=${counts.moderate ?? 0}; low=${counts.low ?? 0}; info=${counts.info ?? 0}\`

| Package | Severity | Dependency | Affected range | npm fix status |
|---|---|---|---|---|
${rows}

## Interpretation boundary

This file records npm advisory output after the reproducible lock refresh. An advisory count is not by itself proof that the deployed BrowserRouter application exposes the affected feature path. Conversely, a green build is not permission to suppress a real advisory. Remaining items require package-by-package reachability and migration review; no major-version force update is applied silently.

## Validation boundary

The generator verifies \`npm ci\`. Full content, type, build, SEO and cross-browser gates must pass again after the generated files and cleanup are committed to the final head.
`;
          fs.writeFileSync('DEPENDENCY_SECURITY_REVIEW_2026-08-03.md', markdown);
          NODE
          npm ci

      - name: Upload generated dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-refresh-${{ github.event.pull_request.head.sha }}
          path: |
            package.json
            package-lock.json
            DEPENDENCY_SECURITY_REVIEW_2026-08-03.md
            npm-audit-after-refresh.json
          if-no-files-found: error
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Validate content, stores, and literary style
        run: npm run check:content
      - name: Validate persistent app shell invariants
        run: npm run validate:app-shell
      - name: Validate overlays, images, and pointer interactions
        id: interaction_runtime
        run: |
          set +e
          npm run validate:interaction-runtime > interaction-runtime.log 2>&1
          status=$?
          cat interaction-runtime.log
          exit $status
      - name: Upload interaction runtime diagnostics
        if: ${{ failure() && steps.interaction_runtime.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: interaction-runtime-diagnostics
          path: interaction-runtime.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate universal hover and compositor contract
        id: hover_stability
        run: |
          set +e
          npm run validate:hover-stability > hover-stability.log 2>&1
          status=$?
          cat hover-stability.log
          exit $status
      - name: Upload hover stability diagnostics
        if: ${{ failure() && steps.hover_stability.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: hover-stability-diagnostics
          path: hover-stability.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate site route audit architecture
        run: npm run validate:route-audit
      - name: Typecheck
        id: typecheck
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status
      - name: Upload typecheck diagnostics
        if: ${{ failure() && steps.typecheck.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3
      - name: Generate sitemap and Atom feed
        run: npm run seo:generate
      - name: Snapshot deterministic discovery files
        run: |
          cp public/sitemap.xml /tmp/sitemap.xml
          cp public/feed.xml /tmp/feed.xml
      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Validate approved brand assets
        id: brand_validation
        run: |
          set +e
          npm run validate:brand > brand-validation.log 2>&1
          status=$?
          cat brand-validation.log
          exit $status
      - name: Upload brand validation diagnostics
        if: ${{ failure() && steps.brand_validation.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: brand-validation-diagnostics
          path: brand-validation.log
          if-no-files-found: error
          retention-days: 3
      - name: Build
        id: production_build
        run: |
          set +e
          npm run build > production-build.log 2>&1
          status=$?
          cat production-build.log
          exit $status
        env:
          VITE_BASE: /
      - name: Upload production build diagnostics
        if: ${{ failure() && steps.production_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics
          path: production-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate route splitting and production asset budgets
        id: build_audit
        run: |
          set +e
          npm run validate:build-output > build-output-audit.log 2>&1
          status=$?
          cat build-output-audit.log
          exit $status
      - name: Upload build audit diagnostics
        if: ${{ failure() && steps.build_audit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output-audit
          path: build-output-audit.log
          if-no-files-found: error
          retention-days: 3
      - name: Prerender canonical pages
        run: npm run prerender
      - name: Verify discovery output and production SEO contract
        run: |
          npm run seo:generate
          cmp /tmp/sitemap.xml public/sitemap.xml
          cmp /tmp/feed.xml public/feed.xml
          npm run validate:seo-output
