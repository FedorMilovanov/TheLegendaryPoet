name: CI

on:
  pull_request:
    branches: [main, work/local-images-playwright-wtoc]
  push:
    branches: [main, work/local-images-playwright-wtoc]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Validate library content
        run: npm run validate:library
      - name: Validate essay structure and source policy
        run: npm run validate:essays
      - name: Report essay source coverage
        run: npm run report:sources
      - name: Validate inline citations
        id: citations
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run validate:citations 2>&1 | tee citation-validation.log
      - name: Upload citation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-validation
          path: citation-validation.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate SEO topic clusters
        run: npm run validate:clusters
      - name: Validate Mayakovsky correspondence dataset
        run: npm run validate:mayakovsky-correspondence
      - name: Validate Yesenin archive records
        run: npm run validate:yesenin-archive
      - name: Validate unpublished Yesenin Part I research gate
        run: npm run validate:yesenin-part-one
      - name: Validate Yesenin Part I page-witness boundaries
        run: npm run validate:yesenin-part-one-witnesses
      - name: Validate durable Yesenin FEB acquisition evidence
        run: npm run validate:yesenin-part-one-feb-acquisition
      - name: Validate acquired Yesenin physical editions
        run: npm run validate:yesenin-part-one-physical-editions
      - name: Validate effective Yesenin physical witness state
        run: npm run validate:yesenin-part-one-effective-witnesses
      - name: Validate Mariengof RSL access state
        run: npm run validate:yesenin-part-one-mariengof-access
      - name: Validate Izvestia acquisition and bounded Pravda state
        run: npm run validate:yesenin-newspaper-pass14
      - name: Validate primary-source marathon and visual placement pass 15
        run: npm run validate:yesenin-primary-marathon-pass15
      - name: Validate institutional visual byte evidence pass 16
        run: npm run validate:yesenin-visual-byte-evidence-pass16
      - name: Validate Mirok 1914 PDF evidence pass 17
        run: npm run validate:yesenin-mirok-pdf-evidence-pass17
      - name: Validate archive access and attribution pass 18
        run: npm run validate:yesenin-archive-access-pass18
      - name: Validate NYPL program item and capture evidence pass 19
        run: npm run validate:yesenin-nypl-program-pass19
      - name: Validate Materials to Biography bibliography pass 20
        run: npm run validate:yesenin-materials-bibliography-pass20
      - name: Validate verified Yesenin Part I authoring corpus
        run: npm run validate:yesenin-part-one-authoring
      - name: Validate typed Yesenin Part I citation topology
        run: npm run validate:yesenin-part-one-topology
      - name: Validate unpublished Yesenin Part I article package
        run: npm run validate:yesenin-part-one-unpublished
      - name: Validate complete Yesenin Part I sentence edit
        run: npm run validate:yesenin-part-one-editorial
      - name: Validate public historical claim boundaries
        run: npm run validate:public-claims
      - name: Validate responsive AVIF and WebP media
        run: npm run validate:media
      - name: Validate physical audio assets
        run: npm run validate:audio
      - name: Validate music catalog
        run: npm run validate:music
      - name: Validate music runtime invariants
        run: npm run validate:music-runtime
      - name: Validate audio session migrations
        run: npm run validate:audio-session
      - name: Validate personal archive migrations
        run: npm run validate:archive-store
      - name: Validate durable community storage and offline outbox
        run: npm run validate:community-store
      - name: Validate target-scoped community subscriptions
        run: npm run validate:community-target-store
      - name: Validate canonical brand assets
        run: npm run validate:brand
      - name: Validate persistent app shell invariants
        run: npm run validate:app-shell
      - name: Validate overlays, images, and pointer interactions
        id: interaction_runtime
        shell: bash
        run: |
          set +e
          npm run validate:interaction-runtime > interaction-runtime.log 2>&1
          status=$?
          cat interaction-runtime.log
          exit $status
      - name: Upload interaction runtime diagnostics
        if: ${{ failure() && steps.interaction_runtime.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: interaction-runtime-diagnostics
          path: interaction-runtime.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate literary editorial rules
        run: npm run validate:style
      - name: TypeScript typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce TypeScript result
        run: test "${{ steps.typecheck.outcome }}" = "success"
      - name: Run Playwright article-engine QA
        id: e2e
        continue-on-error: true
        run: npm run test:e2e
      - name: Upload concise Playwright result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-result
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Generate sitemap
        run: npm run sitemap
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
      - name: Validate route code splitting
        run: npm run validate:route-chunks
      - name: Validate production route and asset budgets
        run: npm run validate:build-output
      - name: Prerender social pages
        run: npm run prerender
      - name: Validate prerendered SEO and JSON-LD
        run: npm run validate:prerender-seo
      - name: Verify generated output is stable
        run: git diff --exit-code -- public/sitemap.xml
      - name: Enforce citation result
        if: always()
        run: test "${{ steps.citations.outcome }}" = "success"
      - name: Enforce Playwright result
        if: always()
        run: test "${{ steps.e2e.outcome }}" = "success"
