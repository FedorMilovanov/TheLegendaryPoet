name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # BEGIN MAYAKOVSKY VISUAL WAVE MATERIALIZER
  materialize_mayakovsky_wave:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'editorial/longform-marathon-2026-08' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the canonical PR branch
        uses: actions/checkout@v4
        with:
          ref: editorial/longform-marathon-2026-08
          fetch-depth: 0

      - name: Materialize the SHA-verified image package
        shell: bash
        run: |
          set -euo pipefail
          test -f tmp/maya-wave/READY || exit 0
          cat tmp/maya-wave/package.b64.part* > /tmp/mayakovsky-wave-assets.zip.b64
          base64 --decode /tmp/mayakovsky-wave-assets.zip.b64 > /tmp/mayakovsky-wave-assets.zip
          echo "148290b498bf6d5e05ed15aa5fdab5781a9f5853edddc936b6031d196cc53326  /tmp/mayakovsky-wave-assets.zip" | sha256sum --check --strict
          rm -rf /tmp/mayakovsky-wave
          mkdir -p /tmp/mayakovsky-wave
          unzip -q /tmp/mayakovsky-wave-assets.zip -d /tmp/mayakovsky-wave
          (cd /tmp/mayakovsky-wave && sha256sum --check --strict SHA256SUMS.txt)
          install -d public/images/essays/mayakovsky/wave
          install -m 0644 /tmp/mayakovsky-wave/*.webp public/images/essays/mayakovsky/wave/

          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          start = '  # BEGIN MAYAKOVSKY VISUAL WAVE MATERIALIZER\n'
          end = '  # END MAYAKOVSKY VISUAL WAVE MATERIALIZER\n'
          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          path.write_text(before + after)
          PY

          git rm -r tmp/maya-wave .github/workflows/materialize-mayakovsky-wave.yml
          git add .github/workflows/ci.yml public/images/essays/mayakovsky/wave
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(essays): materialize verified Mayakovsky visual wave"
          git push origin HEAD:editorial/longform-marathon-2026-08
  # END MAYAKOVSKY VISUAL WAVE MATERIALIZER

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Validate content, stores, and literary style
        run: npm run check:content
      - name: Validate persistent app shell invariants
        run: npm run validate:app-shell
      - name: Validate overlays, images, and pointer interactions
        id: interaction_runtime
        run: |
          set +e
          npm run validate:interaction-runtime > interaction-runtime.log 2>&1
          status=$?
          cat interaction-runtime.log
          exit $status
      - name: Upload interaction runtime diagnostics
        if: ${{ failure() && steps.interaction_runtime.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: interaction-runtime-diagnostics
          path: interaction-runtime.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate universal hover and compositor contract
        id: hover_stability
        run: |
          set +e
          npm run validate:hover-stability > hover-stability.log 2>&1
          status=$?
          cat hover-stability.log
          exit $status
      - name: Upload hover stability diagnostics
        if: ${{ failure() && steps.hover_stability.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: hover-stability-diagnostics
          path: hover-stability.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate site route audit architecture
        run: npm run validate:route-audit
      - name: Typecheck
        id: typecheck
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status
      - name: Upload typecheck diagnostics
        if: ${{ failure() && steps.typecheck.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3
      - name: Generate sitemap and Atom feed
        run: npm run seo:generate
      - name: Snapshot deterministic discovery files
        run: |
          cp public/sitemap.xml /tmp/sitemap.xml
          cp public/feed.xml /tmp/feed.xml
      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Validate approved brand assets
        id: brand_validation
        run: |
          set +e
          npm run validate:brand > brand-validation.log 2>&1
          status=$?
          cat brand-validation.log
          exit $status
      - name: Upload brand validation diagnostics
        if: ${{ failure() && steps.brand_validation.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: brand-validation-diagnostics
          path: brand-validation.log
          if-no-files-found: error
          retention-days: 3
      - name: Build
        id: production_build
        run: |
          set +e
          npm run build > production-build.log 2>&1
          status=$?
          cat production-build.log
          exit $status
        env:
          VITE_BASE: /
      - name: Upload production build diagnostics
        if: ${{ failure() && steps.production_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics
          path: production-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate route splitting and production asset budgets
        id: build_audit
        run: |
          set +e
          npm run validate:build-output > build-output-audit.log 2>&1
          status=$?
          cat build-output-audit.log
          exit $status
      - name: Upload build audit diagnostics
        if: ${{ failure() && steps.build_audit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output-audit
          path: build-output-audit.log
          if-no-files-found: error
          retention-days: 3
      - name: Prerender canonical pages
        run: npm run prerender
      - name: Verify discovery output and production SEO contract
        run: |
          npm run seo:generate
          cmp /tmp/sitemap.xml public/sitemap.xml
          cmp /tmp/feed.xml public/feed.xml
          npm run validate:seo-output
