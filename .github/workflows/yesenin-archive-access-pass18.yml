name: Yesenin Archive Access Pass 18

on:
  pull_request:
    branches: [work/local-images-playwright-wtoc]
    paths:
      - 'src/data/essays/yeseninArchiveAccessPassEighteen.ts'
      - 'scripts/validate-yesenin-archive-access-pass18.ts'
      - 'research/yesenin/PART_ONE_ARCHIVE_ACCESS_PASS18_2026-07-25.md'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/yesenin-archive-access-pass18.yml'
  push:
    branches: [work/local-images-playwright-wtoc]
    paths:
      - 'src/data/essays/yeseninArchiveAccessPassEighteen.ts'
      - 'scripts/validate-yesenin-archive-access-pass18.ts'
      - 'research/yesenin/PART_ONE_ARCHIVE_ACCESS_PASS18_2026-07-25.md'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/yesenin-archive-access-pass18.yml'

concurrency:
  group: yesenin-archive-access-pass18-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Validate archive access and attribution pass 18
        run: npm run validate:yesenin-archive-access-pass18
      - name: TypeScript typecheck
        run: npm run typecheck
