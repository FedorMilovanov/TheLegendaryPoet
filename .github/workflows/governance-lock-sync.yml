name: Governance lock synchronization

on:
  push:
    branches:
      - fix/governance-release-contract-20260805
    paths:
      - package.json
      - .github/workflows/governance-lock-sync.yml

permissions:
  contents: write

concurrency:
  group: governance-lock-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governance head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Synchronize package-lock root identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('package.json').read_text(encoding='utf-8'))
          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          root = lock.setdefault('packages', {}).setdefault('', {})

          lock['name'] = manifest['name']
          lock['version'] = manifest['version']
          root['name'] = manifest['name']
          root['version'] = manifest['version']
          root['license'] = manifest['license']
          root['engines'] = manifest['engines']

          lock_path.write_text(
              json.dumps(lock, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Remove one-time synchronization workflow
        shell: bash
        run: rm .github/workflows/governance-lock-sync.yml

      - name: Commit synchronized lock metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/governance-lock-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(governance): synchronize package lock identity"
          git push origin HEAD:${GITHUB_REF_NAME}
