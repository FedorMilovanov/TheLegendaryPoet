name: Project contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up repository Node baseline
        uses: ./.github/actions/setup-node-deps
        with:
          node-version-file: .nvmrc
          install: 'true'
      - name: Validate repository contracts
        run: node scripts/validate-project-contracts.mjs
      - name: Validate workflow consolidation and performance contract
        run: node scripts/validate-workflow-consolidation.mjs
      - name: Validate Hall v3 foundation invariants
        run: npm run validate:hall-foundation
      - name: Validate Hall v3 Reference Bible invariants
        run: npm run validate:hall-reference-bible
      - name: Validate Hall v3 frozen shootout provenance
        run: npm run validate:hall-topology-provenance
      - name: Validate Hall v3 post-material authority
        run: npm run validate:hall-post-material-authority
      - name: Validate Hall v3 Pushkin rights and source-slice authority
        run: npm run validate:hall-pushkin-rights
      - name: Validate Hall v3 canonical Pushkin rights record schema
        run: npm run validate:hall-pushkin-rights-policy-schema
      - name: Validate Hall v3 Pushkin acquisition authority
        run: npm run validate:hall-pushkin-acquisition
      - name: Validate Hall v3 Pushkin offline exhibit source contract
        run: npx tsx scripts/validate-hall-pushkin-offline-exhibit.ts
      - name: Validate Hall v3 Pushkin first-slice budget authority
        run: node scripts/validate-hall-pushkin-offline-budget.mjs
      - name: Validate Hall v3 material transport invariants
        run: npm run validate:hall-material-transport
      - name: Validate premium reader certification wiring
        run: node scripts/validate-premium-reader-certification.mjs
      - name: Validate UTC daily rotation
        run: node scripts/validate-daily-content.mjs
