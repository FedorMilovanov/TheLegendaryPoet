name: Project contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up repository Node baseline
        uses: ./.github/actions/setup-node-deps
        with:
          node-version-file: .nvmrc
          install: 'true'
      - name: Validate repository contracts
        run: node scripts/validate-project-contracts.mjs
      - name: Validate workflow consolidation and performance contract
        run: node scripts/validate-workflow-consolidation.mjs
      - name: Validate Hall v3 foundation invariants
        run: npm run validate:hall-foundation
      - name: Validate Hall v3 Reference Bible invariants
        run: npm run validate:hall-reference-bible
      - name: Validate Hall v3 metric greybox tooling contract
        run: npm run validate:hall-greybox-tooling
      - name: Validate Hall v3 neutral greybox candidate source
        run: npm run validate:hall-greybox-candidates
      - name: Validate premium reader certification wiring
        run: node scripts/validate-premium-reader-certification.mjs
      - name: Validate UTC daily rotation
        run: node scripts/validate-daily-content.mjs

  apply-p75:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 379 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch for bounded patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect already-applied source topology
        run: |
          if grep -q "yes2-pss-do-svidanya-commentary" src/data/essays/yeseninPartTwoPublic.ts; then
            echo "P75_ALREADY_APPLIED=true" >> "$GITHUB_ENV"
          fi

      - name: Apply exact bounded source-topology patch
        if: env.P75_ALREADY_APPLIED != 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/data/essays/yeseninPartTwoPublic.ts';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOne(from, to, label) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly 1 match, found ${count}`);
            source = source.replace(from, to);
          }

          replaceOne(
            "      sourceIds: ['yes2-pss-declarations-vol7k1', 'yes2-byt-i-iskusstvo-1921', 'yes2-contemporary-memoirs-1986'],",
            "      sourceIds: ['yes2-pss-declarations-vol7k1', 'yes2-byt-i-iskusstvo-1921', 'yes2-ivnev-o-sergee-esenine'],",
            'Imagism afterlife binding',
          );
          replaceOne(
            "      sourceIds: ['yes2-letopis-t5-k1', 'yes2-contemporary-memoirs-1986'],",
            "      sourceIds: ['yes2-letopis-t5-k1', 'yes2-nasedkin-posledniy-god'],",
            '20 December clinic binding',
          );
          replaceOne(
            "      sourceIds: ['yes2-lab-letter-1992', 'yes2-pss-poetry-comments'],",
            "      sourceIds: ['yes2-lab-letter-1992', 'yes2-pss-do-svidanya-commentary'],",
            'final poem binding',
          );

          const marker = "    {\n      id: 'yes2-pss-poetry-comments',";
          const markerCount = source.split(marker).length - 1;
          if (markerCount !== 1) throw new Error(`source insertion marker: expected exactly 1 match, found ${markerCount}`);

          const records = `    {
      id: 'yes2-pss-do-svidanya-commentary',
      title: 'ПСС, т. 4: комментарий к «До свиданья, друг мой, до свиданья…»',
      url: 'https://feb-web.ru/feb/esenin/texts/e74/e74-323-.htm?cmd=p',
      kind: 'research',
      institution: 'ФЭБ / ИМЛИ РАН',
      year: 1996,
      note: 'Item-level академический комментарий к последнему стихотворению: первые публикации, автограф, экспертизы и границы гипотез об адресате. Не превращает стихотворение в юридически доказанную предсмертную записку.',
    },
    {
      id: 'yes2-nasedkin-posledniy-god',
      title: 'В. Ф. Наседкин. «Последний год Есенина»',
      url: 'https://feb-web.ru/feb/esenin/critics/ev2/ev2-303-.htm?cmd=p',
      kind: 'research',
      institution: 'ФЭБ / «С. А. Есенин в воспоминаниях современников», т. 2',
      year: 1986,
      note: 'Item-level мемуарное свидетельство о посещении Есенина в клинике 20 декабря 1925 года. Используется для самого визита и содержания воспоминания; не заменяет Летопись как хронологическую authority и не является медицинским диагнозом.',
    },
    {
      id: 'yes2-ivnev-o-sergee-esenine',
      title: 'Рюрик Ивнев. «О Сергее Есенине»',
      url: 'https://feb-web.ru/feb/esenin/critics/ev1/ev1-324-.htm?cmd=p',
      kind: 'research',
      institution: 'ФЭБ / «С. А. Есенин в воспоминаниях современников», т. 1',
      year: 1986,
      note: 'Item-level мемуар Рюрика Ивнева, участника имажинистского круга. Используется для последующей жизни литературной среды после публичного разрыва; датированные заявления о роспуске группы остаются за документами ПСС.',
    },
`;
          source = source.replace(marker, records + marker);
          fs.writeFileSync(path, source, 'utf8');
          NODE

      - name: Verify exact P75 patch shape
        if: env.P75_ALREADY_APPLIED != 'true'
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/data/essays/yeseninPartTwoPublic.ts"
          test "$(git diff --numstat src/data/essays/yeseninPartTwoPublic.ts | awk '{print $1}')" -eq 33
          test "$(git diff --numstat src/data/essays/yeseninPartTwoPublic.ts | awk '{print $2}')" -eq 3

      - name: Commit canonical source-only patch
        if: env.P75_ALREADY_APPLIED != 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/essays/yeseninPartTwoPublic.ts
          git commit -m 'editorial(yesenin): refine Part II item-level source topology'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
