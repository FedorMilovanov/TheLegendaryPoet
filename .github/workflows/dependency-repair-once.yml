name: One-shot dependency remediation

on:
  pull_request:
    paths:
      - .github/workflows/dependency-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: editorial/longform-marathon-2026-08
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact current lock
        run: npm ci

      - name: Apply non-forced audited version remediation
        run: |
          npm install --save-exact react-router-dom@7.11.0
          npm install --save-dev --save-exact vite@7.3.6
          npm audit fix

      - name: Verify generated lock and high-severity boundary
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Run repository checks
        run: |
          npm run check
          npm run build
        env:
          VITE_BASE: /

      - name: Commit generated dependency files and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/dependency-repair-once.yml
          git add package.json package-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): remediate audited router and Vite versions'
          git push origin HEAD:editorial/longform-marathon-2026-08
