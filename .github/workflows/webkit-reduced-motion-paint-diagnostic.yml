name: WebKit Reduced Motion Paint Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webkit-reduced-paint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install isolated WebKit runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.54.1
          npx playwright install --with-deps webkit

      - name: Build production site
        run: |
          npm run sitemap
          npm run build
        env:
          VITE_BASE: /

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > webkit-paint-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat webkit-paint-preview.log
          exit 1

      - name: Capture reduced-motion paint lifecycle
        run: npx playwright test --config=playwright.webkit-paint.config.mjs

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webkit-reduced-motion-paint-evidence
          path: |
            webkit-paint-artifacts
            playwright-report/webkit-paint
            test-results/webkit-paint
            webkit-paint-preview.log
          if-no-files-found: warn
          retention-days: 7
