name: Yesenin NYPL Program Evidence Pass 19

on:
  pull_request:
    branches: [work/local-images-playwright-wtoc]
    paths:
      - 'src/data/essays/yeseninNyplProgramEvidencePassNineteen.ts'
      - 'scripts/validate-yesenin-nypl-program-evidence-pass19.ts'
      - 'research/yesenin/PART_ONE_NYPL_PROGRAM_EVIDENCE_PASS19_2026-07-25.md'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/yesenin-nypl-program-evidence-pass19.yml'
  push:
    branches: [work/local-images-playwright-wtoc]
    paths:
      - 'src/data/essays/yeseninNyplProgramEvidencePassNineteen.ts'
      - 'scripts/validate-yesenin-nypl-program-evidence-pass19.ts'
      - 'research/yesenin/PART_ONE_NYPL_PROGRAM_EVIDENCE_PASS19_2026-07-25.md'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/yesenin-nypl-program-evidence-pass19.yml'

concurrency:
  group: yesenin-nypl-program-pass19-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Validate NYPL program item and capture evidence
        run: npm run validate:yesenin-nypl-program-pass19
      - name: TypeScript typecheck
        run: npm run typecheck
