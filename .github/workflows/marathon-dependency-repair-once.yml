name: Marathon dependency repair once

on:
  pull_request:
    branches:
      - agent/marathon-audit-integration-20260805
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marathon-audit-integration-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick

      - name: Migrate to audited React Router 8 package
        shell: bash
        run: |
          set -euo pipefail

          latest_major() {
            local package="$1"
            local major="$2"
            npm view "${package}@${major}" version --json | node -e '
              const major = Number(process.argv[1]);
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                const values = Array.isArray(value) ? value : [value];
                const versions = values
                  .filter((version) => typeof version === "string" && /^\d+\.\d+\.\d+$/.test(version))
                  .filter((version) => Number(version.split(".")[0]) === major)
                  .sort((left, right) => {
                    const a = left.split(".").map(Number);
                    const b = right.split(".").map(Number);
                    for (let index = 0; index < 3; index += 1) {
                      if (a[index] !== b[index]) return a[index] - b[index];
                    }
                    return 0;
                  });
                const version = versions.at(-1);
                if (!version) process.exit(2);
                console.log(version);
              });
            ' "$major"
          }

          REACT_VERSION="$(latest_major 'react' 19)"
          REACT_DOM_VERSION="$(npm view "react-dom@${REACT_VERSION}" version)"
          TYPES_REACT_VERSION="$(latest_major '@types/react' 19)"
          TYPES_REACT_DOM_VERSION="$(latest_major '@types/react-dom' 19)"
          PLUGIN_REACT_VERSION="$(latest_major '@vitejs/plugin-react' 5)"
          TAILWIND_VITE_VERSION="$(latest_major '@tailwindcss/vite' 4)"
          TAILWIND_VERSION="$(latest_major 'tailwindcss' 4)"
          BABEL_VERSION="$(latest_major '@babel/core' 7)"
          POSTCSS_VERSION="$(latest_major 'postcss' 8)"

          node - "$REACT_VERSION" "$REACT_DOM_VERSION" <<'NODE'
          const [react, reactDom] = process.argv.slice(2);
          const parts = react.split('.').map(Number);
          const compatible = parts[0] > 19 || (parts[0] === 19 && (parts[1] > 2 || (parts[1] === 2 && parts[2] >= 7)));
          if (!compatible) {
            console.error(`React ${react} does not satisfy react-router 8.3.0 peer >=19.2.7`);
            process.exit(1);
          }
          if (reactDom !== react) {
            console.error(`React/ReactDOM versions differ: ${react} vs ${reactDom}`);
            process.exit(1);
          }
          NODE

          python3 <<'PY'
          from pathlib import Path

          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              source = path.read_text(encoding='utf-8')
              updated = source.replace("from 'react-router-dom'", "from 'react-router'")
              updated = updated.replace('from "react-router-dom"', 'from "react-router"')
              if updated != source:
                  path.write_text(updated, encoding='utf-8')

          vite = Path('vite.config.ts')
          source = vite.read_text(encoding='utf-8').replace("'react-router-dom'", "'react-router'")
          vite.write_text(source, encoding='utf-8')

          link = Path('src/components/ui/Link.tsx')
          if link.exists():
              source = link.read_text(encoding='utf-8').replace('react-router-dom directly', 'react-router directly')
              link.write_text(source, encoding='utf-8')
          PY

          echo "Migrating to React ${REACT_VERSION}, React Router 8.3.0 and Vite 7.3.6"
          npm uninstall react-router-dom
          npm install --save-exact \
            "react@${REACT_VERSION}" \
            "react-dom@${REACT_VERSION}" \
            react-router@8.3.0
          npm install --save-dev --save-exact \
            "@types/react@${TYPES_REACT_VERSION}" \
            "@types/react-dom@${TYPES_REACT_DOM_VERSION}" \
            vite@7.3.6 \
            "@vitejs/plugin-react@${PLUGIN_REACT_VERSION}" \
            "@tailwindcss/vite@${TAILWIND_VITE_VERSION}" \
            "tailwindcss@${TAILWIND_VERSION}"

          node - "$BABEL_VERSION" "$POSTCSS_VERSION" <<'NODE'
          const fs = require('fs');
          const [babelVersion, postcssVersion] = process.argv.slice(2);
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides ?? {}),
            '@babel/core': babelVersion,
            postcss: postcssVersion,
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm ci

          if grep -RIn --include='*.ts' --include='*.tsx' "from ['\"]react-router-dom['\"]" src; then
            echo 'Legacy react-router-dom imports remain.' >&2
            exit 1
          fi

      - name: Require clean production and full dependency audits
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev
          npm audit

      - name: Run all repository and production gates
        shell: bash
        run: |
          set -euo pipefail
          npm run seo:generate
          npm run check
          npm run build
          npm run validate:build-output
          npm run prerender
          npm run seo:generate
          npm run validate:seo-output

      - name: Run Chromium routes, articles and hover regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/tlp-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/tlp-preview.log' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/articles >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/articles >/dev/null
          QA_BASE_URL=http://127.0.0.1:4173 npx playwright test \
            qa/deep-routes.spec.mjs \
            qa/site-route-integrity.spec.mjs \
            qa/articles-catalog.spec.mjs \
            qa/hover-stability.spec.mjs \
            qa/focused-interactions.spec.mjs \
            --config=playwright.config.mjs \
            --project=chromium-core \
            --workers=1

      - name: Commit verified dependency repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa-artifacts playwright-report test-results
          rm -f .github/workflows/marathon-dependency-repair-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No dependency repair changes to commit.'
            exit 0
          fi
          git commit -m 'fix(deps): migrate to audited React Router 8 package'
          git push origin HEAD:agent/marathon-audit-integration-20260805
