name: Refresh Playwright lock

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/refresh-playwright-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate deterministic package lock
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact @playwright/test@1.61.1
      - name: Verify manifest and lock agree
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit committed dependency graph
        run: npm audit --audit-level=high
      - name: Commit generated lock to the proposed branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): lock Playwright 1.61.1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
