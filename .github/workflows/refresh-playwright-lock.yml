name: Refresh Playwright lock

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/refresh-playwright-lock.yml'

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate deterministic package lock
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact @playwright/test@1.61.1
      - name: Verify manifest and lock agree
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit committed dependency graph
        run: npm audit --audit-level=high
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lock-${{ github.event.pull_request.head.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
