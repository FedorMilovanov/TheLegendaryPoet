name: Brand visual progress

on:
  push:
    branches: [main]
    paths:
      - qa/brand-reference-evaluation.json
      - qa/reference/approved-brand/**
      - src/components/SpectralBrandMark.tsx
      - src/components/brandMotionFrameInvariant.ts
      - scripts/materialize-brand-art.mjs
      - scripts/validate-brand-assets.ts
      - public/brand-release.txt
      - .github/workflows/brand-progress.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish visible main progress state
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const evaluation = JSON.parse(
              fs.readFileSync('qa/brand-reference-evaluation.json', 'utf8'),
            );

            const accepted = evaluation.reviewerDecision === 'reference-accepted';
            const percent = Math.round(evaluation.overallScore * 100);

            let marker = '⚪';
            let label = 'EARLY DRAFT';
            if (accepted) {
              marker = '🟢';
              label = 'REFERENCE ACCEPTED';
            } else if (percent >= 82) {
              marker = '🟡';
              label = 'AWAITING APPROVAL';
            } else if (percent >= 70) {
              marker = '🟠';
              label = 'ADVANCED CANDIDATE';
            } else if (percent >= 50) {
              marker = '🔵';
              label = 'IN PROGRESS';
            }

            const { owner, repo } = context.repo;
            const head_sha = context.sha;
            const progressTitle = `${marker} ${percent}% — ${label}`;
            const deviations = evaluation.blockingDeviations.length
              ? evaluation.blockingDeviations.map((item) => `- ${item}`).join('\n')
              : '- none';

            await github.rest.checks.create({
              owner,
              repo,
              name: 'Brand visual approval',
              head_sha,
              status: 'completed',
              conclusion: accepted ? 'success' : 'neutral',
              output: {
                title: progressTitle,
                summary: [
                  `**Main revision:** ${evaluation.candidateRevision}`,
                  `**Decision:** ${evaluation.reviewerDecision}`,
                  `**Next action:** ${evaluation.nextRequiredAction}`,
                  '',
                  '### Current visual deviations',
                  deviations,
                  '',
                  accepted
                    ? 'The final visual candidate is accepted.'
                    : 'Technical CI may be green, but visual approval is still pending.',
                ].join('\n'),
              },
            });

            core.notice(`${progressTitle}; exact-main visual check is ${accepted ? 'green' : 'neutral'}.`);