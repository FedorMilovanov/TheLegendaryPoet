name: Brand visual progress

on:
  push:
    branches: [main]
    paths:
      - qa/brand-reference-evaluation.json
      - qa/reference/approved-brand/**
      - src/components/SpectralBrandMark.tsx
      - src/components/brandMotionFrameInvariant.ts
      - scripts/materialize-brand-art.mjs
      - scripts/validate-brand-assets.ts
      - public/brand-release.txt
      - .github/workflows/brand-progress.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Publish visible main progress state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const evaluation = JSON.parse(
              fs.readFileSync('qa/brand-reference-evaluation.json', 'utf8'),
            );

            // The evaluation record states which source family is authoritative and
            // what evidence is still owed; it is not a score sheet. Publishing a
            // percentage from a field that does not exist would be a number nobody
            // can defend, so this check reports the decision, the stage and the
            // outstanding evidence instead. If the record ever loses a field this
            // step needs, say so and fail: the alternative is a check that reports
            // nothing while still looking green.
            const requiredFields = [
              'referenceId',
              'status',
              'reviewerDecision',
              'currentImplementation',
              'requiredEvidence',
              'approvalGate',
            ];
            const absent = requiredFields.filter((field) => evaluation[field] === undefined);
            if (absent.length > 0) {
              core.setFailed(
                `qa/brand-reference-evaluation.json is missing ${absent.join(', ')}. `
                + 'The brand visual approval check cannot be published from an incomplete record.',
              );
              return;
            }

            const accepted = evaluation.reviewerDecision === 'reference-accepted';
            const pending = evaluation.requiredEvidence.length;
            const marker = accepted ? '🟢' : '🟡';
            const label = accepted ? 'REFERENCE ACCEPTED' : 'VISUAL APPROVAL PENDING';

            const { owner, repo } = context.repo;
            const head_sha = context.sha;
            const progressTitle = accepted
              ? `${marker} ${label}`
              : `${marker} ${pending} evidence item${pending === 1 ? '' : 's'} outstanding — ${label}`;
            const evidence = pending
              ? evaluation.requiredEvidence.map((item) => `- ${item}`).join('\n')
              : '- none';

            await github.rest.checks.create({
              owner,
              repo,
              name: 'Brand visual approval',
              head_sha,
              status: 'completed',
              conclusion: accepted ? 'success' : 'neutral',
              output: {
                title: progressTitle,
                summary: [
                  `**Reference:** ${evaluation.referenceId}`,
                  `**Status:** ${evaluation.status}`,
                  `**Decision:** ${evaluation.reviewerDecision}`,
                  `**Renderer:** ${evaluation.currentImplementation.renderer}`,
                  `**Release:** ${evaluation.currentImplementation.release}`,
                  '',
                  '### Evidence still required',
                  evidence,
                  '',
                  evaluation.approvalGate,
                  '',
                  accepted
                    ? 'The final visual candidate is accepted.'
                    : 'Technical CI may be green, but visual approval is still pending.',
                ].join('\n'),
              },
            });

            core.notice(`${progressTitle}; exact-main visual check is ${accepted ? 'green' : 'neutral'}.`);
