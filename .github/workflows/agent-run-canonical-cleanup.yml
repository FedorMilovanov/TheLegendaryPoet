name: Temporary canonical cleanup runner

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-canonical-cleanup
  cancel-in-progress: false

jobs:
  canonicalize:
    if: github.event.pull_request.head.ref == 'agent/canonical-editorial-scroll-cleanup-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/canonical-editorial-scroll-cleanup-20260806
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Extract and run bounded repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-canonical-editorial-cleanup.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Regenerate deterministic package lock"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('repair payload markers not found')
          payload = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload.splitlines()
          ) + '\n'

          strict = """if old_pushkin not in pushkin:
              raise SystemExit('Pushkin spiritualSearch service phrase was not found at the expected boundary')
          pushkin_path.write_text(pushkin.replace(old_pushkin, new_pushkin, 1), encoding='utf-8')
          """
          idempotent = """if old_pushkin in pushkin:
              pushkin_path.write_text(pushkin.replace(old_pushkin, new_pushkin, 1), encoding='utf-8')
          elif new_pushkin not in pushkin:
              raise SystemExit('Pushkin spiritualSearch is neither the old nor the intended revised text')
          """
          if strict in script:
              script = script.replace(strict, idempotent, 1)
          Path('/tmp/canonical_cleanup.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/canonical_cleanup.py

      - name: Regenerate deterministic package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete project contract suite
        run: npm run check

      - name: Build production output
        run: npm run build

      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/agent-canonical-editorial-cleanup.yml \
            .github/NOOP \
            .github/README \
            .github/.keep2 \
            .github/.keep3 \
            .github/.keep4 \
            .github/.keep5
          git add -A
          echo "Changed paths:" && git diff --cached --name-status
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "fix(editorial): restore canonical poet ownership and finish scroll cleanup"
          git push origin HEAD:agent/canonical-editorial-scroll-cleanup-20260806
