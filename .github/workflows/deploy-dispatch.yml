name: Request Pages deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'deploy-live-')
    runs-on: ubuntu-latest
    steps:
      - name: Read exact release metadata from PR head
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'public/brand-release.txt',
              ref: pr.head.sha,
            });
            if (Array.isArray(response.data) || response.data.type !== 'file' || response.data.encoding !== 'base64') {
              core.setFailed('public/brand-release.txt is not a readable file on the exact PR head');
              return;
            }
            const text = Buffer.from(response.data.content, 'base64').toString('utf8').trimEnd();
            const lines = text.split(/\r?\n/);
            const valid = lines.length === 4
              && /^[a-z0-9][a-z0-9._-]+$/i.test(lines[0])
              && /^approved-source=[a-z0-9][a-z0-9._-]+$/i.test(lines[1])
              && /^source-sha256=[a-f0-9]{64}$/.test(lines[2])
              && lines[3] === 'roles=single';
            if (!valid) {
              core.setFailed('brand-release.txt must contain the approved four-line single-source contract');
              return;
            }
            core.setOutput('version', lines[0]);
            core.setOutput('source_sha256', lines[2].slice('source-sha256='.length));

      - name: Mark exact release request pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'pages/deploy',
              description: 'Dispatching trusted exact-head deployment',
            });

      - name: Dispatch trusted main Pages workflow
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA256: ${{ steps.release.outputs.source_sha256 }}
        with:
          script: |
            const sourceSha = context.payload.pull_request.head.sha;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                source_sha: sourceSha,
                status_sha: sourceSha,
                pr_number: String(context.payload.pull_request.number),
                expected_version: process.env.RELEASE_VERSION,
                expected_source_sha256: process.env.SOURCE_SHA256,
              },
            });
