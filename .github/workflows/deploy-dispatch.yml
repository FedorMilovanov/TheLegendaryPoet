name: Request Pages deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'deploy-live-')
    runs-on: ubuntu-latest
    steps:
      - name: Mark release request pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'pages/deploy',
              description: 'Dispatching trusted main deployment',
            });

      - name: Dispatch trusted main Pages workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                status_sha: context.payload.pull_request.head.sha,
              },
            });
