name: One-shot canonical editorial cleanup

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  canonicalize:
    if: >-
      github.event.issue.title == '[agent-run] canonical-editorial-cleanup-20260806'
      && github.event.issue.body == 'nonce: tlp-336-canonical-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_BRANCH: agent/canonical-editorial-scroll-cleanup-20260806
      EXPECTED_HEAD: caec2cb6a8d3690504b9aa0c3c1a2697e5074e31
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify branch identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "Expected $EXPECTED_HEAD but checked out $actual";
            exit 1;
          }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare canonical source repair
        run: python3 scripts/agent_canonical_editorial_cleanup.py

      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete project contract suite
        run: npm run check

      - name: Build production output
        run: npm run build

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-canonical-editorial-cleanup.yml
          git rm .github/workflows/agent-canonical-editorial-cleanup-pr.yml
          git rm scripts/agent_canonical_editorial_cleanup.py
          git rm .agent-ref-trigger
          printf 'remove this file in the external exact-head CI trigger commit\n' > .agent-ci-trigger
          git add -A -- package.json package-lock.json src scripts qa .github/workflows/agent-canonical-editorial-cleanup.yml .github/workflows/agent-canonical-editorial-cleanup-pr.yml scripts/agent_canonical_editorial_cleanup.py .agent-ref-trigger .agent-ci-trigger
          echo "Verified staged paths:"
          git diff --cached --name-status
          git diff --cached --quiet && { echo "No product changes produced"; exit 1; }
          git commit -m "fix(editorial): restore canonical poet ownership and finish scroll cleanup"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Report success
        if: success()
        run: gh issue comment "${{ github.event.issue.number }}" --body "SUCCESS: canonical cleanup committed after npm ci, full npm run check and production build."

      - name: Report failure
        if: failure()
        run: gh issue comment "${{ github.event.issue.number }}" --body "FAILURE: one-shot canonical cleanup did not commit. Inspect the workflow run before retrying; the target branch remains unchanged."
