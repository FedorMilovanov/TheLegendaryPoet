name: One-shot final WebKit hardening

on:
  pull_request:
    paths:
      - .github/workflows/final-webkit-hardening-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-webkit-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: editorial/longform-marathon-2026-08
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Apply event-driven hero readiness contract
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          home_path = Path('src/pages/HomePage.tsx')
          home = home_path.read_text(encoding='utf-8')

          old_header = dedent('''\
          function HeroTitle() {
            const [hoveredWord, setHoveredWord] = useState<string | null>(null);

            const words = [
          ''')
          new_header = dedent('''\
          function HeroTitle() {
            const [hoveredWord, setHoveredWord] = useState<string | null>(null);
            const [revealedWords, setRevealedWords] = useState<ReadonlySet<string>>(() => new Set());

            const markWordRevealed = (key: string) => {
              setRevealedWords((current) => {
                if (current.has(key)) return current;
                const next = new Set(current);
                next.add(key);
                return next;
              });
            };

            const words = [
          ''')
          if home.count(old_header) != 1:
              raise SystemExit(f'expected one HeroTitle header, found {home.count(old_header)}')
          home = home.replace(old_header, new_header)

          span_anchor = "            style={{ animationDelay: w.delay }}\n"
          span_region_start = home.index("      {words.map((w) => {")
          span_anchor_at = home.index(span_anchor, span_region_start)
          if home.find(span_anchor, span_anchor_at + len(span_anchor)) != -1:
              raise SystemExit('hero animation-delay anchor is not unique')
          readiness = dedent('''\
                      data-hero-reveal-state={revealedWords.has(w.key) ? 'ready' : 'animating'}
                      onAnimationEnd={(event) => {
                        if (event.currentTarget === event.target) markWordRevealed(w.key);
                      }}
                      onAnimationCancel={(event) => {
                        if (event.currentTarget === event.target) markWordRevealed(w.key);
                      }}
          ''')
          # Re-indent the dedented JSX attributes to match the surrounding span.
          readiness = ''.join(f'            {line}' if line.strip() else line for line in readiness.splitlines(keepends=True))
          insert_at = span_anchor_at + len(span_anchor)
          home = home[:insert_at] + readiness + home[insert_at:]
          home_path.write_text(home, encoding='utf-8')

          qa_path = Path('qa/home-polish.spec.mjs')
          qa = qa_path.read_text(encoding='utf-8')
          start = qa.index('async function waitForHeroReveal(page) {')
          end = qa.index('\nasync function effectiveOpacity(locator) {', start)
          replacement = dedent('''\
          async function waitForHeroReveal(page) {
            const reveals = page.locator('.hero-blur-reveal');
            await expect(reveals).toHaveCount(3, { timeout: 20_000 });

            // Completion comes from the actual CSS animation event exposed by
            // the interface. This removes long cross-process computed-style
            // polling while still requiring every title word to complete its
            // real entrance choreography before the visual assertion passes.
            for (let index = 0; index < 3; index += 1) {
              const reveal = reveals.nth(index);
              await expect(reveal).toHaveAttribute('data-hero-reveal-state', 'ready', {
                timeout: 6_000,
              });
              await expect(reveal).toHaveCSS('opacity', '1');
            }
          }
          ''')
          qa_path.write_text(qa[:start] + replacement + qa[end:], encoding='utf-8')
          PY

      - name: Install exact dependencies
        run: npm ci

      - name: Run repository checks and production build
        env:
          VITE_BASE: /
        run: |
          npm run check
          npm run build

      - name: Commit hardening and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/final-webkit-hardening-once.yml
          git add src/pages/HomePage.tsx qa/home-polish.spec.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(webkit): use native image and hero readiness signals'
          git push origin HEAD:editorial/longform-marathon-2026-08
