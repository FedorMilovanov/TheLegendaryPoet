name: One-shot final WebKit hardening

on:
  pull_request:
    paths:
      - .github/workflows/final-webkit-hardening-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-webkit-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: editorial/longform-marathon-2026-08
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Apply event-driven hero readiness contract
        run: |
          python - <<'PY'
          from pathlib import Path

          home_path = Path('src/pages/HomePage.tsx')
          home = home_path.read_text(encoding='utf-8')
          old_header = """function HeroTitle() {
            const [hoveredWord, setHoveredWord] = useState<string | null>(null);

            const words = [
          """.replace('            ', '')
          new_header = """function HeroTitle() {
            const [hoveredWord, setHoveredWord] = useState<string | null>(null);
            const [revealedWords, setRevealedWords] = useState<ReadonlySet<string>>(() => new Set());

            const markWordRevealed = (key: string) => {
              setRevealedWords((current) => {
                if (current.has(key)) return current;
                const next = new Set(current);
                next.add(key);
                return next;
              });
            };

            const words = [
          """.replace('            ', '')
          if home.count(old_header) != 1:
              raise SystemExit(f'expected one HeroTitle header, found {home.count(old_header)}')
          home = home.replace(old_header, new_header)

          old_span = """          <span
            key={w.key}
            className={`hero-blur-reveal hero-word-reveal ${w.key === 'legendary' ? 'hero-blur-reveal-strong' : ''}`}
            style={{ animationDelay: w.delay }}
          >"""
          new_span = """          <span
            key={w.key}
            className={`hero-blur-reveal hero-word-reveal ${w.key === 'legendary' ? 'hero-blur-reveal-strong' : ''}`}
            style={{ animationDelay: w.delay }}
            data-hero-reveal-state={revealedWords.has(w.key) ? 'ready' : 'animating'}
            onAnimationEnd={(event) => {
              if (event.currentTarget === event.target) markWordRevealed(w.key);
            }}
            onAnimationCancel={(event) => {
              if (event.currentTarget === event.target) markWordRevealed(w.key);
            }}
          >"""
          if home.count(old_span) != 1:
              raise SystemExit(f'expected one hero word span, found {home.count(old_span)}')
          home_path.write_text(home.replace(old_span, new_span), encoding='utf-8')

          qa_path = Path('qa/home-polish.spec.mjs')
          qa = qa_path.read_text(encoding='utf-8')
          start = qa.index('async function waitForHeroReveal(page) {')
          end = qa.index('\nasync function effectiveOpacity(locator) {', start)
          replacement = """async function waitForHeroReveal(page) {
            const reveals = page.locator('.hero-blur-reveal');
            await expect(reveals).toHaveCount(3, { timeout: 20_000 });

            // The interface exposes completion from the actual CSS animation
            // event. This avoids long cross-process computed-style polling,
            // which can terminate Linux WebKit after the animation is already
            // visually complete, while still requiring every title word to
            // finish its real entrance choreography.
            for (let index = 0; index < 3; index += 1) {
              const reveal = reveals.nth(index);
              await expect(reveal).toHaveAttribute('data-hero-reveal-state', 'ready', {
                timeout: 6_000,
              });
              await expect(reveal).toHaveCSS('opacity', '1');
            }
          }
          """.replace('            ', '')
          qa_path.write_text(qa[:start] + replacement + qa[end:], encoding='utf-8')
          PY

      - name: Install exact dependencies
        run: npm ci

      - name: Run repository checks and production build
        env:
          VITE_BASE: /
        run: |
          npm run check
          npm run build

      - name: Commit hardening and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/final-webkit-hardening-once.yml
          git add src/pages/HomePage.tsx qa/home-polish.spec.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(webkit): use native image and hero readiness signals'
          git push origin HEAD:editorial/longform-marathon-2026-08
