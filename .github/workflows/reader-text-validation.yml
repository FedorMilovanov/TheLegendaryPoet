name: Reader Text Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: reader-text-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up exact Node dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Validate canonical reader text contract
        run: node scripts/validate-reader-text.mjs
