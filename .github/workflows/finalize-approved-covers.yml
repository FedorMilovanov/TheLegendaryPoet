name: Export archived approved-cover payload

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-approved-covers.yml

permissions:
  contents: read

env:
  ARCHIVE_TAG: refs/tags/archive/branches/2026-08-04/batch10/agent/lermontov-road-essay

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Export raw archived payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          mkdir -p export
          for part in \
            payload/approved-covers/part00.b64 \
            payload/approved-covers/part01.b64 \
            payload/approved-covers/part02.b64
          do
            git show "$ARCHIVE_TAG:$part"
          done | tr -d '\r\n\t ' > export/archived-payload.tar.gz.b64
          base64 --decode export/archived-payload.tar.gz.b64 > export/archived-payload.partial.tar.gz
          wc -c export/archived-payload.tar.gz.b64 export/archived-payload.partial.tar.gz | tee export/SIZES.txt
          sha256sum export/archived-payload.tar.gz.b64 export/archived-payload.partial.tar.gz | tee export/SHA256SUMS

      - name: Upload raw archived payload
        uses: actions/upload-artifact@v4
        with:
          name: archived-approved-cover-payload
          path: export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
