name: Guarded remaining branch cleanup batch 7 recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-safe-batch7-recovery.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const absent=e=>[404,409,422].includes(e?.status);
            const src=await github.rest.repos.getContent({owner,repo,path:'qa/remaining-branch-candidate-analysis-2026-08-04.json',ref:'main'});
            const data=JSON.parse(Buffer.from(src.data.content,'base64').toString('utf8'));
            const archiveClasses=new Set(['CLOSED_EXPLICIT_NEVER_MERGE','CLOSED_MENTIONS_SUCCESSOR','RESEARCH_DIAGNOSTIC_OR_SUPERSEDED']);
            const directClasses=new Set(['MERGED_EXACT','OPS_TEMP']);
            const targets=data.rows.filter(r=>archiveClasses.has(r.class)||directClasses.has(r.class)).sort((a,b)=>a.branch.localeCompare(b.branch));
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const openHeads=new Set(open.filter(p=>p.head.repo&&p.head.repo.full_name===`${owner}/${repo}`).map(p=>p.head.ref));
            const report={repository:`${owner}/${repo}`,runSha:context.sha,startedAt:new Date().toISOString(),planned:targets.length,results:[]};
            for(const r of targets){
              const item={branch:r.branch,sha:r.sha,class:r.class,pr:r.exactPr?.number||null,status:'PENDING'}; report.results.push(item);
              try{
                if(openHeads.has(r.branch)){item.status='SKIPPED_OPEN_PR';continue;}
                if(r.class==='MERGED_EXACT'){
                  if(!r.exactPr?.number||!r.exactPr?.mergedAt){item.status='SKIPPED_MERGED_GUARD';continue;}
                  const p=await github.rest.pulls.get({owner,repo,pull_number:r.exactPr.number});
                  if(!p.data.merged_at||p.data.head.sha!==r.sha){item.status='SKIPPED_MERGED_GUARD';continue;}
                }else if(r.class==='OPS_TEMP'){
                  if(!r.branch.startsWith('ops/')){item.status='SKIPPED_OPS_GUARD';continue;}
                }else{
                  if(!r.exactPr?.number){item.status='SKIPPED_PR_GUARD';continue;}
                  const p=await github.rest.pulls.get({owner,repo,pull_number:r.exactPr.number});
                  if(p.data.state!=='closed'||p.data.merged_at||p.data.head.sha!==r.sha){item.status='SKIPPED_PR_GUARD';continue;}
                  const tag=`archive/branches/2026-08-04/batch7/${r.branch}`; item.archiveTag=tag;
                  let tagSha=null;
                  try{const t=await github.rest.git.getRef({owner,repo,ref:`tags/${tag}`});tagSha=t.data.object.sha;}catch(e){if(!absent(e))throw e;}
                  if(tagSha&&tagSha!==r.sha){item.status='SKIPPED_TAG_MISMATCH';continue;}
                  if(!tagSha) await github.rest.git.createRef({owner,repo,ref:`refs/tags/${tag}`,sha:r.sha});
                  const verified=await github.rest.git.getRef({owner,repo,ref:`tags/${tag}`});
                  if(verified.data.object.sha!==r.sha){item.status='SKIPPED_TAG_VERIFY';continue;}
                  item.tagVerified=true;
                }
                let branchSha=null;
                try{const ref=await github.rest.git.getRef({owner,repo,ref:`heads/${r.branch}`});branchSha=ref.data.object.sha;}catch(e){if(!absent(e))throw e;}
                if(!branchSha){item.status='ALREADY_ABSENT_CONFIRMED';continue;}
                if(branchSha!==r.sha){item.status='SKIPPED_SHA_CHANGED';item.currentSha=branchSha;continue;}
                const bm=await github.rest.repos.getBranch({owner,repo,branch:r.branch});
                if(bm.data.protected){item.status='SKIPPED_PROTECTED';continue;}
                try{await github.rest.git.deleteRef({owner,repo,ref:`heads/${r.branch}`});}catch(e){if(!absent(e))throw e;}
                await sleep(80);
                try{await github.rest.git.getRef({owner,repo,ref:`heads/${r.branch}`});item.status='SKIPPED_STILL_EXISTS';continue;}catch(e){if(!absent(e))throw e;}
                item.status='DELETED_CONFIRMED';
              }catch(e){item.status='ERROR';item.error=String(e.message||e);item.httpStatus=e.status||null;}
            }
            report.completedAt=new Date().toISOString();
            report.deletedConfirmed=report.results.filter(x=>x.status==='DELETED_CONFIRMED').length;
            report.alreadyAbsentConfirmed=report.results.filter(x=>x.status==='ALREADY_ABSENT_CONFIRMED').length;
            report.archivedTagsVerified=report.results.filter(x=>x.tagVerified).length;
            report.skipped=report.results.filter(x=>x.status.startsWith('SKIPPED')).length;
            report.errors=report.results.filter(x=>x.status==='ERROR').length;
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100}); report.branchCountAfter=branches.length;
            const path='qa/branch-cleanup-batch7-report.json'; let cur;
            try{cur=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'ops: record guarded branch cleanup batch 7 recovery',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),sha:cur?.data?.sha});
            core.summary.addHeading('Batch 7 recovery').addCodeBlock(JSON.stringify({planned:report.planned,deleted:report.deletedConfirmed,alreadyAbsent:report.alreadyAbsentConfirmed,tags:report.archivedTagsVerified,skipped:report.skipped,errors:report.errors,branchesAfter:report.branchCountAfter},null,2),'json').write();
