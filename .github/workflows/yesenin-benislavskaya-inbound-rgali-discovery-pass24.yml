name: Benislavskaya Inbound RGALI Discovery Pass 24

on:
  pull_request:
    branches:
      - research/yesenin-benislavskaya-provenance-evidence-pass23
    paths:
      - scripts/discover-yesenin-benislavskaya-inbound-rgali-pass24.mjs
      - .github/workflows/yesenin-benislavskaya-inbound-rgali-discovery-pass24.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/discover-yesenin-benislavskaya-inbound-rgali-pass24.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-benislavskaya-inbound-rgali-pass24
          path: artifacts/yesenin-benislavskaya-inbound-rgali-pass24
          if-no-files-found: error
          retention-days: 14
