name: Remove temporary branch audit machinery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-audit-self-cleanup-20260804.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const paths=[
              '.github/workflows/branch-inventory-remaining-20260804.yml',
              '.github/workflows/branch-inventory-fast-20260804.yml',
              '.github/workflows/branch-candidate-analysis-20260804.yml',
              '.github/workflows/branch-candidate-summary-20260804.yml',
              '.github/workflows/branch-cleanup-safe-batch7-main.yml',
              '.github/workflows/branch-cleanup-safe-batch7-recovery.yml',
              '.github/workflows/branch-cleanup-safe-batch7-finalize.yml',
              '.github/workflows/branch-audit-self-cleanup-20260804.yml',
              'qa/remaining-branch-inventory-2026-08-04.json',
              'qa/remaining-branch-pr-map-2026-08-04.json',
              'qa/remaining-branch-candidate-analysis-2026-08-04.json',
              'qa/remaining-branch-candidate-summary-2026-08-04.tsv',
              'qa/branch-cleanup-batch7-report.json',
              'qa/branch-cleanup-batch7-final-report.json'
            ];
            const existing=[];
            for(const path of paths){try{await github.rest.repos.getContent({owner,repo,path,ref:context.sha});existing.push(path);}catch(e){if(e.status!==404)throw e;}}
            const commit=await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const tree=await github.rest.git.createTree({owner,repo,base_tree:commit.data.tree.sha,tree:existing.map(path=>({path,mode:'100644',type:'blob',sha:null}))});
            const next=await github.rest.git.createCommit({owner,repo,message:'ops: remove temporary branch audit machinery',tree:tree.data.sha,parents:[context.sha]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/main',sha:next.data.sha,force:false});
            core.summary.addHeading('Temporary audit files removed').addCodeBlock(JSON.stringify({commit:next.data.sha,removed:existing},null,2),'json').write();
