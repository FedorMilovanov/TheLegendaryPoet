name: Manual Browser QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  brand-release-contract-inventory:
    if: github.event.pull_request.head.ref == 'agent/postmerge-emblem-v3-live-witness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Inventory version, hash, source and generated-asset contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p brand-release-contract
          git grep -n -E 'cloak-20260725-[0-9]+|3022d9f142bd0705a639b373c7fae995d42df00ac865440f270823adb2dc0c8d|420ece7b9787303af128c13ea0ba85b924dc55a5b142de70f1721811b9325469|f9e29065cc7191827750d252ecb8b8002385671faed5a4503dd2738065f661b7' \
            > brand-release-contract/version-hash-references.txt || true
          git ls-files \
            'src/brand-assets/**' \
            'public/*brand*' \
            'public/favicon*' \
            'public/icon*' \
            'public/apple-touch-icon.png' \
            'public/mstile-150x150.png' \
            'public/og-image*' \
            > brand-release-contract/asset-files.txt
          git status --short > brand-release-contract/status.txt
          echo 'Version/hash references:'
          cat brand-release-contract/version-hash-references.txt
          echo 'Tracked brand-related assets:'
          cat brand-release-contract/asset-files.txt

      - name: Upload complete contract inventory
        uses: actions/upload-artifact@v4
        with:
          name: brand-release-contract-inventory
          path: brand-release-contract
          if-no-files-found: error
          retention-days: 7
