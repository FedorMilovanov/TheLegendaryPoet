name: Manual Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manual-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair-approved-brand-ssot:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/approved-brand-ssot-release-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/approved-brand-ssot-release-repair
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore exact owner-approved source and permanent CI gate
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='d61334ecfab61f648833c92666eb1b9661b1f27a'
          git fetch --no-tags origin fix/approved-brand-integrity-complete-20260725 --depth=1
          actual_blob="$(git rev-parse FETCH_HEAD:src/brand-assets/master-320-q92.webp.b64)"
          [[ "${actual_blob}" == "${expected_blob}" ]] || {
            echo "::error::Authoritative source blob changed: ${actual_blob}"
            exit 1
          }

          current_blob="$(git hash-object src/brand-assets/master-320-q92.webp.b64)"
          if [[ "${current_blob}" != "${expected_blob}" ]]; then
            git checkout FETCH_HEAD -- src/brand-assets/master-320-q92.webp.b64
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          marker = '      - name: Validate approved brand assets\n'
          if marker not in text:
              old = '''      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Build
'''
              new = '''      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Validate approved brand assets
        id: brand_validation
        run: |
          set +e
          npm run validate:brand > brand-validation.log 2>&1
          status=$?
          cat brand-validation.log
          exit $status
      - name: Upload brand validation diagnostics
        if: ${{ failure() && steps.brand_validation.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: brand-validation-diagnostics
          path: brand-validation.log
          if-no-files-found: error
          retention-days: 3
      - name: Build
'''
              if text.count(old) != 1:
                  raise SystemExit('CI brand-gate insertion anchor mismatch')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          [[ "$(git hash-object src/brand-assets/master-320-q92.webp.b64)" == "${expected_blob}" ]]
          grep -Fq 'name: Validate approved brand assets' .github/workflows/ci.yml

      - name: Install deterministic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          npm ci

      - name: Prove approved source, validation, typecheck and production build
        env:
          VITE_BASE: /
        run: |
          set -euo pipefail
          npm run validate:brand
          npm run typecheck
          npm run sitemap
          npm run build
          npm run validate:build-output

      - name: Commit only the two proven permanent files
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ci.yml src/brand-assets/master-320-q92.webp.b64
          mapfile -t staged < <(git diff --cached --name-only)
          printf 'Staged scope:\n%s\n' "${staged[*]:-<empty>}"
          expected=(
            '.github/workflows/ci.yml'
            'src/brand-assets/master-320-q92.webp.b64'
          )
          [[ "${#staged[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${staged[$index]}" == "${expected[$index]}" ]]
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(brand): restore approved SSOT and require CI validation'
          git push origin HEAD:fix/approved-brand-ssot-release-repair

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # Keep the browser engines isolated from the app lockfile: this workflow
      # validates the production build without changing application dependencies.
      - name: Install isolated Playwright runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.54.1
          npx playwright install --with-deps chromium webkit

      - name: Build production site
        run: |
          npm run sitemap
          npm run build
        env:
          VITE_BASE: /

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Run Chromium, Android Chrome and iPhone Safari QA
        run: >-
          npx playwright test
          qa/manual-e2e.spec.mjs
          qa/focused-interactions.spec.mjs
          qa/deep-routes.spec.mjs
          qa/floating-chrome.spec.mjs
          qa/mobile-platforms.spec.mjs
          qa/brand-emblem.spec.mjs
          --config=playwright.config.mjs
          --grep-invert "poet rating keyboard flow, durable comment and helpful state"
          --workers=1
          --reporter=line,html

      - name: Upload visual QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-qa-evidence
          path: |
            qa-artifacts
            playwright-report
            test-results
            preview.log
          if-no-files-found: warn
          retention-days: 7
