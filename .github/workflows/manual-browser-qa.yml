name: Manual Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manual-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          printf 'tested_commit=%s\n' "$actual" > manual-browser-tested-head.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Build production site
        id: production_build
        env:
          VITE_BASE: /
        run: |
          set +e
          {
            npm run sitemap
            npm run build
          } > production-build.log 2>&1
          status=$?
          cat production-build.log
          exit $status

      - name: Upload production build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            production-build.log
            manual-browser-tested-head.txt
          if-no-files-found: error
          retention-days: 7

      # Keep browser binaries outside the repository and cache only the exact
      # Playwright revision used by this workflow. Application dependencies and
      # the lockfile remain unchanged.
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.1-chromium-webkit

      - name: Install isolated Playwright package
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.54.1
          npx playwright --version

      - name: Install Playwright system dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          npx playwright install-deps chromium webkit

      - name: Install and verify Playwright browsers
        timeout-minutes: 20
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install chromium webkit; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

          chromium_path="$(node -e "const { chromium } = require('@playwright/test'); process.stdout.write(chromium.executablePath())")"
          webkit_path="$(node -e "const { webkit } = require('@playwright/test'); process.stdout.write(webkit.executablePath())")"
          printf 'chromium=%s\nwebkit=%s\n' "$chromium_path" "$webkit_path"
          test -x "$chromium_path"
          test -x "$webkit_path"

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Run Chromium and Android Chrome QA
        run: >-
          npx playwright test
          qa/manual-e2e.spec.mjs
          qa/focused-interactions.spec.mjs
          qa/deep-routes.spec.mjs
          qa/floating-chrome.spec.mjs
          qa/mobile-platforms.spec.mjs
          qa/yesenin-part-one.spec.mjs
          qa/brand-emblem.spec.mjs
          qa/brand-reference-comparison.spec.mjs
          qa/brand-v19-optical.spec.mjs
          qa/brand-v19-micro.spec.mjs
          qa/hover-stability.spec.mjs
          qa/essay-lightbox-overlay.spec.mjs
          qa/mayakovsky-visual-wave.spec.mjs
          --config=playwright.config.mjs
          --project=chromium-core
          --project=android-pixel7
          --grep-invert "poet rating keyboard flow, durable comment and helpful state"
          --workers=1
          --reporter=line

      - name: Run iPhone Safari QA in fresh browser processes
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        run: node scripts/run-webkit-process-isolated.mjs

      - name: Run dedicated premium homepage and pointer-performance matrix
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        id: home_polish
        run: |
          set -o pipefail
          node scripts/run-home-polish-process-isolated.mjs 2>&1 | tee home-polish.log

      - name: Upload visual QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-qa-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qa-artifacts
            playwright-report
            test-results
            preview.log
            production-build.log
            home-polish.log
            manual-browser-tested-head.txt
          if-no-files-found: warn
          retention-days: 7
