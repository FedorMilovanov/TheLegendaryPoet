name: Manual Browser QA

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  postmerge-v4-live-witness:
    if: github.event.pull_request.head.ref == 'agent/postmerge-brand-v4-live-witness'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 0d1ff31f0e3640a2302e263d157458b4a07b5fa0
      SITE_URL: https://thelegendarypoet.ru
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact push Pages workflow
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run_id=""
          run_url=""
          conclusion=""

          for attempt in $(seq 1 120); do
            row="$(gh api "/repos/${repo}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "Deploy to GitHub Pages") | [.id,.status,(.conclusion // ""),.html_url] | @tsv' \
              | head -1 || true)"
            if [[ -n "${row}" ]]; then
              IFS=$'\t' read -r run_id status conclusion run_url <<<"${row}"
              echo "Exact Pages run ${run_id}: status=${status}, conclusion=${conclusion}"
              if [[ "${status}" == "completed" ]]; then
                [[ "${conclusion}" == "success" ]] || {
                  echo "::error::Exact push Pages run failed: ${run_url}"
                  exit 1
                }
                break
              fi
            else
              echo "Waiting for exact push Pages run (${attempt}/120)"
            fi
            sleep 10
          done

          [[ -n "${run_id}" && "${conclusion}" == "success" ]] || {
            echo "::error::No successful exact push Pages run found for ${TARGET_SHA}"
            exit 1
          }
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"

      - name: Wait for exact github-pages deployment
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          deployment_id=""
          deployment_state=""
          environment_url=""

          for attempt in $(seq 1 120); do
            deployment_id="$(gh api "/repos/${repo}/deployments?sha=${TARGET_SHA}&environment=github-pages&per_page=100" \
              --jq '.[0].id // empty' || true)"
            if [[ -n "${deployment_id}" ]]; then
              row="$(gh api "/repos/${repo}/deployments/${deployment_id}/statuses?per_page=100" \
                --jq '.[0] | [(.state // ""),(.environment_url // ""),(.log_url // "")] | @tsv')"
              IFS=$'\t' read -r deployment_state environment_url log_url <<<"${row}"
              echo "Deployment ${deployment_id}: ${deployment_state}"
              case "${deployment_state}" in
                success) break ;;
                error|failure|inactive)
                  echo "::error::Exact deployment failed: ${log_url}"
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done

          [[ -n "${deployment_id}" && "${deployment_state}" == "success" ]] || {
            echo "::error::No successful github-pages deployment found for ${TARGET_SHA}"
            exit 1
          }
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          echo "environment_url=${environment_url}" >> "$GITHUB_OUTPUT"

      - name: Verify v4 source, release and custom-domain bytes
        id: live
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t expected < public/brand-release.txt
          [[ "${#expected[@]}" -eq 2 ]]
          version="${expected[0]}"
          [[ "${expected[1]}" =~ ^master-sha256=[a-f0-9]{64}$ ]]
          master_sha="${expected[1]#master-sha256=}"
          expected_release="${version}"$'\n'"master-sha256=${master_sha}"

          for attempt in $(seq 1 60); do
            nonce="${TARGET_SHA}-${GITHUB_RUN_ID}-${attempt}"
            release="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "${SITE_URL}/brand-release.txt?verify=${nonce}" || true)"
            html="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "${SITE_URL}/?verify=${nonce}" || true)"
            if [[ "${release}" == "${expected_release}" ]] \
              && grep -Fq "name=\"brand-release\" content=\"${version}\"" <<<"${html}"; then
              curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
                "${SITE_URL}/brand-emblem-master.webp?v=${version}&verify=${nonce}" \
                -o live-brand.webp
              echo "${master_sha}  live-brand.webp" | sha256sum -c -
              svg="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
                "${SITE_URL}/brand-emblem.svg?verify=${nonce}")"
              grep -Fq "brand-emblem-master.webp?v=${version}" <<<"${svg}"
              printf '{\n  "targetSha": "%s",\n  "pagesRunId": "%s",\n  "deploymentId": "%s",\n  "release": "%s",\n  "masterSha256": "%s",\n  "site": "%s"\n}\n' \
                "$TARGET_SHA" "${{ steps.pages.outputs.run_id }}" \
                "${{ steps.deployment.outputs.deployment_id }}" "$version" "$master_sha" "$SITE_URL" \
                > postmerge-v4-live-witness.json
              echo "release=${version}" >> "$GITHUB_OUTPUT"
              echo "master_sha256=${master_sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for ${version} on custom domain (${attempt}/60)"
            sleep 10
          done
          echo "::error::Custom domain did not serve the exact v4 release"
          exit 1

      - name: Upload immutable v4 witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postmerge-brand-v4-live-witness
          path: postmerge-v4-live-witness.json
          if-no-files-found: warn
          retention-days: 7
