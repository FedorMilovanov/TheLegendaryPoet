name: Manual Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manual-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  QA_BASE_URL: http://127.0.0.1:4173
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact browser tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Verify exact browser checkout identity
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TESTED_SHA"
          printf 'tested_commit=%s\n' "$actual" > manual-browser-tested-head.txt
      - name: Set up exact Node dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Validate locked browser runtime
        run: npm run validate:browser-runtime
      - name: Install deterministic brand build tools
        uses: ./.github/actions/install-build-tools
      - name: Build production site
        id: production_build
        env:
          VITE_BASE: /
        run: |
          set +e
          { npm run sitemap; npm run build; } > production-build.log 2>&1
          status=$?
          cat production-build.log
          exit $status
      - name: Upload production build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics-${{ env.TESTED_SHA }}
          path: |
            production-build.log
            manual-browser-tested-head.txt
            dist/build-budget-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Install locked Playwright browsers
        uses: ./.github/actions/install-playwright
        with:
          browsers: chromium webkit
      - name: Start production preview
        uses: ./.github/actions/start-preview
        with:
          log-file: preview.log
      - name: Run Chromium and Android Chrome QA
        run: >-
          npx playwright test
          qa/manual-e2e.spec.mjs
          qa/focused-interactions.spec.mjs
          qa/deep-routes.spec.mjs
          qa/floating-chrome.spec.mjs
          qa/mobile-platforms.spec.mjs
          qa/community-request-topology.spec.mjs
          qa/reader-journeys.spec.mjs
          qa/premium-reader-certification.spec.mjs
          qa/yesenin-part-one.spec.mjs
          qa/brand-emblem.spec.mjs
          qa/brand-reference-comparison.spec.mjs
          qa/hover-stability.spec.mjs
          qa/essay-lightbox-overlay.spec.mjs
          --config=playwright.config.mjs
          --project=chromium-core
          --project=android-pixel7
          --grep-invert "poet rating keyboard flow, durable comment and helpful state"
          --workers=1
          --reporter=line
      - name: Run base iPhone Safari QA in fresh browser processes
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        run: node scripts/run-webkit-process-isolated.mjs
      - name: Upload core browser QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-core-evidence-${{ env.TESTED_SHA }}
          path: |
            qa-artifacts
            playwright-report
            test-results
            preview.log
            production-build.log
            manual-browser-tested-head.txt
            dist/build-budget-report.json
          if-no-files-found: warn
          retention-days: 7

  webkit-home-reveal-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Safari home tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Verify exact Safari home checkout identity
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Set up exact Node dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Validate locked browser runtime
        run: npm run validate:browser-runtime
      - name: Install deterministic brand build tools
        uses: ./.github/actions/install-build-tools
      - name: Build Safari home production site
        id: webkit_home_build
        env:
          VITE_BASE: /
        run: npm run build
      - name: Install locked Playwright WebKit
        uses: ./.github/actions/install-playwright
        with:
          browsers: webkit
      - name: Start Safari home production preview
        uses: ./.github/actions/start-preview
        with:
          log-file: webkit-home-preview.log
      - name: Run Safari home reveal and route QA on a fresh runner
        if: ${{ always() && steps.webkit_home_build.outcome == 'success' }}
        run: node scripts/run-webkit-home-reveal-process-isolated.mjs
      - name: Upload Safari home browser QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-webkit-home-evidence-${{ env.TESTED_SHA }}
          path: |
            qa-artifacts
            playwright-report
            test-results
            webkit-home-preview.log
            dist/build-budget-report.json
          if-no-files-found: warn
          retention-days: 7

  premium-home-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact premium tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Verify exact premium checkout identity
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Set up exact Node dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Validate locked browser runtime
        run: npm run validate:browser-runtime
      - name: Install deterministic brand build tools
        uses: ./.github/actions/install-build-tools
      - name: Build premium production site
        id: premium_build
        env:
          VITE_BASE: /
        run: npm run build
      - name: Install locked Playwright browsers
        uses: ./.github/actions/install-playwright
        with:
          browsers: chromium webkit
      - name: Start premium production preview
        uses: ./.github/actions/start-preview
        with:
          log-file: premium-preview.log
      - name: Run standard premium homepage and pointer-performance matrix on a fresh runner
        if: ${{ always() && steps.premium_build.outcome == 'success' }}
        run: |
          set -o pipefail
          node scripts/run-home-polish-process-isolated.mjs 2>&1 | tee home-polish.log
      - name: Upload standard premium browser QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-premium-evidence-${{ env.TESTED_SHA }}
          path: |
            qa-artifacts
            playwright-report
            test-results
            premium-preview.log
            home-polish.log
            dist/build-budget-report.json
          if-no-files-found: warn
          retention-days: 7

  premium-iphone-critical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact critical iPhone tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Verify exact critical iPhone checkout identity
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Set up exact Node dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Validate locked browser runtime
        run: npm run validate:browser-runtime
      - name: Install deterministic brand build tools
        uses: ./.github/actions/install-build-tools
      - name: Build critical iPhone production site
        id: premium_iphone_critical_build
        env:
          VITE_BASE: /
        run: npm run build
      - name: Install locked Playwright WebKit
        uses: ./.github/actions/install-playwright
        with:
          browsers: webkit
      - name: Start critical iPhone production preview
        uses: ./.github/actions/start-preview
        with:
          log-file: premium-iphone-critical-preview.log
      - name: Run critical iPhone first-viewport and reduced-motion contours on a fresh runner
        if: ${{ always() && steps.premium_iphone_critical_build.outcome == 'success' }}
        run: |
          set -o pipefail
          node scripts/run-home-polish-iphone-critical-process-isolated.mjs 2>&1 | tee home-iphone-critical.log
      - name: Upload critical iPhone browser QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-premium-iphone-critical-evidence-${{ env.TESTED_SHA }}
          path: |
            qa-artifacts
            playwright-report
            test-results
            premium-iphone-critical-preview.log
            home-iphone-critical.log
            dist/build-budget-report.json
          if-no-files-found: warn
          retention-days: 7
