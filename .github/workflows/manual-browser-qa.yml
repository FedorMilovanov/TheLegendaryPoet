name: Manual Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manual-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Build production site
        id: production_build
        env:
          VITE_BASE: /
        run: |
          set +e
          {
            npm run sitemap
            npm run build
          } > production-build.log 2>&1
          status=$?
          cat production-build.log
          exit $status

      - name: Upload production build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics
          path: production-build.log
          if-no-files-found: error
          retention-days: 7

      # Keep the browser engines isolated from the app lockfile: this workflow
      # validates the production build without changing application dependencies.
      - name: Install isolated Playwright runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.54.1
          npx playwright install --with-deps chromium webkit

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Run Chromium and Android Chrome QA
        run: >-
          npx playwright test
          qa/manual-e2e.spec.mjs
          qa/focused-interactions.spec.mjs
          qa/deep-routes.spec.mjs
          qa/floating-chrome.spec.mjs
          qa/mobile-platforms.spec.mjs
          qa/yesenin-part-one.spec.mjs
          qa/brand-emblem.spec.mjs
          qa/brand-reference-comparison.spec.mjs
          qa/brand-v19-optical.spec.mjs
          qa/brand-v19-micro.spec.mjs
          qa/hover-stability.spec.mjs
          qa/essay-lightbox-overlay.spec.mjs
          --config=playwright.config.mjs
          --project=chromium-core
          --project=android-pixel7
          --grep-invert "poet rating keyboard flow, durable comment and helpful state"
          --workers=1
          --reporter=line

      - name: Run iPhone Safari QA in fresh browser processes
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        run: node scripts/run-webkit-process-isolated.mjs

      - name: Run dedicated premium homepage and pointer-performance matrix
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        id: home_polish
        run: |
          set -o pipefail
          node scripts/run-home-polish-process-isolated.mjs 2>&1 | tee home-polish.log

      - name: Upload visual QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-qa-evidence
          path: |
            qa-artifacts
            playwright-report
            test-results
            preview.log
            production-build.log
            home-polish.log
          if-no-files-found: warn
          retention-days: 7
