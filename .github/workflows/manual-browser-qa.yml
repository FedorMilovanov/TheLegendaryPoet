name: Manual Browser QA

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  postmerge-live-diagnostics:
    if: github.event.pull_request.head.ref == 'agent/postmerge-emblem-v3-live-witness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: c5f90764450e690b42e8d949b860609f05961a3c
      SITE_URL: https://thelegendarypoet.ru
    steps:
      - uses: actions/checkout@v4

      - name: Capture exact run, deployment and live state
        shell: bash
        run: |
          set -uo pipefail
          repo="$GITHUB_REPOSITORY"
          mkdir -p postmerge-diagnostics

          gh api "/repos/${repo}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100" \
            > postmerge-diagnostics/exact-push-runs.json
          jq '[.workflow_runs[] | select(.head_sha == env.TARGET_SHA)]' \
            postmerge-diagnostics/exact-push-runs.json \
            > postmerge-diagnostics/exact-push-runs-filtered.json

          run_id="$(jq -r '.workflow_runs[] | select(.name == "Deploy to GitHub Pages" and .head_sha == env.TARGET_SHA) | .id' \
            postmerge-diagnostics/exact-push-runs.json | head -1)"
          if [[ -n "${run_id}" && "${run_id}" != "null" ]]; then
            gh api "/repos/${repo}/actions/runs/${run_id}" > postmerge-diagnostics/pages-run.json || true
            gh api "/repos/${repo}/actions/runs/${run_id}/jobs?per_page=100" > postmerge-diagnostics/pages-jobs.json || true
            gh run view "${run_id}" --log > postmerge-diagnostics/pages.log 2>&1 || true
          else
            printf '{"error":"no exact push Pages run","targetSha":"%s"}\n' "$TARGET_SHA" \
              > postmerge-diagnostics/pages-run.json
          fi

          gh api "/repos/${repo}/deployments?sha=${TARGET_SHA}&environment=github-pages&per_page=100" \
            > postmerge-diagnostics/deployments.json || true
          deployment_id="$(jq -r '.[0].id // empty' postmerge-diagnostics/deployments.json 2>/dev/null || true)"
          if [[ -n "${deployment_id}" ]]; then
            gh api "/repos/${repo}/deployments/${deployment_id}/statuses?per_page=100" \
              > postmerge-diagnostics/deployment-statuses.json || true
          else
            printf '[]\n' > postmerge-diagnostics/deployment-statuses.json
          fi

          curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
            "${SITE_URL}/brand-release.txt?diagnostic=${GITHUB_RUN_ID}" \
            > postmerge-diagnostics/live-brand-release.txt 2> postmerge-diagnostics/live-brand-release.stderr || true
          curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
            "${SITE_URL}/?diagnostic=${GITHUB_RUN_ID}" \
            > postmerge-diagnostics/live-index.html 2> postmerge-diagnostics/live-index.stderr || true

          cp public/brand-release.txt postmerge-diagnostics/expected-brand-release.txt
          printf 'target_sha=%s\npages_run_id=%s\ndeployment_id=%s\n' \
            "$TARGET_SHA" "${run_id:-}" "${deployment_id:-}" \
            > postmerge-diagnostics/summary.txt

          echo 'Exact push runs:'
          jq -r '.workflow_runs[] | [.id,.name,.status,(.conclusion // ""),.head_sha,.html_url] | @tsv' \
            postmerge-diagnostics/exact-push-runs.json || true
          echo 'Latest deployment state:'
          jq -r '.[0] | [(.state // ""),(.environment_url // ""),(.log_url // "")] | @tsv' \
            postmerge-diagnostics/deployment-statuses.json 2>/dev/null || true
          echo 'Expected release:'
          cat postmerge-diagnostics/expected-brand-release.txt
          echo 'Live release:'
          cat postmerge-diagnostics/live-brand-release.txt || true

      - name: Upload exact Pages diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: postmerge-emblem-v3-pages-diagnostics
          path: postmerge-diagnostics
          if-no-files-found: error
          retention-days: 7
