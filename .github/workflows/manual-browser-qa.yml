name: Manual Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manual-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brand-recovery-inventory:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/deep-home-polish-20260725'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRAND_SHA: 1cf00ce72adbe6c52abdecb4b7e633bfda9df815
    steps:
      - name: Inventory recent runs, artifacts, events and refs
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          mkdir -p brand-recovery/artifacts

          gh api "/repos/${repo}/commits/${BRAND_SHA}" > brand-recovery/brand-commit.json
          gh api "/repos/${repo}/actions/runs?per_page=100" > brand-recovery/recent-runs.json
          gh api "/repos/${repo}/events?per_page=100" > brand-recovery/recent-events.json
          gh api "/repos/${repo}/git/matching-refs/heads/" > brand-recovery/head-refs.json

          jq -r '.workflow_runs[] | [.id,.name,.head_branch,.head_sha,.event,.status,.conclusion,.created_at] | @tsv' \
            brand-recovery/recent-runs.json > brand-recovery/recent-runs.tsv

          while IFS=$'\t' read -r run_id _; do
            gh api "/repos/${repo}/actions/runs/${run_id}/artifacts?per_page=100" \
              > "brand-recovery/artifacts/${run_id}.json" || true
          done < brand-recovery/recent-runs.tsv

          jq -s '[.[].artifacts[]? | {id,name,size_in_bytes,expired,created_at,archive_download_url,workflow_run}]' \
            brand-recovery/artifacts/*.json > brand-recovery/all-artifacts.json

          jq -r '.[] | [.id,.name,.size_in_bytes,.created_at,(.workflow_run.id // ""),(.workflow_run.head_sha // "")] | @tsv' \
            brand-recovery/all-artifacts.json > brand-recovery/all-artifacts.tsv

          echo 'Recent runs:'
          head -40 brand-recovery/recent-runs.tsv
          echo 'Recent artifacts:'
          head -80 brand-recovery/all-artifacts.tsv

      - name: Upload brand recovery inventory
        uses: actions/upload-artifact@v4
        with:
          name: brand-recovery-inventory
          path: brand-recovery
          if-no-files-found: error
          retention-days: 3

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build production site
        id: production_build
        env:
          VITE_BASE: /
        run: |
          set +e
          {
            npm run sitemap
            npm run build
          } > production-build.log 2>&1
          status=$?
          cat production-build.log
          exit $status

      - name: Upload production build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics
          path: production-build.log
          if-no-files-found: error
          retention-days: 7

      # Install browser engines only after the production build is known-good.
      # This keeps failures fast and does not change the application lockfile.
      - name: Install isolated Playwright runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.54.1
          npx playwright install --with-deps chromium webkit

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Run Chromium, Android Chrome and iPhone Safari QA
        run: >-
          npx playwright test
          qa/manual-e2e.spec.mjs
          qa/focused-interactions.spec.mjs
          qa/deep-routes.spec.mjs
          qa/floating-chrome.spec.mjs
          qa/mobile-platforms.spec.mjs
          qa/brand-emblem.spec.mjs
          --config=playwright.config.mjs
          --grep-invert "poet rating keyboard flow, durable comment and helpful state"
          --workers=1
          --reporter=line,html

      - name: Run dedicated premium homepage matrix
        run: >-
          npx playwright test
          qa/home-polish.spec.mjs
          --config=playwright.home-polish.config.mjs
          --workers=1
          --reporter=line

      - name: Upload visual QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-qa-evidence
          path: |
            qa-artifacts
            playwright-report
            test-results
            preview.log
            production-build.log
          if-no-files-found: warn
          retention-days: 7
