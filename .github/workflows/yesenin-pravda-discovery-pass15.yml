name: Yesenin Pravda Discovery Pass 15

on:
  push:
    branches:
      - research/yesenin-pravda-discovery-pass15-diagnostic
  pull_request:
    branches:
      - work/local-images-playwright-wtoc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover exact central Moscow Pravda issue
        run: python scripts/discover-yesenin-pravda-official-pass15.py
      - name: Upload immutable official discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-pravda-discovery-pass15
          path: artifacts/yesenin-pravda-discovery-pass15
          if-no-files-found: error
          retention-days: 14
