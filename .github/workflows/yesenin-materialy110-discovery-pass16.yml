name: Yesenin Materialy p110 Discovery Pass 16

on:
  push:
    branches:
      - research/yesenin-materialy110-discovery-pass16-diagnostic
  pull_request:
    branches:
      - work/local-images-playwright-wtoc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official FEB publication surfaces
        run: python scripts/discover-yesenin-materialy110-feb-pass16.py
      - name: Upload immutable official discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-materialy110-discovery-pass16
          path: artifacts/yesenin-materialy110-feb-pass16
          if-no-files-found: error
          retention-days: 14
