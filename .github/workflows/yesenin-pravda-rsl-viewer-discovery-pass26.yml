name: Yesenin Pravda RSL Viewer Discovery Pass 26

on:
  pull_request:
    branches: [work/local-images-playwright-wtoc]
    paths:
      - 'scripts/discover-yesenin-pravda-rsl-viewer-pass26.mjs'
      - 'scripts/discover-yesenin-pravda-rsl-viewer-pass26-v2.mjs'
      - '.github/workflows/yesenin-pravda-rsl-viewer-discovery-pass26.yml'
  workflow_dispatch:

concurrency:
  group: yesenin-pravda-rsl-viewer-pass26-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact Cyrillic RSL archive formula
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/discover-yesenin-pravda-rsl-viewer-pass26-v2.mjs')
          text = path.read_text(encoding='utf-8')
          old = r'/Имеется\s+удаленн\w*\s+доступ\s+к\s+электронн\w*\s+архиву\s+газеты/iu'
          new = r'/Имеется\s+удаленный\s+доступ\s+к\s+электронному\s+архиву\s+газеты/iu'
          if old not in text:
              raise SystemExit('expected diagnostic regex not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Discover exact RSL viewer and issue routes for Pravda
        run: node scripts/discover-yesenin-pravda-rsl-viewer-pass26-v2.mjs
      - name: Upload RSL Pravda discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-pravda-rsl-viewer-pass26
          path: artifacts/yesenin-pravda-rsl-viewer-pass26
          if-no-files-found: error
          retention-days: 14
