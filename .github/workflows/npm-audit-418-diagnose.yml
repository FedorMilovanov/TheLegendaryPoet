name: npm audit 418 diagnose

on:
  push:
    branches:
      - security/npm-audit-418-20260820
    paths:
      - .github/workflows/npm-audit-418-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture exact audit payload
        run: |
          mkdir -p docs/research
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const report = {
            capturedAt: new Date().toISOString(),
            head: cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(),
            node: cp.execFileSync('node', ['--version'], {encoding: 'utf8'}).trim(),
            npm: cp.execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim(),
            audit
          };
          fs.writeFileSync('docs/research/NPM_AUDIT_418_DIAGNOSIS_2026-08-20.json', JSON.stringify(report, null, 2) + '\n');
          NODE
      - name: Commit diagnosis only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/research/NPM_AUDIT_418_DIAGNOSIS_2026-08-20.json
          git commit -m 'research(security): capture exact npm audit 418 payload'
          git push origin HEAD:security/npm-audit-418-20260820
