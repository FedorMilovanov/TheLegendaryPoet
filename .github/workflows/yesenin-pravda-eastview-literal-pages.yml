name: Yesenin Pravda East View Literal Pages

on:
  push:
    branches:
      - research/yesenin-pravda-eastview-literal-pages-discovery
  pull_request:
    branches:
      - research/yesenin-pravda-eastview-featured-target-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect literal East View page-document links
        run: node scripts/discover-yesenin-pravda-eastview-literal-pages.mjs
      - name: Upload immutable page-document evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-pravda-eastview-literal-pages
          path: artifacts/yesenin-pravda-eastview-literal-pages
          if-no-files-found: error
          retention-days: 14
