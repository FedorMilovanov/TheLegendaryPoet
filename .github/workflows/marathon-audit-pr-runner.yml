name: Marathon audit PR runner

on:
  pull_request:
    branches:
      - agent/marathon-audit-integration-20260805
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  run-one-shot-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marathon-audit-integration-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Integrate the reviewed Arena files and conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/marathon-audit-integration-once.yml').read_text(encoding='utf-8').splitlines()
          block = []
          collecting = False
          for line in source:
            if not collecting and line == '        run: |':
              collecting = True
              continue
            if not collecting:
              continue
            if line == '':
              block.append('')
              continue
            if line.startswith('          '):
              block.append(line[10:])
              continue
            break

          joined = '\n'.join(block)
          required = [
            "SOURCE_REF='refs/remotes/origin/arena/019fcf76-thelegendarypoet'",
            'copy_from_source()',
            "inline.write_text",
            "routeModules.tsx",
          ]
          missing = [marker for marker in required if marker not in joined]
          if missing:
            raise SystemExit(f'The reviewed integration block is incomplete: {missing}')
          Path('/tmp/marathon-integrate.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + joined + '\n', encoding='utf-8')
          PY
          chmod +x /tmp/marathon-integrate.sh
          /tmp/marathon-integrate.sh

      - name: Install deterministic build and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
          npm ci

      - name: Generate derived indexes and run repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm run seo:generate
          npm run check
          npm run build
          npm run validate:build-output
          npm run prerender
          npm run seo:generate
          npm run validate:seo-output

      - name: Run Chromium article and hover regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/tlp-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/tlp-preview.log' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/articles >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/articles >/dev/null
          QA_BASE_URL=http://127.0.0.1:4173 npx playwright test \
            qa/hover-stability.spec.mjs \
            qa/articles-catalog.spec.mjs \
            --config=playwright.config.mjs \
            --project=chromium-core \
            --workers=1

      - name: Commit the verified integration and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/marathon-audit-integration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'fix(site): integrate verified marathon audit repairs'
          git push origin HEAD:agent/marathon-audit-integration-20260805
