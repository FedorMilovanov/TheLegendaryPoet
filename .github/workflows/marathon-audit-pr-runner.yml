name: Marathon audit PR runner

on:
  pull_request:
    branches:
      - agent/marathon-audit-integration-20260805
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  run-one-shot-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marathon-audit-integration-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Integrate reviewed unique files from Arena 019fcf76
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF='refs/remotes/origin/arena/019fcf76-thelegendarypoet'
          git fetch origin 'refs/heads/arena/019fcf76-thelegendarypoet:refs/remotes/origin/arena/019fcf76-thelegendarypoet'

          copy_from_source() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE_REF:$path" > "$path"
          }

          for path in \
            .gitignore \
            docs/APP_SHELL_RUNTIME.md \
            qa/hover-stability.spec.mjs \
            scripts/materialize-brand-art.mjs \
            scripts/validate-app-shell.ts \
            scripts/validate-build-output.ts \
            scripts/validate-hover-stability.ts \
            scripts/validate-literary-style.ts \
            src/components/ThemeToggle.tsx \
            src/components/music/AudioPlayerProvider.tsx \
            src/data/essays/yeseninDuncanFirstMeeting.ts \
            src/data/essays/yeseninPartOnePublic.ts \
            src/utils/analytics.ts \
            src/utils/browserStorage.ts \
            src/utils/communityIdentity.ts
          do
            copy_from_source "$path"
          done

          rm -f src/routes/routeModules.tsx
          rm -f src/components/hall/PoetDetailHeroTransition.tsx

          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-hover-stability.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace("node.dataset.tiltActive = 'true';", "node.dataset.tiltTracking = 'true';")
          source = source.replace('delete ref.current.dataset.tiltActive;', 'delete node.dataset.tiltTracking;')
          source = source.replace(".tilt-card-inner[data-tilt-active='true']", '.tilt-card-inner[data-tilt-tracking="true"]')
          source = source.replace('transition-duration: 0ms;', 'transition: none;')
          path.write_text(source, encoding='utf-8')
          PY

          sed -i 's/if "data-tilt-tracking" not in tilt:/if "tiltTracking" not in tilt:/' scripts/integrate-marathon-audit.py
          python3 scripts/integrate-marathon-audit.py

      - name: Install deterministic build and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
          npm ci

      - name: Generate derived indexes and run repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm run seo:generate
          npm run check
          npm run build
          npm run validate:build-output
          npm run prerender
          npm run seo:generate
          npm run validate:seo-output

      - name: Run Chromium article and hover regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/tlp-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/tlp-preview.log' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/articles >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/articles >/dev/null
          QA_BASE_URL=http://127.0.0.1:4173 npx playwright test \
            qa/hover-stability.spec.mjs \
            qa/articles-catalog.spec.mjs \
            --config=playwright.config.mjs \
            --project=chromium-core \
            --workers=1

      - name: Commit verified integration and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/marathon-audit-integration-once.yml \
            .github/workflows/marathon-audit-pr-runner.yml \
            scripts/integrate-marathon-audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'fix(site): integrate verified marathon audit repairs'
          git push origin HEAD:agent/marathon-audit-integration-20260805
