name: Temporary Yesenin Part I Pass 6 Validation

# Validation-only workflow on the temporary alias branch. Never merge this file.
on:
  push:
    branches: [research/yesenin-part1-pass6]

concurrency:
  group: temp-yesenin-pass6-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Focused unpublished article gate
        run: npm run validate:yesenin-part-one-unpublished
      - name: Full static validation
        run: npm run check
      - name: TypeScript typecheck
        run: npm run typecheck
