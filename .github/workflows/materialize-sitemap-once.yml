name: One-shot sitemap materialization

on:
  pull_request:
    paths:
      - .github/workflows/materialize-sitemap-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-sitemap-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: editorial/longform-marathon-2026-08
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --silent

      - name: Generate sitemap from canonical catalog
        run: npm run sitemap

      - name: Require public Part II route
        run: grep -F 'https://thelegendarypoet.ru/essays/sergei-yesenin-1921-1925' public/sitemap.xml

      - name: Commit generated sitemap and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-sitemap-once.yml
          git add public/sitemap.xml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(seo): materialize final Yesenin Part II sitemap'
          git push origin HEAD:editorial/longform-marathon-2026-08
