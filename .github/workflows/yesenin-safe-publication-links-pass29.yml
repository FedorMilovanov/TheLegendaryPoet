name: Yesenin safe publication links pass 29

on:
  push:
    branches:
      - research/outreach-safe-publication-pass29
    paths:
      - 'scripts/verify-yesenin-safe-publication-links-pass29.mjs'
      - 'research/yesenin/PART_ONE_SAFE_PUBLICATION_LINK_MARATHON_PASS29_2026-07-26.md'
      - 'research/yesenin/OUTREACH_REGISTER_2026-07-26.md'
      - '.github/workflows/yesenin-safe-publication-links-pass29.yml'
  pull_request:
    paths:
      - 'scripts/verify-yesenin-safe-publication-links-pass29.mjs'
      - 'research/yesenin/PART_ONE_SAFE_PUBLICATION_LINK_MARATHON_PASS29_2026-07-26.md'
      - 'research/yesenin/OUTREACH_REGISTER_2026-07-26.md'
      - '.github/workflows/yesenin-safe-publication-links-pass29.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sixty-route-link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize IMLI catalogue route to primary domain
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-yesenin-safe-publication-links-pass29.mjs')
          source = path.read_text(encoding='utf-8')
          old = 'https://biblio.imli.ru/index.php/ruslit/527-esenin-s-a/821-letopis-zhizni-i-tvorchestva-s-a-esenina-tom-1'
          new = 'https://imli.ru/nauchnye-otdely/otdel-novejshej-russkoj-literatury-i-literatury-russkogo-zarubezhya/1497-publikatcii-otdela-otdel-novejshej-russkoj-literatury-i-literatury-russkogo-zarubezhya'
          if source.count(old) != 1:
              raise SystemExit('expected one legacy IMLI route')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Verify sixty publication and research routes
        env:
          LINK_TIMEOUT_MS: '30000'
          LINK_CONCURRENCY: '3'
        run: node scripts/verify-yesenin-safe-publication-links-pass29.mjs
      - name: Upload exact route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-safe-publication-links-pass29
          path: artifacts/yesenin-safe-publication-links-pass29.json
          if-no-files-found: error
          retention-days: 30
