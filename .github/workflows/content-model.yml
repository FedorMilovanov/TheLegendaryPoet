name: Content model contract

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/types/poet.ts'
      - 'src/data/poets.ts'
      - 'src/data/library/**'
      - 'src/utils/dailyContent.ts'
      - 'src/App.tsx'
      - 'scripts/new-poet.ts'
      - 'scripts/validate-library.ts'
      - 'scripts/validate-content-model.mjs'
      - 'docs/legacy-content/**'
      - '.github/workflows/content-model.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'src/types/poet.ts'
      - 'src/data/poets.ts'
      - 'src/data/library/**'
      - 'src/utils/dailyContent.ts'
      - 'src/App.tsx'
      - 'scripts/new-poet.ts'
      - 'scripts/validate-library.ts'
      - 'scripts/validate-content-model.mjs'
      - 'docs/legacy-content/**'
      - '.github/workflows/content-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate one live longform model
        run: npm run validate:content-model
