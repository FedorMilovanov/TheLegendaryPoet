name: Brand raster QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/SpectralBrandMark.tsx'
      - 'src/components/Header.tsx'
      - 'src/components/Footer.tsx'
      - 'src/components/brandMotionV18.ts'
      - 'src/components/brandMotionFrameInvariant.ts'
      - 'qa/reference/approved-brand/**'
      - 'qa/reference/README.md'
      - 'qa/brand-reference-evaluation.json'
      - 'scripts/materialize-brand-art.mjs'
      - 'scripts/validate-brand-assets.ts'
      - 'scripts/validate-brand-browser-workflow.ts'
      - 'scripts/validate-brand-motion-frame-invariance.ts'
      - 'scripts/validate-browser-runtime.ts'
      - 'qa/brand-emblem.spec.mjs'
      - 'qa/brand-reference-comparison.spec.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'public/site.webmanifest'
      - 'public/browserconfig.xml'
      - 'public/brand-release.txt'
      - '.github/workflows/brand-qa.yml'
      - '.github/workflows/brand-deep-audit.yml'
      - '.github/workflows/manual-browser-qa.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SCOPE: ${{ github.event_name == 'push' && 'exact-main' || 'exact-pr' }}
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  brand-raster-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg materializer dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install project dependencies
        run: npm ci
      - name: Validate locked browser runtime
        run: npm run validate:browser-runtime
      - name: Validate approved transparent RGBA surfaces
        run: npm run validate:brand
      - name: Validate hover stability contract
        run: npm run validate:hover-stability
      - name: Typecheck restrained interaction
        run: npm run typecheck
      - name: Build exact commit
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start exact preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brand-preview.log 2>&1 &
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/brand-preview.log
          exit 1
      - name: Run exact live-site Browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          qa/brand-emblem.spec.mjs
          qa/brand-reference-comparison.spec.mjs
          --project=chromium-core
          --workers=1
          --reporter=line
      - name: Record artifact manifest
        if: always()
        run: |
          mkdir -p qa-artifacts
          {
            echo "scope=${EVIDENCE_SCOPE}"
            echo "tested_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_RUN_ID}"
            sha256sum qa-artifacts/* 2>/dev/null || true
          } > qa-artifacts/brand-qa-manifest.txt
      - name: Upload exact real-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-${{ env.EVIDENCE_SCOPE }}-${{ env.TESTED_SHA }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
