name: Brand deep reference and motion audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: brand-deep-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brand-deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Validate locked brand declarations
        run: npm run validate:brand

      - name: Typecheck motion normalization
        run: npm run typecheck

      - name: Build exact production site
        env:
          VITE_BASE: /
        run: npm run build

      - name: Install isolated Chromium runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.54.1
          npx playwright install --with-deps chromium

      - name: Start exact production preview
        run: |
          npm run preview -- --host 127.0.0.1 > brand-deep-preview.log 2>&1 &
          echo $! > brand-deep-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat brand-deep-preview.log
          exit 1

      - name: Run exact geometry, v20 evidence and trajectory audit
        run: >-
          npx playwright test
          qa/brand-deep-audit.spec.mjs
          qa/brand-v20-reference.spec.mjs
          --config=playwright.config.mjs
          --project=chromium-core
          --workers=1
          --reporter=line

      - name: Upload deep audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brand-deep-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qa-artifacts/brand-reference-contract-metrics.json
            qa-artifacts/brand-motion-quality-metrics.json
            qa-artifacts/brand-v20-contract-metrics.json
            qa-artifacts/brand-v20-reference-comparison.png
            qa-artifacts/brand-v20-micro-diagnostics.png
            test-results
            brand-deep-preview.log
          if-no-files-found: warn
          retention-days: 30
