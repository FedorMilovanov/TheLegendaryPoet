name: Brand deep reference and motion audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: brand-deep-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brand-deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Validate locked browser runtime
        run: npm run validate:browser-runtime
      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Validate approved transparent RGBA declarations
        run: npm run validate:brand
      - name: Typecheck motion normalization
        run: npm run typecheck
      - name: Build exact production site
        env:
          VITE_BASE: /
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start exact production preview
        run: |
          npm run preview -- --host 127.0.0.1 > brand-deep-preview.log 2>&1 &
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0; sleep 1; done
          cat brand-deep-preview.log
          exit 1
      - name: Run exact live-site source and restrained interaction audit
        run: >-
          npx playwright test
          qa/brand-emblem.spec.mjs
          qa/brand-reference-comparison.spec.mjs
          --config=playwright.config.mjs
          --project=chromium-core
          --workers=1
          --reporter=line
      - name: Upload real-site brand evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brand-live-site-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qa-artifacts/brand-live-desktop-header-idle.png
            qa-artifacts/brand-live-desktop-header-hover.png
            qa-artifacts/brand-live-footer-primary.png
            qa-artifacts/brand-live-mobile-first-viewport.png
            qa-artifacts/brand-live-site-control-sheet.png
            test-results
            brand-deep-preview.log
          if-no-files-found: warn
          retention-days: 30
