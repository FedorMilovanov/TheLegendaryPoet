name: Temporary Brand Raster Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-brand-raster-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate valid brand PNGs and harden contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cairosvg==2.8.2 pillow==11.3.0
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import math

          import cairosvg
          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          root = Path('.')

          def render_svg(path: str, size: int) -> Image.Image:
              png = cairosvg.svg2png(
                  bytestring=(root / path).read_bytes(),
                  output_width=size,
                  output_height=size,
              )
              return Image.open(BytesIO(png)).convert('RGBA')

          def save_png(image: Image.Image, path: str) -> None:
              target = root / path
              image.save(target, format='PNG', optimize=True, compress_level=9)
              with Image.open(target) as check:
                  check.verify()

          favicon_sizes = {
              'public/favicon-16.png': 16,
              'public/favicon-32.png': 32,
              'public/apple-touch-icon.png': 180,
              'public/icon-192.png': 192,
              'public/icon-512.png': 512,
              'public/mstile-150x150.png': 150,
          }
          for path, size in favicon_sizes.items():
              save_png(render_svg('public/favicon.svg', size), path)

          maskable = Image.new('RGBA', (512, 512), '#02050b')
          glow = Image.new('RGBA', maskable.size, (0, 0, 0, 0))
          glow_draw = ImageDraw.Draw(glow)
          glow_draw.ellipse((86, 72, 426, 412), fill=(46, 216, 255, 54))
          glow = glow.filter(ImageFilter.GaussianBlur(54))
          maskable.alpha_composite(glow)
          emblem = render_svg('public/brand-emblem.svg', 330)
          maskable.alpha_composite(emblem, ((512 - 330) // 2, (512 - 330) // 2))
          save_png(maskable, 'public/icon-maskable-512.png')

          width, height = 1200, 630
          og = Image.new('RGB', (width, height), '#02050b')
          pixels = og.load()
          top = (2, 5, 11)
          bottom = (5, 19, 31)
          for y in range(height):
              t = y / (height - 1)
              row = tuple(round(top[i] * (1 - t) + bottom[i] * t) for i in range(3))
              for x in range(width):
                  pixels[x, y] = row

          atmosphere = Image.new('RGBA', (width, height), (0, 0, 0, 0))
          draw = ImageDraw.Draw(atmosphere)
          draw.ellipse((-90, 40, 620, 750), fill=(31, 192, 255, 58))
          draw.ellipse((650, -180, 1330, 470), fill=(32, 93, 255, 34))
          atmosphere = atmosphere.filter(ImageFilter.GaussianBlur(96))
          og = Image.alpha_composite(og.convert('RGBA'), atmosphere)

          emblem_large = render_svg('public/brand-emblem.svg', 390)
          emblem_glow = Image.new('RGBA', (470, 470), (0, 0, 0, 0))
          emblem_glow.alpha_composite(emblem_large, (40, 40))
          blurred = emblem_glow.filter(ImageFilter.GaussianBlur(28))
          blurred.putalpha(blurred.getchannel('A').point(lambda value: min(110, value)))
          og.alpha_composite(blurred, (36, 80))
          og.alpha_composite(emblem_large, (76, 120))

          def font(path: str, size: int):
              try:
                  return ImageFont.truetype(path, size=size)
              except OSError:
                  return ImageFont.load_default()

          serif = font('/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf', 62)
          sans = font('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 24)
          sans_bold = font('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 18)
          canvas = ImageDraw.Draw(og)
          text_x = 505
          canvas.text((text_x, 184), 'THE LEGENDARY', font=serif, fill=(230, 252, 255, 255))
          canvas.text((text_x, 255), 'POET', font=serif, fill=(105, 224, 255, 255), stroke_width=1, stroke_fill=(34, 103, 180, 255))
          canvas.rounded_rectangle((text_x, 348, text_x + 128, 351), radius=2, fill=(212, 175, 55, 220))
          canvas.text((text_x, 382), 'ПОЭЗИЯ • АНАЛИЗ • ИСТОРИЯ', font=sans_bold, fill=(165, 226, 238, 225))
          canvas.text((text_x, 433), 'Великие тексты, судьбы и духовные поиски', font=sans, fill=(185, 214, 224, 185))
          canvas.text((text_x, 472), 'русских поэтов — бережно и без мифологизации.', font=sans, fill=(185, 214, 224, 185))
          canvas.rounded_rectangle((36, 28, width - 36, height - 28), radius=28, outline=(72, 199, 230, 52), width=2)
          save_png(og, 'public/og-image.png')

          test_path = root / 'qa/brand-emblem.spec.mjs'
          test = test_path.read_text(encoding='utf-8')
          helper_anchor = "async function pngSize(page, url) {\n  return page.evaluate(async (assetUrl) => {\n    const image = new Image();\n    image.src = assetUrl;\n    await image.decode();\n    return { width: image.naturalWidth, height: image.naturalHeight };\n  }, url);\n}\n"
          helper = helper_anchor + "\nasync function visualState(locator) {\n  return locator.evaluate((node) => {\n    const computed = getComputedStyle(node);\n    return {\n      opacity: computed.opacity,\n      transform: computed.transform,\n      filter: computed.filter,\n      strokeDasharray: node.getAttribute('stroke-dasharray'),\n      strokeDashoffset: node.getAttribute('stroke-dashoffset'),\n    };\n  });\n}\n"
          if helper_anchor not in test:
              raise SystemExit('brand test helper anchor missing')
          test = test.replace(helper_anchor, helper, 1)
          old_hover = """  const before = {\n    wing: await leftWing.getAttribute('style'),\n    halo: await halo.getAttribute('style'),\n    filter: await mark.locator('svg').getAttribute('style'),\n  };\n\n  await mark.hover();\n  await page.waitForTimeout(420);\n\n  const after = {\n    wing: await leftWing.getAttribute('style'),\n    halo: await halo.getAttribute('style'),\n    filter: await mark.locator('svg').getAttribute('style'),\n  };\n  expect(after.wing).not.toBe(before.wing);\n  expect(after.halo).not.toBe(before.halo);\n  expect(after.filter).not.toBe(before.filter);\n"""
          new_hover = """  const svg = mark.locator('svg');\n  const before = {\n    wing: await visualState(leftWing),\n    halo: await visualState(halo),\n    filter: (await visualState(svg)).filter,\n  };\n\n  await mark.hover();\n\n  await expect.poll(() => visualState(leftWing), { timeout: 2_500 }).not.toEqual(before.wing);\n  await expect.poll(() => visualState(halo), { timeout: 2_500 }).not.toEqual(before.halo);\n  await expect.poll(async () => (await visualState(svg)).filter, { timeout: 2_500 }).not.toBe(before.filter);\n"""
          if old_hover not in test:
              raise SystemExit('brand hover assertion block missing')
          test_path.write_text(test.replace(old_hover, new_hover, 1), encoding='utf-8')

          validator_path = root / 'scripts/validate-brand-assets.ts'
          validator = validator_path.read_text(encoding='utf-8')
          old_validator = """function pngDimensions(buffer: Buffer) {\n  assert.equal(buffer.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', 'invalid PNG signature');\n  return { width: buffer.readUInt32BE(16), height: buffer.readUInt32BE(20) };\n}\n"""
          new_validator = """function crc32(buffer: Buffer) {\n  let crc = 0xffffffff;\n  for (const byte of buffer) {\n    crc ^= byte;\n    for (let bit = 0; bit < 8; bit += 1) {\n      crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);\n    }\n  }\n  return (crc ^ 0xffffffff) >>> 0;\n}\n\nfunction pngDimensions(buffer: Buffer, file: string) {\n  assert.equal(buffer.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', `${file}: invalid PNG signature`);\n\n  let offset = 8;\n  let dimensions: { width: number; height: number } | null = null;\n  let sawIend = false;\n  while (offset + 12 <= buffer.length) {\n    const length = buffer.readUInt32BE(offset);\n    const type = buffer.subarray(offset + 4, offset + 8).toString('ascii');\n    const dataEnd = offset + 8 + length;\n    const chunkEnd = dataEnd + 4;\n    assert.ok(chunkEnd <= buffer.length, `${file}: truncated ${type || 'unknown'} chunk`);\n\n    const expectedCrc = buffer.readUInt32BE(dataEnd);\n    const actualCrc = crc32(buffer.subarray(offset + 4, dataEnd));\n    assert.equal(actualCrc, expectedCrc, `${file}: invalid ${type} CRC`);\n\n    if (type === 'IHDR') {\n      assert.equal(length, 13, `${file}: invalid IHDR length`);\n      dimensions = { width: buffer.readUInt32BE(offset + 8), height: buffer.readUInt32BE(offset + 12) };\n    }\n\n    offset = chunkEnd;\n    if (type === 'IEND') {\n      sawIend = true;\n      break;\n    }\n  }\n\n  assert.ok(dimensions, `${file}: IHDR chunk is missing`);\n  assert.ok(sawIend, `${file}: IEND chunk is missing`);\n  assert.equal(offset, buffer.length, `${file}: trailing bytes after IEND`);\n  return dimensions;\n}\n"""
          if old_validator not in validator:
              raise SystemExit('brand validator PNG function missing')
          validator = validator.replace(old_validator, new_validator, 1)
          validator = validator.replace('pngDimensions(readBuffer(file))', 'pngDimensions(readBuffer(file), file)')
          validator_path.write_text(validator, encoding='utf-8')

          expected = {
              'public/favicon-16.png': (16, 16),
              'public/favicon-32.png': (32, 32),
              'public/apple-touch-icon.png': (180, 180),
              'public/icon-192.png': (192, 192),
              'public/icon-512.png': (512, 512),
              'public/icon-maskable-512.png': (512, 512),
              'public/mstile-150x150.png': (150, 150),
              'public/og-image.png': (1200, 630),
          }
          for path, size in expected.items():
              with Image.open(root / path) as image:
                  image.load()
                  if image.size != size:
                      raise SystemExit(f'{path}: {image.size} != {size}')
          print('regenerated and decoded all brand PNG assets')
          PY

      - name: Validate brand and production build
        run: |
          npm ci
          npm run validate:brand
          npm run typecheck
          npm run build
          git diff --check

      - name: Commit exact repaired scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          files=(
            public/favicon-16.png
            public/favicon-32.png
            public/apple-touch-icon.png
            public/icon-192.png
            public/icon-512.png
            public/icon-maskable-512.png
            public/mstile-150x150.png
            public/og-image.png
            qa/brand-emblem.spec.mjs
            scripts/validate-brand-assets.ts
          )
          git add "${files[@]}"
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'fix(brand): regenerate decodable raster assets'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}