name: Replace unstable Yesenin catalogue locator

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/replace-unstable-yesenin-catalogue-link.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  replace:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/publish-selected-yesenin-covers
          fetch-depth: 0

      - name: Replace catalogue locator and remove one-time workflow
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path('src/data/essays/yeseninPartOnePublic.ts')
          text = path.read_text(encoding='utf-8')
          marker = '"id": "ye1-imli-chronicle-v1-catalogue"'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('stable source id is missing')
          end = text.find('\n    },', start)
          if end < 0:
              raise SystemExit('source block end is missing')
          end += len('\n    },')
          block = text[start:end]
          replacement = '"url": "https://search.rsl.ru/ru/record/01002391503"'
          updated, count = re.subn(r'"url":\s*"https://imli\.ru/[^"]+"', replacement, block, count=1)
          if count != 1:
              raise SystemExit(f'expected one IMLI locator in source block, found {count}: {block}')
          path.write_text(text[:start] + updated + text[end:], encoding='utf-8')
          Path('.github/workflows/replace-unstable-yesenin-catalogue-link.yml').unlink()

      - name: Commit stable locator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(sources): use stable RSL catalogue locator for Yesenin chronicle'
          git push origin HEAD:agent/publish-selected-yesenin-covers
