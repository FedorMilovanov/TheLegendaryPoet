name: Hall greybox tooling

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hall-greybox-tooling.yml'
      - 'docs/hall-v3/hall-v3-contract.json'
      - 'docs/hall-v3/greybox-tooling.json'
      - 'docs/hall-v3/greybox-candidates.json'
      - 'docs/hall-v3/greybox-layouts.json'
      - 'docs/hall-v3/greybox-decision.json'
      - 'docs/hall-v3/camera-rigs.json'
      - 'docs/hall-v3/camera-decision.json'
      - 'docs/hall-v3/camera-gate-promotion.json'
      - 'docs/hall-v3/material-lighting-export-spike.json'
      - 'scripts/hall-greybox/**'
      - 'scripts/hall-camera/**'
      - 'scripts/hall-material-spike/**'
      - 'qa/hall-material-spike/**'
      - 'scripts/validate-hall-topology-selection-provenance.ts'
      - 'scripts/validate-hall-post-camera-authority.ts'
      - 'scripts/validate-hall-material-spike.ts'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hall-greybox-tooling.yml'
      - 'docs/hall-v3/hall-v3-contract.json'
      - 'docs/hall-v3/greybox-tooling.json'
      - 'docs/hall-v3/greybox-candidates.json'
      - 'docs/hall-v3/greybox-layouts.json'
      - 'docs/hall-v3/greybox-decision.json'
      - 'docs/hall-v3/camera-rigs.json'
      - 'docs/hall-v3/camera-decision.json'
      - 'docs/hall-v3/camera-gate-promotion.json'
      - 'docs/hall-v3/material-lighting-export-spike.json'
      - 'scripts/hall-greybox/**'
      - 'scripts/hall-camera/**'
      - 'scripts/hall-material-spike/**'
      - 'qa/hall-material-spike/**'
      - 'scripts/validate-hall-topology-selection-provenance.ts'
      - 'scripts/validate-hall-post-camera-authority.ts'
      - 'scripts/validate-hall-material-spike.ts'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: hall-greybox-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  blender-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BLENDER_ARCHIVE_URL: https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz
      BLENDER_CHECKSUM_URL: https://download.blender.org/release/Blender4.5/blender-4.5.12.sha256
      BLENDER_ARCHIVE: blender-4.5.12-linux-x64.tar.xz
      MESHOPT_REPO: https://github.com/zeux/meshoptimizer.git
      MESHOPT_COMMIT: 9d9890c73011d75920af614485296d1e03e95448
      GLTF_VALIDATOR_URL: https://github.com/KhronosGroup/glTF-Validator/releases/download/2.0.0-dev.3.10/gltf_validator-2.0.0-dev.3.10-linux64.tar.xz

    steps:
      - name: Checkout exact Hall post-camera head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Verify exact Hall checkout identity
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TESTED_SHA"
          printf 'tested_commit=%s\n' "$actual" > hall-greybox-tested-head.txt

      - name: Set up repository Node baseline
        uses: ./.github/actions/setup-node-deps

      - name: Validate frozen Hall shootout provenance
        run: npm run validate:hall-topology-provenance

      - name: Validate frozen H3 R1 post-camera authority
        run: npm run validate:hall-post-camera-authority

      - name: Validate bounded material spike source contract
        run: npm run validate:hall-material-spike

      - name: Download pinned Blender 4.5.12 LTS and vendor checksum
        run: |
          set -euo pipefail
          mkdir -p .tools/download .tools/blender
          curl --fail --location --retry 3 --retry-delay 2 "$BLENDER_ARCHIVE_URL" --output ".tools/download/$BLENDER_ARCHIVE"
          curl --fail --location --retry 3 --retry-delay 2 "$BLENDER_CHECKSUM_URL" --output .tools/download/blender-4.5.12.sha256
          grep "${BLENDER_ARCHIVE}$" .tools/download/blender-4.5.12.sha256 > .tools/download/blender-linux.sha256
          test -s .tools/download/blender-linux.sha256
          (
            cd .tools/download
            sha256sum -c blender-linux.sha256
          )

      - name: Extract exact Blender runtime
        run: |
          set -euo pipefail
          tar -xJf ".tools/download/$BLENDER_ARCHIVE" -C .tools/blender --strip-components=1
          test -x .tools/blender/blender
          printf 'BLENDER_BIN=%s/.tools/blender/blender\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Record Blender runtime identity
        run: "$BLENDER_BIN --version | tee blender-version.txt"

      - name: Run headless metre-scale save-reopen smoke scene
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/hall-greybox-tooling
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-greybox/blender-tooling-preflight.py \
            -- \
            --output-dir qa-artifacts/hall-greybox-tooling

      - name: Validate tooling evidence against post-camera authority
        env:
          HALL_GREYBOX_TOOLING_EVIDENCE: qa-artifacts/hall-greybox-tooling/preflight.json
        run: |
          npm run validate:hall-topology-provenance
          npm run validate:hall-post-camera-authority
          npm run validate:hall-material-spike

      - name: Install minimal EGL runtime for headless Workbench evidence
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Regenerate frozen H1 H2 H3 neutral metric evidence
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/hall-greybox-candidates
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-greybox/generate-candidates.py \
            -- \
            --layouts docs/hall-v3/greybox-layouts.json \
            --output-dir qa-artifacts/hall-greybox-candidates

      - name: Validate regenerated frozen H3 evidence
        env:
          HALL_GREYBOX_CANDIDATE_EVIDENCE: qa-artifacts/hall-greybox-candidates/index.json
        run: |
          npm run validate:hall-topology-provenance
          npm run validate:hall-post-camera-authority
          npm run validate:hall-material-spike

      - name: Regenerate frozen H3 camera candidate evidence
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/hall-camera-candidates
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-camera/generate-camera-candidates.py \
            -- \
            --rigs docs/hall-v3/camera-rigs.json \
            --source-blend qa-artifacts/hall-greybox-candidates/H3/H3.blend \
            --source-manifest qa-artifacts/hall-greybox-candidates/H3/manifest.json \
            --output-dir qa-artifacts/hall-camera-candidates

      - name: Validate regenerated R1 approval evidence under promoted gate
        env:
          HALL_CAMERA_APPROVAL_EVIDENCE: qa-artifacts/hall-camera-candidates/index.json
        run: |
          npm run validate:hall-post-camera-authority
          npm run validate:hall-material-spike

      - name: Build pinned native gltfpack v1.2 from exact upstream commit
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$MESHOPT_REPO" .tools/meshoptimizer
          git -C .tools/meshoptimizer checkout --detach "$MESHOPT_COMMIT"
          actual="$(git -C .tools/meshoptimizer rev-parse HEAD)"
          test "$actual" = "$MESHOPT_COMMIT"
          printf '%s\n' "$actual" > gltfpack-source-head.txt
          make -C .tools/meshoptimizer -j2 config=release gltfpack
          test -x .tools/meshoptimizer/gltfpack
          printf 'GLTFPACK_BIN=%s/.tools/meshoptimizer/gltfpack\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Download pinned Khronos glTF Validator release
        run: |
          set -euo pipefail
          mkdir -p .tools/gltf-validator .tools/download
          curl --fail --location --retry 3 --retry-delay 2 "$GLTF_VALIDATOR_URL" --output .tools/download/gltf-validator.tar.xz
          sha256sum .tools/download/gltf-validator.tar.xz | tee gltf-validator-release.sha256
          tar -xJf .tools/download/gltf-validator.tar.xz -C .tools/gltf-validator
          test -x .tools/gltf-validator/gltf_validator
          printf 'GLTF_VALIDATOR_BIN=%s/.tools/gltf-validator/gltf_validator\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          .tools/gltf-validator/gltf_validator 2>&1 | tee gltf-validator-version.txt || true
          grep -F '2.0.0-dev.3.10' gltf-validator-version.txt

      - name: Generate representative H3 material and lightmap evidence
        run: |
          set -euo pipefail
          rm -rf qa-artifacts/hall-material-spike
          mkdir -p qa-artifacts/hall-material-spike
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-material-spike/generate-bay.py \
            -- \
            --config docs/hall-v3/material-lighting-export-spike.json \
            --layouts docs/hall-v3/greybox-layouts.json \
            --output-dir qa-artifacts/hall-material-spike
          cp gltfpack-source-head.txt qa-artifacts/hall-material-spike/gltfpack-source-head.txt
          cp gltf-validator-release.sha256 qa-artifacts/hall-material-spike/gltf-validator-release.sha256
          cp gltf-validator-version.txt qa-artifacts/hall-material-spike/gltf-validator-version.txt

      - name: Khronos-validate raw representative GLB
        run: node scripts/hall-material-spike/validate-gltf.mjs "$GLTF_VALIDATOR_BIN" qa-artifacts/hall-material-spike/h3-bay.raw.glb qa-artifacts/hall-material-spike/raw-validator.json

      - name: Optimize representative GLB with preservation flags
        run: |
          set -euo pipefail
          "$GLTFPACK_BIN" \
            -i qa-artifacts/hall-material-spike/h3-bay.raw.glb \
            -o qa-artifacts/hall-material-spike/h3-bay.optimized.glb \
            -kn -km -ke -kv -vpf -vtf -cc

      - name: Khronos-validate optimized representative GLB
        run: node scripts/hall-material-spike/validate-gltf.mjs "$GLTF_VALIDATOR_BIN" qa-artifacts/hall-material-spike/h3-bay.optimized.glb qa-artifacts/hall-material-spike/optimized-validator.json

      - name: Compare raw and optimized application contracts
        run: |
          node scripts/hall-material-spike/inspect-glb.mjs \
            --raw qa-artifacts/hall-material-spike/h3-bay.raw.glb \
            --optimized qa-artifacts/hall-material-spike/h3-bay.optimized.glb \
            --out qa-artifacts/hall-material-spike/asset-contract.json

      - name: Install real Chromium for isolated browser witness
        run: npx playwright install --with-deps chromium

      - name: Capture equal R1 browser witnesses for both lighting candidates
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/hall-material-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/qa/hall-material-spike/viewer.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/qa/hall-material-spike/viewer.html >/dev/null
          node qa/hall-material-spike/browser-witness.mjs \
            --strategy L0_MINIMAL_REALTIME \
            --asset qa-artifacts/hall-material-spike/h3-bay.optimized.glb \
            --out qa-artifacts/hall-material-spike/L0_MINIMAL_REALTIME
          node qa/hall-material-spike/browser-witness.mjs \
            --strategy L1_EXTERNAL_LIGHTMAP_UV1 \
            --asset qa-artifacts/hall-material-spike/h3-bay.optimized.glb \
            --lightmap qa-artifacts/hall-material-spike/h3-bay-lightmap-uv1.png \
            --out qa-artifacts/hall-material-spike/L1_EXTERNAL_LIGHTMAP_UV1

      - name: Finalize material spike artifact hashes
        run: node scripts/hall-material-spike/finalize-evidence.mjs qa-artifacts/hall-material-spike

      - name: Validate generated material light export evidence
        env:
          HALL_MATERIAL_SPIKE_EVIDENCE: qa-artifacts/hall-material-spike
        run: |
          npm run validate:hall-post-camera-authority
          npm run validate:hall-material-spike

      - name: Upload reproducible tooling witness
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hall-greybox-tooling-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            hall-greybox-tested-head.txt
            blender-version.txt
            qa-artifacts/hall-greybox-tooling/preflight.json
            qa-artifacts/hall-greybox-tooling/tooling-smoke.blend
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frozen H1 H2 H3 comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hall-greybox-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            hall-greybox-tested-head.txt
            qa-artifacts/hall-greybox-candidates
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frozen H3 camera comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hall-camera-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            hall-greybox-tested-head.txt
            qa-artifacts/hall-camera-candidates
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bounded H3 material lighting export evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hall-material-spike-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            hall-greybox-tested-head.txt
            blender-version.txt
            gltfpack-source-head.txt
            gltf-validator-release.sha256
            gltf-validator-version.txt
            qa-artifacts/hall-material-spike
          if-no-files-found: warn
          retention-days: 14
