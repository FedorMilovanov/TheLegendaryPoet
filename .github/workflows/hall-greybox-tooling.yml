name: Hall greybox tooling

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hall-greybox-tooling.yml'
      - 'docs/hall-v3/hall-v3-contract.json'
      - 'docs/hall-v3/greybox-tooling.json'
      - 'docs/hall-v3/greybox-candidates.json'
      - 'docs/hall-v3/greybox-layouts.json'
      - 'docs/hall-v3/greybox-decision.json'
      - 'docs/hall-v3/camera-rigs.json'
      - 'docs/hall-v3/camera-decision.json'
      - 'docs/hall-v3/camera-gate-promotion.json'
      - 'docs/hall-v3/material-spike.json'
      - 'docs/hall-v3/material-decision.json'
      - 'docs/hall-v3/material-gate-promotion.json'
      - 'docs/hall-v3/pushkin-rights.json'
      - 'docs/hall-v3/pushkin-slice.json'
      - 'docs/hall-v3/pushkin-acquisition.json'
      - 'docs/hall-v3/pushkin-rights-review.json'
      - 'scripts/hall-greybox/**'
      - 'scripts/hall-camera/**'
      - 'scripts/hall-material/**'
      - 'qa/hall-material-viewer/**'
      - 'scripts/validate-hall-topology-selection-provenance.ts'
      - 'scripts/validate-hall-material-spike.ts'
      - 'scripts/validate-hall-material-transport.ts'
      - 'scripts/validate-hall-material-decision.ts'
      - 'scripts/validate-hall-post-material-authority.ts'
      - 'scripts/validate-hall-pushkin-rights.ts'
      - 'scripts/validate-hall-pushkin-rights-policy-schema.ts'
      - 'scripts/validate-hall-pushkin-acquisition.ts'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hall-greybox-tooling.yml'
      - 'docs/hall-v3/hall-v3-contract.json'
      - 'docs/hall-v3/greybox-tooling.json'
      - 'docs/hall-v3/greybox-candidates.json'
      - 'docs/hall-v3/greybox-layouts.json'
      - 'docs/hall-v3/greybox-decision.json'
      - 'docs/hall-v3/camera-rigs.json'
      - 'docs/hall-v3/camera-decision.json'
      - 'docs/hall-v3/camera-gate-promotion.json'
      - 'docs/hall-v3/material-spike.json'
      - 'docs/hall-v3/material-decision.json'
      - 'docs/hall-v3/material-gate-promotion.json'
      - 'docs/hall-v3/pushkin-rights.json'
      - 'docs/hall-v3/pushkin-slice.json'
      - 'docs/hall-v3/pushkin-acquisition.json'
      - 'docs/hall-v3/pushkin-rights-review.json'
      - 'scripts/hall-greybox/**'
      - 'scripts/hall-camera/**'
      - 'scripts/hall-material/**'
      - 'qa/hall-material-viewer/**'
      - 'scripts/validate-hall-topology-selection-provenance.ts'
      - 'scripts/validate-hall-material-spike.ts'
      - 'scripts/validate-hall-material-transport.ts'
      - 'scripts/validate-hall-material-decision.ts'
      - 'scripts/validate-hall-post-material-authority.ts'
      - 'scripts/validate-hall-pushkin-rights.ts'
      - 'scripts/validate-hall-pushkin-rights-policy-schema.ts'
      - 'scripts/validate-hall-pushkin-acquisition.ts'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: hall-greybox-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  blender-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLENDER_ARCHIVE_URL: https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz
      BLENDER_CHECKSUM_URL: https://download.blender.org/release/Blender4.5/blender-4.5.12.sha256
      BLENDER_ARCHIVE: blender-4.5.12-linux-x64.tar.xz

    steps:
      - name: Checkout exact Hall post-material head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Verify exact Hall checkout identity
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TESTED_SHA"
          printf 'tested_commit=%s\n' "$actual" > hall-greybox-tested-head.txt

      - name: Set up repository Node baseline
        uses: ./.github/actions/setup-node-deps

      - name: Validate frozen Hall shootout provenance
        run: npm run validate:hall-topology-provenance

      - name: Validate frozen H3 R1 selected material authority
        run: npm run validate:hall-post-material-authority

      - name: Validate Pushkin rights and source-slice authority
        run: npm run validate:hall-pushkin-rights

      - name: Validate canonical Pushkin rights record schema
        run: npm run validate:hall-pushkin-rights-policy-schema

      - name: Validate Pushkin acquisition authority
        run: npm run validate:hall-pushkin-acquisition

      - name: Validate phase-independent material transport source contract
        run: npm run validate:hall-material-transport

      - name: Download pinned Blender 4.5.12 LTS and vendor checksum
        run: |
          set -euo pipefail
          mkdir -p .tools/download .tools/blender
          curl --fail --location --retry 3 --retry-delay 2 "$BLENDER_ARCHIVE_URL" --output ".tools/download/$BLENDER_ARCHIVE"
          curl --fail --location --retry 3 --retry-delay 2 "$BLENDER_CHECKSUM_URL" --output .tools/download/blender-4.5.12.sha256
          grep "${BLENDER_ARCHIVE}$" .tools/download/blender-4.5.12.sha256 > .tools/download/blender-linux.sha256
          test -s .tools/download/blender-linux.sha256
          (
            cd .tools/download
            sha256sum -c blender-linux.sha256
          )

      - name: Extract exact Blender runtime
        run: |
          set -euo pipefail
          tar -xJf ".tools/download/$BLENDER_ARCHIVE" -C .tools/blender --strip-components=1
          test -x .tools/blender/blender
          printf 'BLENDER_BIN=%s/.tools/blender/blender\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Record Blender runtime identity
        run: "$BLENDER_BIN --version | tee blender-version.txt"

      - name: Run headless metre-scale save-reopen smoke scene
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/hall-greybox-tooling
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-greybox/blender-tooling-preflight.py \
            -- \
            --output-dir qa-artifacts/hall-greybox-tooling

      - name: Validate tooling evidence against post-material authority
        env:
          HALL_GREYBOX_TOOLING_EVIDENCE: qa-artifacts/hall-greybox-tooling/preflight.json
        run: |
          npm run validate:hall-topology-provenance
          npm run validate:hall-post-material-authority

      - name: Install minimal EGL runtime for headless Workbench evidence
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Regenerate frozen H1 H2 H3 neutral metric evidence
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/hall-greybox-candidates
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-greybox/generate-candidates.py \
            -- \
            --layouts docs/hall-v3/greybox-layouts.json \
            --output-dir qa-artifacts/hall-greybox-candidates

      - name: Validate regenerated frozen H3 evidence
        env:
          HALL_GREYBOX_CANDIDATE_EVIDENCE: qa-artifacts/hall-greybox-candidates/index.json
        run: |
          npm run validate:hall-topology-provenance
          npm run validate:hall-post-material-authority

      - name: Regenerate frozen H3 camera candidate evidence
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/hall-camera-candidates
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-camera/generate-camera-candidates.py \
            -- \
            --rigs docs/hall-v3/camera-rigs.json \
            --source-blend qa-artifacts/hall-greybox-candidates/H3/H3.blend \
            --source-manifest qa-artifacts/hall-greybox-candidates/H3/manifest.json \
            --output-dir qa-artifacts/hall-camera-candidates

      - name: Validate regenerated R1 evidence under post-material authority
        env:
          HALL_CAMERA_APPROVAL_EVIDENCE: qa-artifacts/hall-camera-candidates/index.json
        run: npm run validate:hall-post-material-authority

      - name: Generate representative H3 material and lightmap bay
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/hall-material-spike
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-material/generate-material-spike.py \
            -- \
            --contract docs/hall-v3/material-spike.json \
            --source-blend qa-artifacts/hall-greybox-candidates/H3/H3.blend \
            --source-manifest qa-artifacts/hall-greybox-candidates/H3/manifest.json \
            --output-dir qa-artifacts/hall-material-spike

      - name: Prepare bounded close and medium material visual evidence
        run: |
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-material/prepare-material-visual-evidence.py \
            -- \
            --contract docs/hall-v3/material-spike.json \
            --blend qa-artifacts/hall-material-spike/material-spike.blend \
            --source-evidence qa-artifacts/hall-material-spike/source-evidence.json

      - name: Re-export identical bay with explicit normal-map tangents
        run: |
          "$BLENDER_BIN" \
            --background \
            --disable-autoexec \
            --python-exit-code 17 \
            --python scripts/hall-material/reexport-with-tangents.py \
            -- \
            --contract docs/hall-v3/material-spike.json \
            --blend qa-artifacts/hall-material-spike/material-spike.blend \
            --output qa-artifacts/hall-material-spike/material-spike-raw.glb

      - name: Install exact spike-only glTF tools in isolated prefix
        run: |
          set -euo pipefail
          rm -rf .tools/hall-gltf
          mkdir -p .tools/hall-gltf
          printf '%s\n' '{"name":"hall-gltf-spike-tools","version":"0.0.0","private":true}' > .tools/hall-gltf/package.json
          npm install --prefix .tools/hall-gltf --save-exact --ignore-scripts --omit=dev --no-audit --no-fund gltf-validator@2.0.0-dev.3.10 gltfpack@1.2.0
          test "$(node -p "require('./.tools/hall-gltf/node_modules/gltf-validator/package.json').version")" = "2.0.0-dev.3.10"
          test "$(node -p "require('./.tools/hall-gltf/node_modules/gltfpack/package.json').version")" = "1.2.0"
          test -x .tools/hall-gltf/node_modules/.bin/gltfpack
          test -f .tools/hall-gltf/package-lock.json

      - name: Validate raw Blender GLB with Khronos validator
        run: node scripts/hall-material/validate-gltf.mjs --tool-root .tools/hall-gltf --input qa-artifacts/hall-material-spike/material-spike-raw.glb --output qa-artifacts/hall-material-spike/gltf-raw-report.json

      - name: Optimize representative GLB with preservation-safe Meshopt path
        run: .tools/hall-gltf/node_modules/.bin/gltfpack -i qa-artifacts/hall-material-spike/material-spike-raw.glb -o qa-artifacts/hall-material-spike/material-spike-optimized.glb -cc -kn -km -ke -kv -vpf

      - name: Validate optimized GLB with Khronos validator
        run: node scripts/hall-material/validate-gltf.mjs --tool-root .tools/hall-gltf --input qa-artifacts/hall-material-spike/material-spike-optimized.glb --output qa-artifacts/hall-material-spike/gltf-optimized-report.json

      - name: Validate regenerated material transport and selected authority
        env:
          HALL_MATERIAL_SPIKE_EVIDENCE: qa-artifacts/hall-material-spike
        run: |
          npm run validate:hall-material-transport
          npm run validate:hall-post-material-authority

      - name: Prepare isolated QA viewer assets
        run: |
          set -euo pipefail
          rm -rf qa/hall-material-viewer/generated
          mkdir -p qa/hall-material-viewer/generated/lightmaps
          cp qa-artifacts/hall-material-spike/material-spike-raw.glb qa/hall-material-viewer/generated/
          cp qa-artifacts/hall-material-spike/material-spike-optimized.glb qa/hall-material-viewer/generated/
          cp qa-artifacts/hall-material-spike/lightmap-bindings.json qa/hall-material-viewer/generated/
          cp qa-artifacts/hall-material-spike/lightmaps/* qa/hall-material-viewer/generated/lightmaps/

      - name: Install locked Chromium for isolated material viewer
        uses: ./.github/actions/install-playwright
        with:
          browsers: chromium

      - name: Start isolated material viewer
        run: |
          set -euo pipefail
          npx vite qa/hall-material-viewer --host 127.0.0.1 --port 4175 > qa-artifacts/hall-material-spike/viewer.log 2>&1 &
          echo $! > qa-artifacts/hall-material-spike/viewer.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat qa-artifacts/hall-material-spike/viewer.log
          exit 1

      - name: Capture selected and rejected material browser evidence
        run: node scripts/hall-material/browser-witness.mjs --contract docs/hall-v3/material-spike.json --base-url http://127.0.0.1:4175 --output-dir qa-artifacts/hall-material-browser

      - name: Validate final DCC export browser evidence under selected material authority
        env:
          HALL_MATERIAL_SPIKE_EVIDENCE: qa-artifacts/hall-material-spike
          HALL_MATERIAL_BROWSER_EVIDENCE: qa-artifacts/hall-material-browser/browser-evidence.json
        run: |
          npm run validate:hall-material-transport
          npm run validate:hall-post-material-authority

      - name: Upload reproducible tooling witness
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hall-greybox-tooling-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            hall-greybox-tested-head.txt
            blender-version.txt
            qa-artifacts/hall-greybox-tooling/preflight.json
            qa-artifacts/hall-greybox-tooling/tooling-smoke.blend
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frozen H1 H2 H3 comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hall-greybox-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            hall-greybox-tested-head.txt
            qa-artifacts/hall-greybox-candidates
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frozen H3 camera comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hall-camera-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            hall-greybox-tested-head.txt
            qa-artifacts/hall-camera-candidates
          if-no-files-found: warn
          retention-days: 14

      - name: Upload representative material evidence under Pushkin gate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hall-material-spike-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            hall-greybox-tested-head.txt
            blender-version.txt
            qa-artifacts/hall-material-spike
            qa-artifacts/hall-material-browser
          if-no-files-found: warn
          retention-days: 14