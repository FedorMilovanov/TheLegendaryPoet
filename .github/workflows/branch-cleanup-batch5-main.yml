name: One-shot guarded marker-only cleanup batch 5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-batch5-main.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete explicit never-merge marker-only refs and verify global ref set
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime as dt, json, os, re, time, urllib.error, urllib.parse, urllib.request
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          trigger_sha = os.environ["TRIGGER_SHA"]
          owner = repo.split("/", 1)[0]
          report_path = "qa/branch-cleanup-batch5-report.json"
          allowed_bases = {"main", "work/local-images-playwright-wtoc"}
          forbidden_exact = {"main", "work/local-images-playwright-wtoc", "deploy-live-cloak-v2"}
          forbidden_prefixes = ("backup/", "archive/", "editorial/", "work/", "ops/", "research/")
          markers = (
              "never merge", "must never be merged", "do not merge", "should not be merged",
              "not intended to merge", "not intended for merge", "read-only witness",
              "temporary live witness", "verification branch only"
          )
          allowed_paths = [
              re.compile(r"^qa/.*verification.*\.txt$", re.I),
              re.compile(r"^\.github/live-witness/.*\.(md|txt)$", re.I),
              re.compile(r"^docs/LIVE_.*\.md$"),
              re.compile(r"^\.github/validation/.*\.(md|txt)$", re.I),
              re.compile(r"^validation/.*\.(md|txt)$", re.I),
          ]

          def api(method, path, payload=None, allow_404=False, soft=False):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(f"https://api.github.com{path}", data=data, method=method)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              req.add_header("User-Agent", "marker-only-branch-cleanup")
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None, None
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(errors="replace")
                  if allow_404 and exc.code == 404: return 404, None, None
                  if soft: return exc.code, None, raw
                  raise RuntimeError(f"{method} {path}: {exc.code} {raw}") from exc

          def enc(v): return urllib.parse.quote(v, safe="")
          def path_allowed(path): return any(p.fullmatch(path) for p in allowed_paths)
          def put_report(report, sha=None):
              content = base64.b64encode((json.dumps(report, ensure_ascii=False, indent=2)+"\n").encode()).decode()
              payload = {"message":"ops: record marker-only cleanup batch 5","content":content,"branch":"main"}
              if sha: payload["sha"] = sha
              _, result, _ = api("PUT", f"/repos/{repo}/contents/{report_path}", payload)
              return result["content"]["sha"], result["commit"]["sha"]

          _, main_ref, _ = api("GET", f"/repos/{repo}/git/ref/heads/main")
          if main_ref["object"]["sha"] != trigger_sha: raise RuntimeError("main moved before batch 5 preflight")
          _, open_repo, _ = api("GET", f"/repos/{repo}/pulls?state=open&per_page=100")
          if open_repo: raise RuntimeError(f"Repository has {len(open_repo)} open PR(s)")
          _, refs_before, _ = api("GET", f"/repos/{repo}/git/matching-refs/heads/")

          candidates, rejected = [], []
          for page in range(1, 11):
              _, prs, _ = api("GET", f"/repos/{repo}/pulls?state=closed&sort=updated&direction=desc&per_page=100&page={page}")
              for pr in prs:
                  head = pr.get("head") or {}; hrepo = head.get("repo") or {}
                  branch = head.get("ref"); base = (pr.get("base") or {}).get("ref")
                  if pr.get("merged_at") or hrepo.get("full_name") != repo or not branch or base not in allowed_bases: continue
                  if branch in forbidden_exact or branch.startswith(forbidden_prefixes): continue
                  text = ((pr.get("title") or "")+"\n"+(pr.get("body") or "")).lower()
                  matched = [m for m in markers if m in text]
                  if not matched: continue
                  status, ref, _ = api("GET", f"/repos/{repo}/git/ref/heads/{enc(branch)}", allow_404=True)
                  if status == 404: continue
                  if ref["object"]["sha"] != head.get("sha"):
                      rejected.append({"branch":branch,"pr":pr["number"],"reason":"sha_changed"}); continue
                  bstatus, binfo, _ = api("GET", f"/repos/{repo}/branches/{enc(branch)}", allow_404=True)
                  if bstatus == 404 or binfo.get("protected"):
                      rejected.append({"branch":branch,"pr":pr["number"],"reason":"absent_or_protected"}); continue
                  _, files, _ = api("GET", f"/repos/{repo}/pulls/{pr['number']}/files?per_page=100")
                  names = [f["filename"] for f in files]
                  if not (1 <= len(names) <= 2) or not all(path_allowed(name) for name in names):
                      rejected.append({"branch":branch,"pr":pr["number"],"reason":"path_policy_rejected","files":names}); continue
                  candidates.append({"branch":branch,"pr":pr["number"],"base":base,"sha":head["sha"],"title":pr.get("title", ""),"marker":matched[0],"files":names})
              if len(prs) < 100: break

          unique = {item["branch"]:item for item in candidates}
          candidates = sorted(unique.values(), key=lambda x:x["branch"])
          if len(candidates) > 20: raise RuntimeError(f"Candidate count {len(candidates)} exceeds ceiling")
          report = {"repository":repo,"generatedAt":dt.datetime.now(dt.timezone.utc).isoformat(),"triggerSha":trigger_sha,"state":"PLANNED","policy":"Closed unmerged explicit never-merge PR; unchanged unprotected head; 1-2 files restricted to live-witness/validation/qa verification markers; research/scripts/src excluded.","refCountBefore":len(refs_before),"candidateCount":len(candidates),"candidates":candidates,"rejected":rejected}
          report_sha, plan_commit = put_report(report)

          attempted = []
          for item in candidates:
              branch = item["branch"]
              status, ref, _ = api("GET", f"/repos/{repo}/git/ref/heads/{enc(branch)}", allow_404=True)
              if status == 404:
                  attempted.append({**item,"deleteStatus":"already_absent"}); continue
              if ref["object"]["sha"] != item["sha"]:
                  attempted.append({**item,"deleteStatus":"skipped_sha_changed"}); continue
              _, open_head, _ = api("GET", f"/repos/{repo}/pulls?state=open&head={enc(owner + ':' + branch)}&per_page=100")
              if open_head:
                  attempted.append({**item,"deleteStatus":"skipped_open_pr"}); continue
              code, _, err = api("DELETE", f"/repos/{repo}/git/refs/heads/{enc(branch)}", soft=True)
              attempted.append({**item,"deleteStatus":"delete_requested","httpStatus":code,"error":err})

          time.sleep(4)
          _, refs_after, _ = api("GET", f"/repos/{repo}/git/matching-refs/heads/")
          names_after = {ref["ref"].removeprefix("refs/heads/") for ref in refs_after}
          verified = []
          for item in attempted:
              verified.append({**item,"finalStatus":"remaining" if item["branch"] in names_after else "absent_confirmed"})
          absent_count = sum(1 for item in verified if item["finalStatus"] == "absent_confirmed")
          remaining = [item for item in verified if item["finalStatus"] == "remaining"]
          report.update({"state":"COMPLETE" if not remaining else "COMPLETE_WITH_SKIPS","planCommit":plan_commit,"completedAt":dt.datetime.now(dt.timezone.utc).isoformat(),"results":verified,"absentConfirmedCount":absent_count,"remainingCount":len(remaining),"refCountAfter":len(refs_after)})
          _, final_commit = put_report(report, report_sha)
          print(json.dumps({"candidateCount":len(candidates),"absentConfirmedCount":absent_count,"remainingCount":len(remaining),"refCountBefore":len(refs_before),"refCountAfter":len(refs_after),"reportCommit":final_commit}, ensure_ascii=False, indent=2))
          PY
