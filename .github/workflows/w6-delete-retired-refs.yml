name: W6 delete retired source refs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w6-delete-retired-refs.yml

permissions:
  contents: write
  pull-requests: read

env:
  TEMPORARY_BRANCH: maintenance/w6-delete-retired-refs-v2-20260805
  RETAINED_ARCHIVE_BRANCH: archive/deep-research-local-images-20260724

jobs:
  delete-retired-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight, delete and verify exact source refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          owner = repository.split('/', 1)[0]
          token = os.environ['GH_TOKEN']
          temporary_branch = os.environ['TEMPORARY_BRANCH']
          archive_branch = os.environ['RETAINED_ARCHIVE_BRANCH']

          if os.environ['GITHUB_REF_NAME'] != 'main':
              raise SystemExit(f'wrong execution branch: {os.environ["GITHUB_REF_NAME"]}')

          targets = [
              'agent/marathon-audit-trigger-20260805',
              'agent/marathon-audit-trigger2-20260805',
              'agent/marathon-audit-trigger3-20260805',
              'agent/marathon-audit-trigger4-20260805',
              'agent/marathon-audit-trigger5-20260805',
              'agent/marathon-audit-trigger6-20260805',
              'agent/marathon-audit-trigger7-20260805',
              'agent/marathon-audit-trigger8-20260805',
              'agent/marathon-clean-security-trigger-20260805',
              'agent/marathon-dependency-trigger-20260805',
              'agent/marathon-dependency-trigger2-20260805',
              'agent/marathon-router8-trigger-20260805',
              'agent/marathon-router8-direct-trigger-20260805',
              'agent/marathon-router8-react-compatible-trigger-20260805',
              'agent/marathon-router8-semver-trigger-20260805',
              'audit/discovery-artifact-contract-20260805',
              'audit/content-model-unification-wave2-20260805',
              'audit/immutable-essay-publication-w2-20260805',
              'audit/immutable-essay-publication-20260805',
              'audit/community-scaling-w3-20260805',
              'audit/community-target-scaling-w3-20260805',
              'integration/community-target-scaling-w3-final-20260805',
              'integration/community-w3-hardening-production-20260805',
              'audit/premium-browser-certification-w5-20260805',
              'audit/premium-reader-journeys-w5-20260805',
              'agent/current-state-truth-contract-20260805',
              'arena/019fcf76-thelegendarypoet',
              'arena/019fcf77-thelegendarypoet',
              'work/local-images-playwright-wtoc',
          ]

          protected = {'main', archive_branch, temporary_branch}
          if len(targets) != 29 or len(set(targets)) != 29:
              raise SystemExit('source deletion allowlist must contain exactly 29 unique refs')
          if protected.intersection(targets):
              raise SystemExit('deletion allowlist contains a protected ref')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'tlp-w6-retirement-v2',
          }

          def request(method, url):
              call = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(call) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode('utf-8', errors='replace')

          def ref_url(branch, plural=False):
              encoded = urllib.parse.quote(f'heads/{branch}', safe='')
              noun = 'refs' if plural else 'ref'
              return f'https://api.github.com/repos/{repository}/git/{noun}/{encoded}'

          def open_prs_url(branch):
              query = urllib.parse.urlencode({
                  'state': 'open',
                  'head': f'{owner}:{branch}',
                  'per_page': '2',
              })
              return f'https://api.github.com/repos/{repository}/pulls?{query}'

          archive_status, archive_payload = request('GET', ref_url(archive_branch))
          if archive_status != 200:
              raise SystemExit(f'retained archive ref missing: HTTP {archive_status} {archive_payload}')
          archive_head = archive_payload['object']['sha']

          preflight = []
          for branch in targets:
              status, payload = request('GET', ref_url(branch))
              if status != 200:
                  raise SystemExit(f'preflight ref lookup failed for {branch}: HTTP {status} {payload}')
              head = payload['object']['sha']

              pr_status, pr_payload = request('GET', open_prs_url(branch))
              if pr_status != 200:
                  raise SystemExit(f'open-PR lookup failed for {branch}: HTTP {pr_status} {pr_payload}')
              if pr_payload:
                  numbers = [item.get('number') for item in pr_payload]
                  raise SystemExit(f'open PR still owns {branch}: {numbers}')

              if branch == 'work/local-images-playwright-wtoc' and head != archive_head:
                  raise SystemExit(f'deep work/archive mismatch: work={head}, archive={archive_head}')

              preflight.append({
                  'branch': branch,
                  'headAtDeletion': head,
                  'openPullRequests': 0,
              })

          if len(preflight) != 29:
              raise SystemExit(f'preflight count mismatch: {len(preflight)}')

          deleted = []
          for item in preflight:
              status, payload = request('DELETE', ref_url(item['branch'], plural=True))
              if status != 204:
                  raise SystemExit(f'delete failed for {item["branch"]}: HTTP {status} {payload}')
              deleted.append(item)

          absent = []
          for item in deleted:
              status, payload = request('GET', ref_url(item['branch']))
              if status != 404:
                  raise SystemExit(f'absence verification failed for {item["branch"]}: HTTP {status} {payload}')
              absent.append(item['branch'])

          retained_checks = {}
          for branch in ['main', archive_branch]:
              status, payload = request('GET', ref_url(branch))
              if status != 200:
                  raise SystemExit(f'retained ref missing after deletion: {branch}: HTTP {status} {payload}')
              retained_checks[branch] = payload['object']['sha']

          evidence = {
              'schemaVersion': 2,
              'repository': repository,
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'mainCommitThatTriggeredDeletion': os.environ['GITHUB_SHA'],
              'preflight': preflight,
              'deepWorkArchiveIdentity': {
                  'workBranch': 'work/local-images-playwright-wtoc',
                  'archiveBranch': archive_branch,
                  'sharedHead': archive_head,
              },
              'deletedCount': len(deleted),
              'absentCount': len(absent),
              'absentBranches': absent,
              'retainedRefs': retained_checks,
          }
          Path('w6-source-ref-deletion-evidence-v2.json').write_text(
              json.dumps(evidence, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload source deletion evidence
        uses: actions/upload-artifact@v4
        with:
          name: w6-source-ref-deletion-evidence-v2
          path: w6-source-ref-deletion-evidence-v2.json
          if-no-files-found: error
          retention-days: 90

      - name: Ensure the temporary workflow source branch is absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TEMPORARY_BRANCH']
          encoded = urllib.parse.quote(f'heads/{branch}', safe='')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'tlp-w6-retirement-v2',
          }
          get_url = f'https://api.github.com/repos/{repository}/git/ref/{encoded}'
          delete_url = f'https://api.github.com/repos/{repository}/git/refs/{encoded}'

          try:
              with urllib.request.urlopen(urllib.request.Request(get_url, headers=headers)) as response:
                  if response.status != 200:
                      raise SystemExit(f'temporary branch lookup returned {response.status}')
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print(f'temporary branch already absent: {branch}')
                  raise SystemExit(0)
              raise SystemExit(f'temporary branch lookup failed: HTTP {error.code} {error.read().decode()}')

          try:
              with urllib.request.urlopen(urllib.request.Request(delete_url, method='DELETE', headers=headers)) as response:
                  if response.status != 204:
                      raise SystemExit(f'temporary branch deletion returned {response.status}')
          except urllib.error.HTTPError as error:
              raise SystemExit(f'temporary branch deletion failed: HTTP {error.code} {error.read().decode()}')
          print(f'deleted temporary branch {branch}')
          PY
