name: One-shot Yesenin document evidence

on:
  push:
    branches:
      - fix/yesenin-part-two-document-evidence-20260807
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yesenin-part-two-document-evidence-20260807
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply evidence patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          essay = 'src/data/essays/yeseninPartTwoPublic.ts'
          validator = 'scripts/validate-yesenin-part-two-publication.ts'
          ledger = 'docs/research/YESENIN_PART_II_PUBLICATION_SOURCE_LEDGER_2026-08.md'

          replace_once(essay, "  dateModified: '2026-08-03',", "  dateModified: '2026-08-07',")

          replace_once(
              essay,
              "      sourceIds: ['yes2-letopis-t5-k1', 'yes2-pss-letters-comments'],\n    },\n    {\n      type: 'paragraph',\n      text:\n        'Разрыв с группой не был мгновенным освобождением от её инфраструктуры. Личные, финансовые и издательские связи сохранялись; бывшие союзники продолжали участвовать в публикации и посмертной памяти. Имажинизм объясняет часть литературного поведения Есенина, но не всю его поэзию и не происхождение каждого разрушительного решения.',\n      sourceIds: ['yes2-letopis-t5-k1', 'yes2-contemporary-memoirs-1986'],",
              "      sourceIds: ['yes2-pss-chronology', 'yes2-pss-letters-comments'],\n    },\n    {\n      type: 'paragraph',\n      text:\n        'Разрыв с группой не был мгновенным освобождением от её инфраструктуры. Личные, финансовые и издательские связи сохранялись; бывшие союзники продолжали участвовать в публикации и посмертной памяти. Имажинизм объясняет часть литературного поведения Есенина, но не всю его поэзию и не происхождение каждого разрушительного решения.',\n      sourceIds: ['yes2-pss-chronology', 'yes2-contemporary-memoirs-1986'],"
          )

          replace_once(
              essay,
              "      text:\n        'Галина Бениславская была не только героиней несчастной любви. Она получала и отправляла рукописи, связывалась с редакциями, следила за деньгами и изданиями, помогала семье, устраивала быт и принимала на себя часть кризисов. Её труд делал возможным то, что в библиографии выглядит как самостоятельное движение автора от книги к книге.',\n      sourceIds: ['yes2-letopis-t5-k1', 'yes2-contemporary-memoirs-1986'],",
              "      text:\n        'Галина Бениславская была не только героиней несчастной любви. 12 июня 1924 года Есенин выдал ей формальную доверенность на договор с Госиздатом по «Березовому ситцу»; 1 июля договор № 4581 был заключён по этой доверенности. ПСС печатает доверенность по автографу, а договор — по архивному подлиннику. Это доказывает конкретную юридическую роль Бениславской в издательской работе, но не превращает её в управляющую всеми делами Есенина.',\n      sourceIds: ['yes2-pss-business-documents', 'yes2-pss-chronology'],"
          )
          replace_once(
              essay,
              "      sourceIds: ['yes2-letopis-t5-k1', 'yes2-contemporary-memoirs-1986'],\n    },\n\n    { type: 'section', heading: 'Кавказ и воображаемая Персия' },",
              "      sourceIds: ['yes2-pss-business-documents', 'yes2-contemporary-memoirs-1986'],\n    },\n\n    { type: 'section', heading: 'Кавказ и воображаемая Персия' },"
          )

          replace_once(
              essay,
              "      sourceIds: ['yes2-letopis-t5-k1', 'yes2-pss-poetry-comments'],\n    },\n    {\n      type: 'paragraph',\n      text:\n        '«Персидские мотивы» не доказывают физического присутствия автора в Иране. Планы поездки, литературная география и культурные источники создали поэтическую Персию, но подтверждённый маршрут проходит по Кавказу. Эта граница не уменьшает цикл; напротив, позволяет увидеть работу воображения, не превращая её в туристическую справку.',\n      sourceIds: ['yes2-letopis-t5-k1', 'yes2-pss-poetry-comments'],",
              "      sourceIds: ['yes2-pss-chronology', 'yes2-letopis-t5-k1', 'yes2-pss-poetry-comments'],\n    },\n    {\n      type: 'paragraph',\n      text:\n        '«Персидские мотивы» не доказывают физического присутствия автора в Иране. Планы поездки, литературная география и культурные источники создали поэтическую Персию, но подтверждённый маршрут проходит по Кавказу. Эта граница не уменьшает цикл; напротив, позволяет увидеть работу воображения, не превращая её в туристическую справку.',\n      sourceIds: ['yes2-pss-chronology', 'yes2-letopis-t5-k1', 'yes2-pss-poetry-comments'],"
          )
          replace_once(
              essay,
              "      sourceIds: ['yes2-letopis-t5-k1', 'yes2-pss-poetry-comments'],\n    },\n    {\n      type: 'image',\n      src: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Chagin%20and%20Esenin%201924.jpg',",
              "      sourceIds: ['yes2-pss-chronology', 'yes2-letopis-t5-k1', 'yes2-pss-poetry-comments'],\n    },\n    {\n      type: 'image',\n      src: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Chagin%20and%20Esenin%201924.jpg',"
          )

          replace_once(
              essay,
              "      text:\n        'Брак с Софьей Толстой и подготовка собрания сочинений были попыткой построить другой бытовой и издательский порядок. Не следует изображать этот союз ни гарантированным спасением, ни одной формальностью. Письма показывают практическую связь, напряжение и продолжение дел; они не дают одной формулы для всех чувств и решений пары.',\n      sourceIds: ['yes2-letopis-t5-k1', 'yes2-pss-letters-comments'],",
              "      text:\n        'Брак с Софьей Толстой и подготовка собрания сочинений были попыткой построить другой бытовой и издательский порядок. В наборном экземпляре сохранились списки её рукой; собственная помета Толстой сообщает, что она переписывала стихи во время подготовки Есениным полного собрания для Госиздата, а исправления на листах сделаны его рукой. ПСС также фиксирует тексты, записанные ею под диктовку. Это документирует практическую помощь, но не делает Толстую редактором или соавтором композиции трёхтомника.',\n      sourceIds: ['yes2-pss-manuscript-commentary', 'yes2-letopis-t5-k1'],"
          )
          replace_once(
              essay,
              "      text:\n        'С 26 ноября Есенин находился на лечении. Удостоверение № 1037 подтверждало пребывание в клинике и невозможность участвовать в судебном опросе, но не являлось полной историей болезни. Опубликованное научное издание воспроизводит листы идентифицированной медицинской единицы; отдельного полученного документа, объясняющего механизм окончания лечения 21 декабря, нет. Поэтому статья не утверждает ни формальную выписку, ни побег, ни решение семьи.',\n      sourceIds: ['yes2-letopis-t5-k1', 'yes2-medical-facsimile-1925'],",
              "      text:\n        '26 ноября Есенин был помещён в клинику 1-го МГУ — эту дату Летопись устанавливает по календарной записи Софьи Толстой. 5 декабря заведена «История болезни» Поликлиники 1-го МГУ, сохранившаяся в ИМЛИ (ф. 32, оп. 2, ед. хр. 37) и опубликованная с факсимиле. 21 декабря календарь Толстой фиксирует сам выход из клиники. Эти источники устанавливают пребывание и факт выхода, но не объясняют административный или медицинский механизм окончания лечения; поэтому статья не называет событие ни формальной выпиской, ни побегом, ни решением семьи и не превращает один общеклинический лист в полную психиатрическую историю.',\n      sourceIds: ['yes2-letopis-t5-k1', 'yes2-medical-facsimile-1925', 'yes2-imli-death-documents-2003'],"
          )
          replace_once(
              essay,
              "      text:\n        'Во время лечения продолжались письма, работа над стихами, финансовые и издательские поручения. Практическая деятельность не доказывает выздоровления; тяжесть кризиса не стирает практическую деятельность. Это важная граница для последнего месяца: планы и риск могут существовать одновременно.',\n      sourceIds: ['yes2-letopis-t5-k1', 'yes2-pss-letters-comments'],",
              "      text:\n        '16 декабря ординатор А. Я. Аронсон, которого Летопись называет лечащим врачом Есенина, расписался в получении ста рублей поэта на личные расходы. Это документирует конкретный врачебный контакт; поздние пересказы разговоров не дают права автоматически приписывать Аронсону или П. Б. Ганнушкину конкретный диагноз, прогноз или схему лечения. Одновременно продолжались письма, работа над стихами и издательские поручения: практическая деятельность не доказывает выздоровления, а тяжесть кризиса не стирает практическую деятельность.',\n      sourceIds: ['yes2-aronson-receipt-1925-12-16', 'yes2-letopis-t5-k1'],"
          )

          source_anchor = "    {\n      id: 'yes2-letopis-t5-k1',"
          source_insert = "    {\n      id: 'yes2-pss-chronology',\n      title: 'Хронологическая канва жизни и творчества Сергея Александровича Есенина (1895–1925)',\n      url: 'https://www.museum-esenin.ru/esenin/biografiya',\n      kind: 'research',\n      institution: 'Государственный музей-заповедник С. А. Есенина / академическое ПСС ИМЛИ РАН',\n      note: 'Институциональное воспроизведение академической хронологической канвы; используется как 1924-capable cross-check, а не как замена page-level Летописи.',\n    },\n"
          p = Path(essay)
          text = p.read_text(encoding='utf-8')
          if text.count(source_anchor) != 1:
              raise SystemExit('chronology source insertion anchor mismatch')
          p.write_text(text.replace(source_anchor, source_insert + source_anchor, 1), encoding='utf-8')

          pss_anchor = "    {\n      id: 'yes2-pss-poetry-comments',"
          pss_insert = "    {\n      id: 'yes2-pss-business-documents',\n      title: 'С. А. Есенин. ПСС, т. 7, кн. 2: деловые бумаги и комментарии к издательским документам',\n      url: 'https://feb-web.ru/feb/esenin/texts/e72/e72-266-.htm?cmd=p',\n      kind: 'primary',\n      institution: 'ФЭБ / ИМЛИ РАН',\n      year: 2000,\n      note: 'Автограф доверенности Бениславской, подлинники издательских договоров и точное различение сохранившихся оригиналов и текстов, известных только по первой публикации.',\n    },\n    {\n      id: 'yes2-pss-manuscript-commentary',\n      title: 'С. А. Есенин. ПСС, т. 1: комментарии к наборному экземпляру «Собрания стихотворений» 1925 года',\n      url: 'https://feb-web.ru/feb/esenin/texts/es1/es1-385-.htm?cmd=p',\n      kind: 'primary',\n      institution: 'ФЭБ / ИМЛИ РАН',\n      year: 1995,\n      note: 'Рукописная provenance: списки Софьи Толстой-Есениной, авторские правки Есенина и тексты, записанные под диктовку; не переносит авторство композиции на переписчицу.',\n    },\n"
          text = p.read_text(encoding='utf-8')
          if text.count(pss_anchor) != 1:
              raise SystemExit('PSS source insertion anchor mismatch')
          p.write_text(text.replace(pss_anchor, pss_insert + pss_anchor, 1), encoding='utf-8')

          med_anchor = "    {\n      id: 'yes2-power-attorney-1925-12-27',"
          med_insert = "    {\n      id: 'yes2-aronson-receipt-1925-12-16',\n      title: 'Расписка ординатора А. Я. Аронсона от 16 декабря 1925 года',\n      url: 'https://biblio.imli.ru/index.php/component/abook/book/826-letopis-zhizni-i-tvorchestva-s-a-esenina-tom-5?Itemid=0&catid=527%3Aesenin-s-a',\n      kind: 'primary',\n      institution: 'ГЛМ, ф. 4, оп. 1, ед. хр. 339 / публикация ИМЛИ РАН',\n      year: 1925,\n      note: 'Подписанная расписка документирует прямой контакт с ординатором, которого Летопись называет лечащим врачом; не устанавливает диагноз или схему лечения.',\n    },\n"
          text = p.read_text(encoding='utf-8')
          if text.count(med_anchor) != 1:
              raise SystemExit('Aronson source insertion anchor mismatch')
          p.write_text(text.replace(med_anchor, med_insert + med_anchor, 1), encoding='utf-8')

          replace_once(
              essay,
              "      title: 'Медицинская единица клинического периода Есенина, ноябрь–декабрь 1925 года',\n      kind: 'archive',\n      institution: 'ИМЛИ РАН, опубликованное факсимиле идентифицированной единицы хранения',\n      year: 1925,\n      note: 'Подтверждает медицинский документальный слой, но не устанавливает отдельным листом механизм окончания лечения 21 декабря.',",
              "      title: '«История болезни» Поликлиники 1-го МГУ от 5 декабря 1925 года',\n      kind: 'archive',\n      institution: 'ИМЛИ РАН, ф. 32, оп. 2, ед. хр. 37 · опубликованное факсимиле',\n      year: 1925,\n      note: 'Сохранившийся общеклинический документ; не объявляется полной психиатрической стационарной картой и не доказывает сам по себе механизм выхода 21 декабря.',"
          )

          replace_once(
              validator,
              "  'механизм окончания лечения 21 декабря',",
              "  'не объясняют административный или медицинский механизм окончания лечения',"
          )
          replace_once(
              validator,
              "  /клиника[^.]{0,100}точный диагноз/iu,\n  /вне всяких сомнений[^.]{0,100}предсмертн/iu,",
              "  /клиника[^.]{0,100}точный диагноз/iu,\n  /удостоверение\\s*№\\s*1037/iu,\n  /Ганнушкин[^.]{0,100}(?:поставил диагноз|диагностировал|лечил Есенина|лечащий врач Есенина)/iu,\n  /вне всяких сомнений[^.]{0,100}предсмертн/iu,"
          )
          replace_once(
              validator,
              "  'yes2-letopis-t5-k1': /^https:\\/\\/biblio\\.imli\\.ru\\//,\n  'yes2-duncan-russian-days-1929-tu': /^https:\\/\\/dl\\.tufts\\.edu\\//,",
              "  'yes2-letopis-t5-k1': /^https:\\/\\/biblio\\.imli\\.ru\\//,\n  'yes2-pss-chronology': /^https:\\/\\/www\\.museum-esenin\\.ru\\//,\n  'yes2-pss-business-documents': /^https:\\/\\/feb-web\\.ru\\//,\n  'yes2-pss-manuscript-commentary': /^https:\\/\\/feb-web\\.ru\\//,\n  'yes2-aronson-receipt-1925-12-16': /^https:\\/\\/biblio\\.imli\\.ru\\//,\n  'yes2-duncan-russian-days-1929-tu': /^https:\\/\\/dl\\.tufts\\.edu\\//,"
          )

          temporal_anchor = "let citationCount = 0;\n"
          temporal_guard = "const sourceCoverage1924 = new Set([\n  'yes2-pss-chronology',\n  'yes2-pss-business-documents',\n  'yes2-pss-poetry-comments',\n  'yes2-pss-letters-comments',\n  'yes2-contemporary-memoirs-1986',\n]);\nfor (const [index, block] of essay.blocks.entries()) {\n  if (!('sourceIds' in block) || !block.sourceIds?.length) continue;\n  const searchable = block.type === 'note'\n    ? `${block.claim} ${block.text}`\n    : 'text' in block && typeof block.text === 'string'\n      ? block.text\n      : '';\n  if (!/\\b1924(?:–1925)?\\b/u.test(searchable)) continue;\n  if (block.sourceIds.includes('yes2-letopis-t5-k1') && !block.sourceIds.some((id) => sourceCoverage1924.has(id))) {\n    throw new Error(\n      `block ${index + 1} cites the 1925-only Letopis for an explicit 1924 claim without a 1924-capable companion source`,\n    );\n  }\n}\n\n"
          p = Path(validator)
          text = p.read_text(encoding='utf-8')
          if text.count(temporal_anchor) != 1:
              raise SystemExit('temporal guard anchor mismatch')
          p.write_text(text.replace(temporal_anchor, temporal_guard + temporal_anchor, 1), encoding='utf-8')

          replace_once(
              validator,
              "  '## yes2-letopis-t5-k1',\n  '## yes2-duncan-russian-days-1929-tu',",
              "  '## yes2-letopis-t5-k1',\n  '## yes2-pss-chronology',\n  '## yes2-pss-business-documents',\n  '## yes2-pss-manuscript-commentary',\n  '## yes2-aronson-receipt-1925-12-16',\n  '## yes2-duncan-russian-days-1929-tu',"
          )

          replace_once(ledger, '**Обновлено:** 4 августа 2026 года', '**Обновлено:** 7 августа 2026 года')

          replace_once(
              ledger,
              "## yes2-letopis-t5-k1\n",
              "## yes2-pss-chronology\n\n**Источник:** «Хронологическая канва жизни и творчества Сергея Александровича Есенина (1895–1925)» — институциональное воспроизведение академической канвы ПСС.  \n**Карточка:** https://www.museum-esenin.ru/esenin/biografiya  \n**Использование:** 1924-capable хронологический cross-check, пока полный том 4 «Летописи» не приобретён как проверенный бинарник.  \n**Граница:** компактная канва не заменяет page-level доказательство полного тома «Летописи»; точные спорные утверждения продолжают проверяться по ПСС, письмам и документам.\n\n## yes2-letopis-t5-k1\n"
          )

          replace_once(
              ledger,
              "## yes2-pss-poetry-comments\n",
              "## yes2-pss-business-documents\n\n**Источник:** С. А. Есенин. ПСС, т. 7, кн. 2 — деловые бумаги и комментарии к издательским документам.  \n**ФЭБ:** https://feb-web.ru/feb/esenin/texts/e72/e72-266-.htm?cmd=p  \n**Проверено:** доверенность Бениславской от 12 июня 1924 печатается по автографу (РГАЛИ, ф. 190, оп. 1, ед. хр. 11, л. 3); договор № 4581 от 1 июля — по подлиннику (л. 2); договор № 7604 от 30 июня 1925 — по подлиннику (л. 9).  \n**Граница:** заявление 17 июня 1925 известно по первой публикации; его автограф в академическом комментарии не выявлен. Оригиналы и first-publication-only тексты не сливаются в один evidence class.\n\n## yes2-pss-manuscript-commentary\n\n**Источник:** С. А. Есенин. ПСС, т. 1 — комментарии к наборному экземпляру «Собрания стихотворений» 1925 года.  \n**ФЭБ:** https://feb-web.ru/feb/esenin/texts/es1/es1-385-.htm?cmd=p  \n**Использование:** рукописная provenance роли Софьи Толстой-Есениной: списки её рукой, тексты под диктовку и авторская правка Есенина.  \n**Граница:** документированная помощь в переписывании и передаче правки не превращается в редакторское или композиционное соавторство.\n\n## yes2-pss-poetry-comments\n"
          )

          replace_once(
              ledger,
              "## yes2-power-attorney-1925-12-27\n",
