name: Yesenin Duncan safe publication

on:
  push:
    branches:
      - publish/yesenin-duncan-safe-companion
    paths:
      - 'src/data/essays/yeseninDuncanFirstMeeting.ts'
      - 'src/data/essays/index.ts'
      - 'scripts/validate-yesenin-duncan-safe-publication.ts'
      - '.github/workflows/yesenin-duncan-safe-publication.yml'
  pull_request:
    paths:
      - 'src/data/essays/yeseninDuncanFirstMeeting.ts'
      - 'src/data/essays/index.ts'
      - 'scripts/validate-yesenin-duncan-safe-publication.ts'
      - '.github/workflows/yesenin-duncan-safe-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Validate publication boundary
        run: npx tsx scripts/validate-yesenin-duncan-safe-publication.ts
      - name: Validate all essays
        run: npm run validate:essays
      - name: Validate citation topology
        run: npm run validate:citations
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        id: production-build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build > /tmp/yesenin-duncan-build.log 2>&1
          exit_code=$?
          echo "$exit_code" > /tmp/yesenin-duncan-build.exit
          tail -n 120 /tmp/yesenin-duncan-build.log
          exit "$exit_code"
      - name: Upload production build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-duncan-production-build
          path: |
            /tmp/yesenin-duncan-build.log
            /tmp/yesenin-duncan-build.exit
          if-no-files-found: error
          retention-days: 14
      - name: Require successful production build
        if: steps.production-build.outcome != 'success'
        run: exit 1
      - name: Regenerate sitemap
        run: npm run sitemap
      - name: Require public route in sitemap
        run: grep -F 'https://thelegendarypoet.ru/essays/yesenin-duncan-first-meeting-documents' public/sitemap.xml
