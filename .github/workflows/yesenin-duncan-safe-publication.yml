name: Yesenin Duncan safe publication

on:
  push:
    branches:
      - publish/yesenin-duncan-safe-companion
    paths:
      - 'src/data/essays/yeseninDuncanFirstMeeting.ts'
      - 'src/data/essays/index.ts'
      - 'scripts/validate-yesenin-duncan-safe-publication.ts'
      - '.github/workflows/yesenin-duncan-safe-publication.yml'
  pull_request:
    paths:
      - 'src/data/essays/yeseninDuncanFirstMeeting.ts'
      - 'src/data/essays/index.ts'
      - 'scripts/validate-yesenin-duncan-safe-publication.ts'
      - '.github/workflows/yesenin-duncan-safe-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Validate publication boundary
        run: npx tsx scripts/validate-yesenin-duncan-safe-publication.ts
      - name: Validate all essays
        run: npm run validate:essays
      - name: Validate citation topology
        run: npm run validate:citations
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/yesenin-duncan-build.log 2>&1
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo '--- production build failure (last 120 lines) ---'
            tail -n 120 /tmp/yesenin-duncan-build.log
            exit "$exit_code"
          fi
          tail -n 40 /tmp/yesenin-duncan-build.log
      - name: Regenerate sitemap
        run: npm run sitemap
      - name: Require public route in sitemap
        run: grep -F 'https://thelegendarypoet.ru/essays/yesenin-duncan-first-meeting-documents' public/sitemap.xml
