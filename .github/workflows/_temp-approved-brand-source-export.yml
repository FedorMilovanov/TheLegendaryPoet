name: Temporary Approved Brand Source Export

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/_temp-approved-brand-source-export.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/brand-complete-integrity-20260725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/brand-complete-integrity-20260725

      - name: Decode and inspect approved deterministic sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p approved-brand-source
          for pair in \
            'master-320-q92.webp.b64:brand-emblem-master.webp' \
            'favicon-16.png.b64:favicon-16.png' \
            'favicon-32.png.b64:favicon-32.png'; do
            source_name="${pair%%:*}"
            output_name="${pair##*:}"
            tr -d '[:space:]' < "src/brand-assets/${source_name}" | base64 --decode > "approved-brand-source/${output_name}"
          done
          sha256sum approved-brand-source/brand-emblem-master.webp approved-brand-source/favicon-16.png approved-brand-source/favicon-32.png > approved-brand-source/sha256.txt
          file approved-brand-source/brand-emblem-master.webp approved-brand-source/favicon-16.png approved-brand-source/favicon-32.png > approved-brand-source/file.txt
          wc -c approved-brand-source/brand-emblem-master.webp approved-brand-source/favicon-16.png approved-brand-source/favicon-32.png > approved-brand-source/sizes.txt
          cat approved-brand-source/sha256.txt
          cat approved-brand-source/file.txt
          cat approved-brand-source/sizes.txt

      - name: Inventory clean-checkout platform and share assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-brand-art.mjs
          required=(
            public/brand-emblem-master.webp
            public/favicon-16.png
            public/favicon-32.png
            public/apple-touch-icon.png
            public/icon-192.png
            public/icon-512.png
            public/icon-maskable-512.png
            public/mstile-150x150.png
            public/og-image.jpg
          )
          : > approved-brand-source/present-required.txt
          : > approved-brand-source/missing-required.txt
          for file in "${required[@]}"; do
            if [[ -f "$file" ]]; then
              printf '%s\n' "$file" >> approved-brand-source/present-required.txt
              sha256sum "$file" >> approved-brand-source/full-checkout-sha256.txt
              file "$file" >> approved-brand-source/full-checkout-file.txt
              wc -c "$file" >> approved-brand-source/full-checkout-sizes.txt
            else
              printf '%s\n' "$file" >> approved-brand-source/missing-required.txt
            fi
          done
          echo 'Present:'
          cat approved-brand-source/present-required.txt
          echo 'Missing:'
          cat approved-brand-source/missing-required.txt

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: approved-brand-source-export
          path: approved-brand-source
          if-no-files-found: error
          retention-days: 3
