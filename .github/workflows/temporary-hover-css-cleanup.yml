name: Temporary hover CSS cleanup

on:
  push:
    branches: [agent/remove-legacy-hover-css]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-hover-css
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove superseded hover rules
        run: node scripts/cleanup-legacy-hover-css.mjs
      - name: Commit cleaned stylesheet
        run: |
          if git diff --quiet -- src/index.css; then
            echo "No cleanup diff produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          git commit -m "refactor(ui): remove superseded hover rules"
          git push origin HEAD:agent/remove-legacy-hover-css
