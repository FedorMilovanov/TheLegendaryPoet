name: Simonov hero transfer

on:
  push:
    branches:
      - editorial/simonov-son-artillerista-essay
    paths:
      - '.github/workflows/simonov-hero-transfer.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch approved full-resolution hero
        shell: bash
        run: |
          set -euo pipefail
          url='https://media.canva.com/v2/image-resize/format:WEBP/height:900/quality:82/uri:ifs%3A%2F%2FM%2F11537666-f412-401b-911c-319071de0d88/watermark:F/width:1600?csig=AAAAAAAAAAAAAAAAAAAAAFyO-WrlhtINSEpSru2ymCCxP0b4ocQkA_JnZnXy1N99&exp=1787194697&osig=AAAAAAAAAAAAAAAAAAAAAIBjp2x8KFcu2mV7q7QgMyEyqyzBHfMOYnVe-yZEXAYd&signer=media-rpc&x-canva-quality=thumbnail'
          curl --fail --location --silent --show-error --retry 2 "$url" --output /tmp/simonov-hero.webp
          bytes=$(wc -c < /tmp/simonov-hero.webp)
          echo "downloaded bytes=$bytes"
          sha256sum /tmp/simonov-hero.webp
          file /tmp/simonov-hero.webp
          test "$bytes" -ge 80000
          test "$bytes" -le 500000
          test "$(head -c 4 /tmp/simonov-hero.webp)" = 'RIFF'
          test "$(dd if=/tmp/simonov-hero.webp bs=1 skip=8 count=4 status=none)" = 'WEBP'
          mkdir -p public/images/essays/simonov
          cp /tmp/simonov-hero.webp public/images/essays/simonov/simonov-son-artillerista-hero.webp

      - name: Commit exact transferred asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/essays/simonov/simonov-son-artillerista-hero.webp
          if git diff --cached --quiet; then
            echo 'Hero already matches transferred asset.'
            exit 0
          fi
          git commit -m 'fix(simonov): replace corrupted hero with full-resolution asset'
          git push origin HEAD:${GITHUB_REF_NAME}
