name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub App commits do not always emit a push workflow. After a successful
  # CI run on a guarded same-repository deploy-live-* branch, workflow_run uses
  # the trusted workflow from main and publishes that exact tested commit.
  workflow_run:
    workflows: [CI]
    types: [completed]

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'deploy-live-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For the guarded workflow_run path, publish the exact commit that
          # passed CI rather than the current tip of any mutable branch.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate content, literary style, and types
        run: npm run check

      - name: Generate sitemap
        run: npm run sitemap

      - name: Build
        run: npm run build
        env:
          # The custom domain serves the Pages artifact from the site root.
          VITE_BASE: /
          # Optional shared comments/ratings backend (Supabase). Leave the repo
          # Variables unset to keep the local-only store. The anon key is public
          # by design (protected by Row Level Security) — repo Variables, not
          # Secrets, so Vite can inline it at build time. See docs/COMMENTS_SETUP.md.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Prerender OG pages (essays, poets, articles)
        run: npm run prerender

      - name: SPA fallback (serve the app for deep links / refresh)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify approved emblem on published domain
        shell: bash
        run: |
          set -euo pipefail
          expected='3022d9f142bd0705a639b373c7fae995d42df00ac865440f270823adb2dc0c8d'
          version='cloak-20260725-2'
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_RUN_ID}-${attempt}"
            html="$(curl -fsSL --connect-timeout 10 --max-time 30 "https://thelegendarypoet.ru/?brand-check=${stamp}" || true)"
            if printf '%s' "$html" | grep -q "brand-emblem-master.webp?v=${version}"; then
              curl -fsSL --connect-timeout 10 --max-time 30 \
                "https://thelegendarypoet.ru/brand-emblem-master.webp?v=${stamp}" \
                -o live-brand.webp
              actual="$(sha256sum live-brand.webp | cut -d' ' -f1)"
              if [ "$actual" = "$expected" ]; then
                echo "Published emblem verified: ${actual}"
                exit 0
              fi
              echo "Attempt ${attempt}: new HTML, asset hash ${actual}"
            else
              echo "Attempt ${attempt}: waiting for new HTML"
            fi
            sleep 10
          done
          echo "Published domain did not expose the approved emblem" >&2
          exit 1
