name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      status_sha:
        description: Optional commit SHA that requested this trusted main deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mark requested Pages deployment pending
        if: inputs.status_sha != ''
        uses: actions/github-script@v7
        env:
          STATUS_SHA: ${{ inputs.status_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'pages/deploy',
              description: 'Trusted main deployment is building',
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate content, literary style, and types
        run: npm run check

      - name: Generate sitemap
        run: npm run sitemap

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Prerender OG pages (essays, poets, articles)
        run: npm run prerender

      - name: SPA fallback (serve the app for deep links / refresh)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify approved emblem on published domain
        shell: bash
        run: |
          set -euo pipefail
          expected='3022d9f142bd0705a639b373c7fae995d42df00ac865440f270823adb2dc0c8d'
          version='cloak-20260725-2'
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_RUN_ID}-${attempt}"
            html="$(curl -fsSL --connect-timeout 10 --max-time 30 "https://thelegendarypoet.ru/?brand-check=${stamp}" || true)"
            if printf '%s' "$html" | grep -q "brand-emblem-master.webp?v=${version}"; then
              curl -fsSL --connect-timeout 10 --max-time 30 \
                "https://thelegendarypoet.ru/brand-emblem-master.webp?v=${stamp}" \
                -o live-brand.webp
              actual="$(sha256sum live-brand.webp | cut -d' ' -f1)"
              if [ "$actual" = "$expected" ]; then
                echo "Published emblem verified: ${actual}"
                exit 0
              fi
              echo "Attempt ${attempt}: new HTML, asset hash ${actual}"
            else
              echo "Attempt ${attempt}: waiting for new HTML"
            fi
            sleep 10
          done
          echo "Published domain did not expose the approved emblem" >&2
          exit 1

  report:
    if: always() && inputs.status_sha != ''
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish observable Pages result
        uses: actions/github-script@v7
        env:
          STATUS_SHA: ${{ inputs.status_sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const ok = process.env.BUILD_RESULT === 'success' && process.env.DEPLOY_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: ok ? 'success' : 'failure',
              context: 'pages/deploy',
              description: ok
                ? 'Published domain matches the approved emblem'
                : `Pages failed: build=${process.env.BUILD_RESULT}, deploy=${process.env.DEPLOY_RESULT}`.slice(0, 140),
            });
