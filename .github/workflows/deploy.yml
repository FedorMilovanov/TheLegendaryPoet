name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact same-repository PR head to build
        required: false
        type: string
      status_sha:
        description: Optional commit SHA that requested this trusted deployment
        required: false
        type: string
      pr_number:
        description: Optional pull request number for deployment diagnostics
        required: false
        type: string
      expected_version:
        description: Optional release id read from the exact PR head
        required: false
        type: string
      expected_source_sha256:
        description: Optional approved source SHA-256 read from the exact PR head
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      verify_brand: ${{ steps.release.outputs.verify_brand }}
      release_version: ${{ steps.release.outputs.release_version }}
      source_sha256: ${{ steps.release.outputs.source_sha256 }}
      runtime_sha256: ${{ steps.release.outputs.runtime_sha256 }}
      release_sha256: ${{ steps.release.outputs.release_sha256 }}
    steps:
      - name: Validate requested release provenance
        if: inputs.source_sha != ''
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          STATUS_SHA: ${{ inputs.status_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const sourceSha = process.env.SOURCE_SHA || '';
            const statusSha = process.env.STATUS_SHA || '';
            const prNumber = Number(process.env.PR_NUMBER || '0');
            if (!/^[a-f0-9]{40}$/.test(sourceSha) || sourceSha !== statusSha || !Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('Invalid exact-head deployment inputs');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const valid = pr.state === 'open'
              && pr.base.ref === 'main'
              && pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
              && pr.head.ref.startsWith('deploy-live-')
              && pr.head.sha === sourceSha;
            if (!valid) {
              core.setFailed('Requested SHA is not the current head of an open trusted deploy-live PR targeting main');
            }

      - name: Mark requested Pages deployment pending
        if: inputs.status_sha != ''
        uses: actions/github-script@v7
        env:
          STATUS_SHA: ${{ inputs.status_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'pages/deploy',
              description: 'Trusted exact-head deployment is building',
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out provenance
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ -n "${EXPECTED_SOURCE_SHA}" && "${actual}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "::error::Checked out ${actual}, expected ${EXPECTED_SOURCE_SHA}"
            exit 1
          fi
          echo "Building exact source ${actual}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install FFmpeg for deterministic generated assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Validate content, literary style, brand assets, and types
        run: npm run check

      - name: Generate sitemap and Atom feed
        run: npm run seo:generate

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_YANDEX_METRIKA_ID: ${{ vars.VITE_YANDEX_METRIKA_ID }}

      - name: Prerender canonical pages and 404
        run: npm run prerender

      - name: Validate production SEO output
        run: npm run validate:seo-output

      - name: Resolve and verify release proof
        id: release
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
        run: |
          set -euo pipefail
          version=""
          source_sha=""
          runtime_sha=""
          release_sha=""

          if [[ -f dist/brand-release.txt ]]; then
            mapfile -t lines < dist/brand-release.txt
            if [[ "${#lines[@]}" -ne 4 \
              || ! "${lines[0]}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]+$ \
              || ! "${lines[1]}" =~ ^approved-source=[A-Za-z0-9][A-Za-z0-9._-]+$ \
              || ! "${lines[2]}" =~ ^source-sha256=[a-f0-9]{64}$ \
              || "${lines[3]}" != "roles=single" ]]; then
              echo "::error::dist/brand-release.txt has an invalid single-source contract"
              exit 1
            fi

            version="${lines[0]}"
            source_sha="${lines[2]#source-sha256=}"

            if [[ -n "${EXPECTED_VERSION}" && "${version}" != "${EXPECTED_VERSION}" ]]; then
              echo "::error::Release id ${version} does not match dispatched ${EXPECTED_VERSION}"
              exit 1
            fi
            if [[ -n "${EXPECTED_SOURCE_SHA256}" && "${source_sha}" != "${EXPECTED_SOURCE_SHA256}" ]]; then
              echo "::error::Source SHA does not match dispatched release metadata"
              exit 1
            fi

            approved_source_sha="$(
              cat qa/reference/approved-brand/final-reference.part*.b64 \
                | tr -d '[:space:]' \
                | base64 --decode \
                | sha256sum \
                | awk '{print $1}'
            )"
            if [[ "${approved_source_sha}" != "${source_sha}" ]]; then
              echo "::error::Approved source fragments do not match brand-release.txt"
              exit 1
            fi

            grep -Fq "name=\"brand-release\" content=\"${version}\"" dist/index.html
            test -f dist/brand-emblem.png
            test ! -e dist/brand-emblem-master.webp
            test ! -e dist/brand-emblem.svg

            runtime_sha="$(sha256sum dist/brand-emblem.png | awk '{print $1}')"
            release_sha="$(sha256sum dist/brand-release.txt | awk '{print $1}')"

            echo "Verified approved source ${source_sha} and built runtime ${runtime_sha} for ${version}"
            echo "verify_brand=true" >> "$GITHUB_OUTPUT"
            echo "release_version=${version}" >> "$GITHUB_OUTPUT"
            echo "source_sha256=${source_sha}" >> "$GITHUB_OUTPUT"
            echo "runtime_sha256=${runtime_sha}" >> "$GITHUB_OUTPUT"
            echo "release_sha256=${release_sha}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${SOURCE_SHA}" ]]; then
            echo "::error::Exact-head release requests must publish dist/brand-release.txt"
            exit 1
          else
            echo "verify_brand=false" >> "$GITHUB_OUTPUT"
            echo "release_version=" >> "$GITHUB_OUTPUT"
            echo "source_sha256=" >> "$GITHUB_OUTPUT"
            echo "runtime_sha256=" >> "$GITHUB_OUTPUT"
            echo "release_sha256=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify custom domain release proof
        if: needs.build.outputs.verify_brand == 'true'
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.release_version }}
          EXPECTED_RUNTIME_SHA256: ${{ needs.build.outputs.runtime_sha256 }}
          EXPECTED_RELEASE_SHA256: ${{ needs.build.outputs.release_sha256 }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            nonce="${GITHUB_RUN_ID}-${attempt}"
            rm -f /tmp/brand-release.txt /tmp/brand-emblem.png

            curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "https://thelegendarypoet.ru/brand-release.txt?verify=${nonce}" \
              -o /tmp/brand-release.txt || true
            html="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "https://thelegendarypoet.ru/?brand_verify=${nonce}" || true)"

            if [[ -f /tmp/brand-release.txt ]] \
              && echo "${EXPECTED_RELEASE_SHA256}  /tmp/brand-release.txt" | sha256sum -c - \
              && grep -Fq "name=\"brand-release\" content=\"${EXPECTED_VERSION}\"" <<<"${html}"; then
              curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
                "https://thelegendarypoet.ru/brand-emblem.png?v=${EXPECTED_VERSION}&verify=${nonce}" \
                -o /tmp/brand-emblem.png
              echo "${EXPECTED_RUNTIME_SHA256}  /tmp/brand-emblem.png" | sha256sum -c -
              echo "Verified ${EXPECTED_VERSION} and its exact built runtime on the custom domain"
              exit 0
            fi

            sleep 10
          done

          echo "::error::Custom domain did not serve ${EXPECTED_VERSION} with the exact built runtime within six minutes"
          exit 1

  report:
    if: always() && inputs.status_sha != ''
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish observable Pages result
        uses: actions/github-script@v7
        env:
          STATUS_SHA: ${{ inputs.status_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        with:
          script: |
            const ok = process.env.BUILD_RESULT === 'success' && process.env.DEPLOY_RESULT === 'success';
            const release = process.env.RELEASE_VERSION || 'requested exact head';
            const description = ok
              ? `Published ${release}`.slice(0, 140)
              : `Pages failed: build=${process.env.BUILD_RESULT}, deploy=${process.env.DEPLOY_RESULT}`.slice(0, 140);
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: ok ? 'success' : 'failure',
              context: 'pages/deploy',
              description,
              target_url: targetUrl,
            });
            if (process.env.PR_NUMBER) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body: [
                  `### Pages deployment ${ok ? 'succeeded' : 'failed'}`,
                  `- Build: **${process.env.BUILD_RESULT}**`,
                  `- Deploy + live verification: **${process.env.DEPLOY_RESULT}**`,
                  `- Workflow run: ${targetUrl}`,
                  `- Requested SHA: \`${process.env.STATUS_SHA}\``,
                  `- Release: \`${release}\``,
                ].join('\n'),
              });
            }
