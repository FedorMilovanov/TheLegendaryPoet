name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      status_sha:
        description: Optional commit SHA that requested this trusted main deployment
        required: false
        type: string
      pr_number:
        description: Optional pull request number for deployment diagnostics
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mark requested Pages deployment pending
        if: inputs.status_sha != ''
        uses: actions/github-script@v7
        env:
          STATUS_SHA: ${{ inputs.status_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'pages/deploy',
              description: 'Trusted main deployment is building',
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install FFmpeg for deterministic brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Validate content, literary style, brand assets, and types
        run: npm run check

      - name: Generate sitemap
        run: npm run sitemap

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Prerender OG pages
        run: npm run prerender

      - name: Verify build contains the exact approved brand release
        env:
          EXPECTED_VERSION: cloak-20260725-3
          EXPECTED_MASTER_SHA256: 3022d9f142bd0705a639b373c7fae995d42df00ac865440f270823adb2dc0c8d
        run: |
          set -euo pipefail
          grep -Fq "name=\"brand-release\" content=\"${EXPECTED_VERSION}\"" dist/index.html
          expected_release="${EXPECTED_VERSION}"$'\n'"master-sha256=${EXPECTED_MASTER_SHA256}"
          test "$(cat dist/brand-release.txt)" = "${expected_release}"
          echo "${EXPECTED_MASTER_SHA256}  dist/brand-emblem-master.webp" | sha256sum -c -
          grep -Fq "brand-emblem-master.webp?v=${EXPECTED_VERSION}" dist/brand-emblem.svg
          ! grep -Eq '<(path|circle|ellipse|polygon|polyline)([[:space:]>])' dist/brand-emblem.svg
          test ! -e dist/favicon.svg

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the custom domain serves the approved emblem release
        env:
          EXPECTED_VERSION: cloak-20260725-3
          EXPECTED_MASTER_SHA256: 3022d9f142bd0705a639b373c7fae995d42df00ac865440f270823adb2dc0c8d
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            nonce="${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
            echo "Live verification attempt ${attempt}/36"

            release="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "https://thelegendarypoet.ru/brand-release.txt?verify=${nonce}" || true)"
            html="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "https://thelegendarypoet.ru/?brand_verify=${nonce}" || true)"

            expected_release="${EXPECTED_VERSION}"$'\n'"master-sha256=${EXPECTED_MASTER_SHA256}"
            if [[ "${release}" == "${expected_release}" ]] \
              && grep -Fq "name=\"brand-release\" content=\"${EXPECTED_VERSION}\"" <<<"${html}"; then
              curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
                "https://thelegendarypoet.ru/brand-emblem-master.webp?v=${EXPECTED_VERSION}&verify=${nonce}" \
                -o /tmp/brand-emblem-master.webp
              echo "${EXPECTED_MASTER_SHA256}  /tmp/brand-emblem-master.webp" | sha256sum -c -

              svg="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
                "https://thelegendarypoet.ru/brand-emblem.svg?verify=${nonce}")"
              grep -Fq "brand-emblem-master.webp?v=${EXPECTED_VERSION}" <<<"${svg}"
              if grep -Eq '<(path|circle|ellipse|polygon|polyline)([[:space:]>])' <<<"${svg}"; then
                echo "Standalone SVG still contains a retired substitute character"
              else
                echo "Verified ${EXPECTED_VERSION} on the custom domain with the approved master SHA-256"
                exit 0
              fi
            fi

            sleep 10
          done

          echo "::error::Pages deployed, but the custom domain did not serve ${EXPECTED_VERSION} with the approved emblem within six minutes."
          exit 1

  report:
    if: always() && inputs.status_sha != ''
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish observable Pages result
        uses: actions/github-script@v7
        env:
          STATUS_SHA: ${{ inputs.status_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const ok = process.env.BUILD_RESULT === 'success' && process.env.DEPLOY_RESULT === 'success';
            const description = ok
              ? 'Published domain matches approved emblem v3'
              : `Pages failed: build=${process.env.BUILD_RESULT}, deploy=${process.env.DEPLOY_RESULT}`.slice(0, 140);
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: ok ? 'success' : 'failure',
              context: 'pages/deploy',
              description,
              target_url: targetUrl,
            });
            if (process.env.PR_NUMBER) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body: [
                  `### Pages deployment ${ok ? 'succeeded' : 'failed'}`,
                  `- Build: **${process.env.BUILD_RESULT}**`,
                  `- Deploy + live emblem verification: **${process.env.DEPLOY_RESULT}**`,
                  `- Workflow run: ${targetUrl}`,
                  `- Requested SHA: \`${process.env.STATUS_SHA}\``,
                  `- Expected release: \`cloak-20260725-3\``,
                ].join('\n'),
              });
            }
