name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate content, literary style, and types
        run: npm run check

      - name: Generate sitemap
        run: npm run sitemap

      - name: Build
        run: npm run build
        env:
          # The custom domain serves the Pages artifact from the site root.
          VITE_BASE: /
          # Optional shared comments/ratings backend (Supabase). Leave the repo
          # Variables unset to keep the local-only store. The anon key is public
          # by design (protected by Row Level Security) — repo Variables, not
          # Secrets, so Vite can inline it at build time. See docs/COMMENTS_SETUP.md.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Prerender OG pages (essays, poets, articles)
        run: npm run prerender

      - name: SPA fallback (serve the app for deep links / refresh)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the custom domain serves the approved emblem release
        env:
          EXPECTED_VERSION: cloak-20260725-3
          EXPECTED_MASTER_SHA256: 186ed97c95eed248e9a4cdca3a01e3f2bc93a6681729c0fdc73f2c484df3ea4d
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            nonce="${GITHUB_SHA}-${attempt}"
            echo "Live verification attempt ${attempt}/36"

            release="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "https://thelegendarypoet.ru/brand-release.txt?verify=${nonce}" || true)"
            html="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "https://thelegendarypoet.ru/?brand_verify=${nonce}" || true)"

            if [[ "${release}" == "${EXPECTED_VERSION}"$'\n'"master-sha256=${EXPECTED_MASTER_SHA256}" ]] \
              && grep -Fq "name=\"brand-release\" content=\"${EXPECTED_VERSION}\"" <<<"${html}"; then
              curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
                "https://thelegendarypoet.ru/brand-emblem-master.webp?v=${EXPECTED_VERSION}&verify=${nonce}" \
                -o /tmp/brand-emblem-master.webp
              echo "${EXPECTED_MASTER_SHA256}  /tmp/brand-emblem-master.webp" | sha256sum -c -

              svg="$(curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' \
                "https://thelegendarypoet.ru/brand-emblem.svg?verify=${nonce}")"
              grep -Fq "brand-emblem-master.webp?v=${EXPECTED_VERSION}" <<<"${svg}"
              if grep -Eq '<(path|circle|ellipse|polygon|polyline)([[:space:]>])' <<<"${svg}"; then
                echo "Standalone SVG still contains a retired substitute character"
              else
                echo "Verified ${EXPECTED_VERSION} on the custom domain with the approved master SHA-256"
                exit 0
              fi
            fi

            sleep 10
          done

          echo "::error::GitHub Pages deployment finished, but the custom domain did not serve ${EXPECTED_VERSION} with the approved emblem within six minutes."
          exit 1
