name: Yesenin Materialy RSL Fragment Route

on:
  push:
    branches:
      - research/yesenin-materialy-rsl-fragment-route-discovery
  pull_request:
    branches:
      - research/yesenin-materialy-page110-access-discovery-pass27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Inspect exact RSL fragment and reading-room routes
        run: node scripts/discover-yesenin-materialy-rsl-fragment-route.mjs
      - name: Upload immutable RSL access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-materialy-rsl-fragment-route
          path: artifacts/yesenin-materialy-rsl-fragment-route
          if-no-files-found: error
          retention-days: 14
