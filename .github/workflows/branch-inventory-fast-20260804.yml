name: Fast remaining branch PR map

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-inventory-fast-20260804.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            const pulls = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'all', sort: 'updated', direction: 'desc', per_page: 100});
            const rows = branches.map(b => {
              const prs = pulls.filter(p => p.head.repo && p.head.repo.full_name === `${owner}/${repo}` && p.head.ref === b.name);
              return {
                branch: b.name,
                sha: b.commit.sha,
                protected: b.protected,
                prs: prs.map(p => ({number:p.number,state:p.state,mergedAt:p.merged_at,closedAt:p.closed_at,base:p.base.ref,headSha:p.head.sha,title:p.title,draft:p.draft,body:(p.body||'').slice(0,1600)}))
              };
            });
            const report = {repository:`${owner}/${repo}`,runSha:context.sha,generatedAt:new Date().toISOString(),branchCount:branches.length,pullCount:pulls.length,branches:rows};
            const path='qa/remaining-branch-pr-map-2026-08-04.json';
            let current;
            try { current = await github.rest.repos.getContent({owner,repo,path,ref:'main'}); } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'audit(branches): record fast remaining branch PR map',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),sha:current?.data?.sha});
