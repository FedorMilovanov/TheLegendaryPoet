name: Yesenin Mariengof Access State Pass 13

on:
  workflow_dispatch:
  push:
    branches: [research/yesenin-mariengof-access-state-pass13-clean]
    paths:
      - 'package.json'
      - 'src/data/essays/yeseninPartOneMariengofAccessPassThirteen.ts'
      - 'src/data/essays/yeseninPartOnePhysicalWitnessEffectiveState.ts'
      - 'scripts/validate-yesenin-part-one-mariengof-access-pass13.ts'
      - 'research/yesenin/PART_ONE_MARIENGOF_ACCESS_PASS13_2026-07-25.md'
      - '.github/workflows/yesenin-mariengof-access-pass13.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [work/local-images-playwright-wtoc]
    paths:
      - 'package.json'
      - 'src/data/essays/yeseninPartOneMariengofAccessPassThirteen.ts'
      - 'src/data/essays/yeseninPartOnePhysicalWitnessEffectiveState.ts'
      - 'scripts/validate-yesenin-part-one-mariengof-access-pass13.ts'
      - 'research/yesenin/PART_ONE_MARIENGOF_ACCESS_PASS13_2026-07-25.md'
      - '.github/workflows/yesenin-mariengof-access-pass13.yml'
      - '.github/workflows/ci.yml'

concurrency:
  group: yesenin-mariengof-access-pass13-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-access-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Prepare evidence directory
        run: mkdir -p artifacts/yesenin-mariengof-access-pass13
      - name: Validate exact Mariengof access records
        shell: bash
        run: |
          set -o pipefail
          npm run validate:yesenin-part-one-mariengof-access \
            | tee artifacts/yesenin-mariengof-access-pass13/access-state.json
      - name: Revalidate complete effective witness state
        shell: bash
        run: |
          set -o pipefail
          npm run validate:yesenin-part-one-effective-witnesses \
            | tee artifacts/yesenin-mariengof-access-pass13/effective-state.json
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Upload access-state evidence
        uses: actions/upload-artifact@v4
        with:
          name: yesenin-mariengof-access-pass13
          path: artifacts/yesenin-mariengof-access-pass13
          if-no-files-found: error
          retention-days: 7
