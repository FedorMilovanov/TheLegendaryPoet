name: Temporary Approved Brand Platform Rebuild

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/_temp-approved-brand-platform-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/approved-brand-integrity-complete-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/approved-brand-integrity-complete-20260725
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned toolchains
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm ci

      - name: Decode approved runtime sources without accepting an incomplete inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          for pair in \
            'master-320-q92.webp.b64:brand-emblem-master.webp' \
            'favicon-16.png.b64:favicon-16.png' \
            'favicon-32.png.b64:favicon-32.png'; do
            source_name="${pair%%:*}"
            output_name="${pair##*:}"
            tr -d '[:space:]' < "src/brand-assets/${source_name}" | base64 --decode > "public/${output_name}"
          done

      - name: Rebuild twice and prove deterministic platform bytes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild-approved-brand-platform-assets.py > approved-brand-first.json
          sha256sum \
            public/brand-emblem-master.webp \
            public/favicon-16.png \
            public/favicon-32.png \
            public/apple-touch-icon.png \
            public/icon-192.png \
            public/icon-512.png \
            public/icon-maskable-512.png \
            public/mstile-150x150.png \
            public/og-image.jpg \
            src/brand-assets/approved-brand-manifest.json > approved-brand-first.sha256

          python scripts/rebuild-approved-brand-platform-assets.py > approved-brand-second.json
          sha256sum \
            public/brand-emblem-master.webp \
            public/favicon-16.png \
            public/favicon-32.png \
            public/apple-touch-icon.png \
            public/icon-192.png \
            public/icon-512.png \
            public/icon-maskable-512.png \
            public/mstile-150x150.png \
            public/og-image.jpg \
            src/brand-assets/approved-brand-manifest.json > approved-brand-second.sha256

          diff -u approved-brand-first.sha256 approved-brand-second.sha256
          cmp approved-brand-first.json approved-brand-second.json

      - name: Validate complete inventory, TypeScript and production build
        env:
          VITE_BASE: /
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-brand-art.mjs
          npm run validate:brand
          npm run typecheck
          npm run sitemap
          npm run build

      - name: Commit only the five missing tracked derivatives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            public/apple-touch-icon.png \
            public/icon-192.png \
            public/icon-512.png \
            public/icon-maskable-512.png \
            public/mstile-150x150.png
          git diff --cached --stat
          git diff --cached --quiet && { echo 'Platform rebuild produced no tracked derivatives'; exit 1; }
          git commit -m 'fix(brand): restore complete approved platform icon set'
          git push origin HEAD:fix/approved-brand-integrity-complete-20260725

      - name: Upload deterministic rebuild evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: approved-brand-platform-rebuild-evidence
          path: |
            approved-brand-first.json
            approved-brand-second.json
            approved-brand-first.sha256
            approved-brand-second.sha256
            src/brand-assets/approved-brand-manifest.json
          if-no-files-found: warn
          retention-days: 7
