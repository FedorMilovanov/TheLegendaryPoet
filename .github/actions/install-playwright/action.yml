name: Install locked Playwright browsers
description: Install browser binaries through the exact @playwright/test version in package-lock.json.
inputs:
  browsers:
    description: Space-separated Playwright browser names.
    required: false
    default: chromium webkit
runs:
  using: composite
  steps:
    - name: Verify locked Playwright package
      shell: bash
      run: |
        node -e "const p=require('./package.json'); if (p.devDependencies?.['@playwright/test'] !== '1.61.1') process.exit(1)"
        npx playwright --version
    - name: Install Playwright browsers
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.browsers }}
