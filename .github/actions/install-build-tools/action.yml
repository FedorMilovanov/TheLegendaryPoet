name: Install deterministic build tools
description: Install the exact system packages required by deterministic asset materialization.
inputs:
  packages:
    description: Space-separated apt packages.
    required: false
    default: ffmpeg
runs:
  using: composite
  steps:
    - name: Install system build tools
      shell: bash
      run: |
        set -euo pipefail
        read -r -a packages <<< "$BUILD_TOOL_PACKAGES"
        bash "$BUILD_TOOL_ACTION_PATH/install.sh" "${packages[@]}"
      env:
        BUILD_TOOL_PACKAGES: ${{ inputs.packages }}
        BUILD_TOOL_ACTION_PATH: ${{ github.action_path }}
