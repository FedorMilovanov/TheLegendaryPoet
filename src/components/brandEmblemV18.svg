<desc id="d">Почти чёрная монолитная фигура в высоком тяжёлом капюшоне, с глубокой безликой пустотой, скрытой узкой шеей, смятым клобуком, широким эпическим плащом и рваной холодной верхне-боковой энергией без нижнего дыма</desc>
